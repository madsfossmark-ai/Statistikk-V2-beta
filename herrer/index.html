<style>
/* Layout: benk-verktøy, iPad liggende først – to registreringsfelt i bredden, nøkkeltall over, løpende tall under. Stables på smal skjerm.
   Design: mørk benkemodus (valgt 31.10.2026) – mørk flate, store knapper, rød/gul/grønn måler per spiller */
:root {
  --bg: #0D1117; --surface: #161B24; --sunk: #1D2430; --row: #1A202B; --line: #2A3240;
  --fg: #E8EBF0; --muted: #8B95A5; --faint: #6E7888; --soft: #C9D1DC;
  --accent: #8FB3FF; --accent-soft: #1E2A44; --accent-fg: #0D1117; --accent-ink: #C9D6F0; --accent-bar: #2E4A86; --hero: #2E4A86;
  --opp: #FFB547; --opp-soft: #1E1912; --opp-strong: #B4641C; --opp-nr: #8A4A12;
  --amber: #FFB547; --amber-fg: #1A1203;
  --bad: #C2362D; --block: #7E2520; --neutral: #4A5464; --good: #1E8A57;
  --lvl-lo: #F07167; --lvl-mid: #FFC94A; --lvl-hi: #4CD08A;
  --win-bg: #16402C; --loss-bg: #4A1F1D; --live-bg: #3A2A10;
  --bar: #161B24; --bar-fg: #FFFFFF; --bar-muted: #8B95A5;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F2F1EC; --surface: #FFFFFF; --sunk: #E7E5DE; --row: #F7F6F2; --line: #D9D6CD;
  --fg: #16181D; --muted: #4A4F5A; --faint: #6B7080; --soft: #2A2E37;
  --accent: #1B4592; --accent-soft: #DCE4F5; --accent-fg: #FFFFFF; --accent-ink: #122F66; --accent-bar: #2F63C4; --hero: #1B4592;
  --opp: #8A3E0F; --opp-soft: #F5DFCF; --opp-strong: #C85E1C; --opp-nr: #C85E1C;
  --amber: #C27C0E; --amber-fg: #FFFFFF;
  --bad: #B3261E; --block: #7A1A14; --neutral: #5C6270; --good: #1F7A4D;
  --lvl-lo: #B3261E; --lvl-mid: #B07D0B; --lvl-hi: #1F7A4D;
  --win-bg: #DDEFE4; --loss-bg: #F7DCD9; --live-bg: #FBEBCC;
  --bar: #16181D; --bar-fg: #FFFFFF; --bar-muted: #B8BCC6; color-scheme: light;
}

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px;
  -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.display { font-family: var(--font-display); font-weight: 700; line-height: 1; }

.app { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* Topplinje */
.bar { background: var(--bar); color: var(--bar-fg); border-radius: 16px; padding: 8px 12px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bar a, .bar .link { color: #C9D6F0; text-decoration: none; background: none; border: 0; padding: 8px 4px; font-size: 14px; }
.bar .title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bar .title .display { font-size: 24px; }
.bar .sub { font-size: 12px; color: var(--bar-muted); }
.spacer { flex: 1; }
.score { display: flex; align-items: center; gap: 8px; }
.score .team { font-size: 13px; color: var(--bar-muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .pts { font-family: var(--font-display); font-size: 40px; font-weight: 700; min-width: 50px; text-align: center; }
.sbtn { width: 46px; height: 46px; border-radius: 10px; border: 1px solid #3A3F49; background: transparent; color: #FFFFFF; font-size: 22px; }
.sbtn.plus-us { background: var(--accent-bar); border-color: var(--accent-bar); }
.sbtn.plus-them { background: var(--opp-strong); border-color: var(--opp-strong); }
.barbtn { height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); color: #FFFFFF; font-weight: 600; font-size: 14px; }
.sets { font-family: var(--font-display); font-size: 18px; color: var(--bar-muted); }

/* Felles toppmeny */
.topnav { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; background: var(--surface); border-radius: 16px; padding: 8px 10px; }
.topnav .tn-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topnav .ctx-pick select { height: 44px; border-radius: 12px; background-color: var(--sunk); color: var(--fg); text-transform: none; letter-spacing: 0; font-size: 14px; }
.navtabs { display: flex; gap: 4px; background: var(--bg); border-radius: 12px; padding: 4px; flex-wrap: wrap; }
.navtab { min-height: 40px; padding: 0 16px; display: inline-flex; align-items: center; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; text-decoration: none; }
.navtab[aria-current="page"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.sec-h { font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
@media (max-width: 640px) { .topnav .spacer { display: none; } .navtabs { order: 3; width: 100%; } .navtab { flex: 1; justify-content: center; padding: 0 6px; } .topnav .menu-wrap { margin-left: auto; } }

/* Generelle flater */
.panel { background: var(--surface); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel-head h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.panel.opp .panel-head h2 { color: var(--opp); }
.textbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 8px 0; }
.empty { font-size: 13px; color: var(--muted); padding: 6px 0; }

.score-wrap { display: flex; align-items: center; gap: 18px; }
.setpill { font-family: var(--font-display); font-weight: 700; font-size: 30px; padding: 2px 14px; border-radius: 10px; background: var(--sunk); color: var(--amber); }
.barbtn.primary-bar { background: var(--accent-bar); border-color: var(--accent-bar); }
.setform { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.setin { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--bar-muted); }
.setin input { width: 64px; height: 46px; box-sizing: border-box; border: 1px solid #3A3F49; border-radius: 10px; background: #2A2E37; color: #FFFFFF; text-align: center; font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.setform .dash { font-family: var(--font-display); font-size: 26px; color: var(--bar-muted); padding-top: 14px; }
.sk .sk-sc { font-weight: 500; margin-left: 6px; }
.barbtn.win { background: var(--good); border-color: var(--good); }
.barbtn.lose { background: var(--opp-strong); border-color: var(--opp-strong); }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Registrering: én rad per spiller, ett trykk. Mobil: alt stablet. Nettbrett: registrering side om side, tall under. Bred iPad: tre kolonner på én skjerm */
.live-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.sa-head, .sa-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 12px; align-items: center; }
.sa-head .label:not(:first-child) { text-align: center; }
.step { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); font-size: 11px; margin-right: 6px; letter-spacing: 0; }
.panel.opp .step { background: var(--opp-strong); color: #FFFFFF; }
.sa-grp { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stats-body { display: flex; flex-direction: column; gap: 14px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.who { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "nr nm" "nr mini"; column-gap: 10px; align-items: center; min-width: 0; }
.who .nr { grid-area: nr; }
.who .nm { grid-area: nm; align-self: end; }
.who .mini { grid-area: mini; align-self: start; }
.who .mini:empty { display: none; }
.who:not(:has(.nm)) .mini { grid-row: 1 / span 2; align-self: center; }
.nr { flex: none; width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; background: var(--hero); color: #FFFFFF; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; }
.nr.opp { background: var(--opp-strong); }
.nm { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mini { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.codes { display: flex; gap: 6px; }
.code { width: 52px; height: 48px; border: 0; border-radius: 10px; color: #FFFFFF; font-family: var(--font-display); font-weight: 700; font-size: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; transition: transform .08s; }
.code small { font-family: var(--font-body); font-size: 10px; font-weight: 500; margin-top: 2px; }
.code:active { transform: scale(.94); }
.c-bad { background: var(--bad); } .c-block { background: var(--block); } .c-mid { background: var(--neutral); } .c-good { background: var(--good); }
.code.flash { box-shadow: 0 0 0 4px var(--accent); }
.code-legend { font-size: 12px; color: var(--muted); }
.addopp { display: flex; gap: 6px; }
.addopp input { width: 90px; height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px; font-size: 16px; }
.addopp button { height: 44px; padding: 0 12px; border-radius: 10px; border: 1px dashed var(--opp); background: var(--surface); color: var(--opp); font-weight: 600; }

/* Registrering i nytt design: nr, navn med måler og snitt, store knapper som fyller bredden */
.kpis2 { display: grid; grid-template-columns: 128px repeat(5, minmax(0, 1fr)); gap: 8px; }
.kpi2 { background: var(--surface); border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi2 .l { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi2 .v { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.kpi2 .v b { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; }
.kpi2 .v span { font-size: 11px; color: var(--muted); }
.kpi2.scope { border: 1px solid var(--line); background: var(--sunk); color: var(--fg); text-align: left; justify-content: center; }
.kpi2.scope b { font-size: 14px; } .kpi2.scope span { font-size: 10px; color: var(--muted); }
.lvl-lo { color: var(--lvl-lo); } .lvl-mid { color: var(--lvl-mid); } .lvl-hi { color: var(--lvl-hi); } .lvl-na { color: var(--muted); }
.court-chips { display: flex; gap: 4px; border: 0; background: transparent; padding: 0; }
.cchip { width: 42px; height: 44px; border-radius: 10px; background: var(--sunk); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--fg); }
.cchip b { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1; }
.cchip i { font-style: normal; font-size: 9px; font-weight: 700; color: var(--accent); }
.cchip i.r-O { color: var(--amber); } .cchip i.r-L { color: var(--lvl-hi); }
#live-root .row { grid-template-columns: 150px minmax(0, 1fr); gap: 8px; }
#live-root .who { grid-template-areas: "nr nm" "nr mini"; }
#live-root .who .nr { width: 40px; height: 40px; font-size: 20px; }
#live-root .nm { font-size: 13px; }
#live-root .who .mini { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; white-space: nowrap; }
#live-root .who .mini .avgbar { flex-basis: 100%; }
#live-root .who .mini .weak-tag.reg { margin: 0; font-size: 9px; padding: 1px 6px; }
#live-root .who .mini .avgbar.blk { width: 100%; height: 7px; border-radius: 4px; margin-top: 3px; background: var(--line); }
#live-root .mt { font-size: 11px; color: var(--muted); } #live-root .mt b { font-weight: 700; }
#live-root .codes { gap: 8px; }
#live-root .code { flex: 1; width: auto; min-width: 0; height: 54px; border-radius: 12px; font-size: 26px; font-weight: 800; }
#live-root .p-rec .code, #live-root .p-opp .code { height: 58px; font-size: 28px; }
#live-root .code small { display: none; }
#live-root .panel-head h2 { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
#live-root .panel.opp { background: var(--opp-soft); }
#live-root .nr.opp { background: var(--opp-nr); }
#live-root .weak-tag.reg { display: inline-block; margin: 2px 0 0; }
.barbtn.primary-bar, .barbtn.amber { background: var(--amber); border-color: var(--amber); color: var(--amber-fg); font-weight: 700; }
.ov-scrim { position: fixed; inset: 0; z-index: 55; background: rgba(5, 8, 12, .72); display: grid; place-items: center; padding: 16px; }
.ov-modal { width: min(680px, 100%); max-height: calc(100vh - 32px); overflow: auto; border: 1px solid var(--line); border-radius: 20px; padding: 16px; gap: 10px; }
.bytte-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.bytte-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bchip { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunk); color: var(--fg); text-align: left; }
.bchip .nr { width: 32px; height: 32px; font-size: 16px; }
.bchip .nm { flex: 1; font-size: 14px; }
.bchip i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--accent); }
.bchip.sel { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.ov-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.primary:disabled { opacity: .4; cursor: default; }
@media (max-width: 1100px) { .kpis2 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cchip { width: 36px; height: 40px; } .cchip b { font-size: 16px; } }
@media (max-width: 759px) { .kpis2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .court-chips { display: none; } #live-root .row { grid-template-columns: minmax(0, 1fr); } .bytte-grid { grid-template-columns: minmax(0, 1fr); } }

/* Oppstillingsvelgeren (moduler/oppstilling) i mørk benkemodus, uansett innstilling i operativsystemet */
html:not([data-theme="light"]) .ops-slot { background: rgba(22, 27, 36, .92); }
html:not([data-theme="light"]) .ops-slot.tom { background: rgba(22, 27, 36, .6); }
html:not([data-theme="light"]) .ops-slot.libero { background: #3A2E14; }
html:not([data-theme="light"]) .ops-slot .lib { color: var(--amber); }
html:not([data-theme="light"]) .ops-feil { background: #3A1614; color: #FFB4AB; }
html:not([data-theme="light"]) .ops-info { background: #3A2614; color: #F2B27A; }
html:not([data-theme="light"]) .ops-seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

/* Siste registreringer */
.lastbar { background: var(--surface); border-radius: 14px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip { font-size: 13px; padding: 6px 10px; border-radius: 99px; background: var(--sunk); }
.chip.first { background: var(--accent-soft); font-weight: 600; }
.undo { height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--lvl-lo); background: transparent; color: var(--lvl-lo); font-weight: 600; }
.undo:disabled { opacity: .4; cursor: default; }

/* Statistikk */
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 11px; font-weight: 500; color: var(--muted); text-align: right; padding: 2px 4px 4px; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 4px; border-top: 1px solid var(--sunk); }
.tbl tr.total td { font-weight: 700; border-top: 1px solid var(--line); }
.tbl td.key { font-weight: 600; }
.tbl td:not(:first-child):not(.l-al) { white-space: nowrap; }
@media (max-width: 640px) {
  .tbl .hide-sm { display: none; }
  .t-games th:nth-child(5), .t-games td:nth-child(5), .t-games th:nth-child(n+7):nth-child(-n+9), .t-games td:nth-child(n+7):nth-child(-n+9) { display: none; }
  .t-players th:nth-child(2), .t-players td:nth-child(2), .t-players th:nth-child(5), .t-players td:nth-child(5), .t-players th:nth-child(8), .t-players td:nth-child(8), .t-players th:nth-child(n+9), .t-players td:nth-child(n+9) { display: none; }
  .t-att th:nth-child(7), .t-att td:nth-child(7) { display: none; }
  .tbl { font-size: 14px; }
  .lastbar .chip:nth-child(n+4) { display: none; }
  .kk-controls { flex-direction: column; align-items: stretch; }
  .kk-controls .seg { flex: none; }
  .kk-controls .kk-pick { width: 100%; align-items: stretch; }
  .listhead > div:first-child, .lh-id, .lh-id > div { min-width: 0; max-width: 100%; }
  .ctx-pick, .ctx-pick select { max-width: 100%; }
  .ctx-pick select { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  .listhead h1 { font-size: 34px; }
  .listhead .primary, .listhead .secondary { height: 42px; padding: 0 14px; }
  .tabs button { height: 34px; padding: 0 12px; }
  .next { padding: 14px 16px; gap: 10px; }
  .next .crest.img.lg { width: 44px; height: 44px; }
  .det-bar .display { font-size: 21px; }
}
.tbl-wrap { overflow-x: auto; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.kpi { background: var(--sunk); border-radius: 8px; padding: 6px 8px; }
.kpi .display { font-size: 22px; }
.kpi .k { font-size: 11px; color: var(--muted); }
.warn { color: var(--bad); }
.small-n { color: var(--faint); }

/* Kampliste */
/* Toppen av kamplisten: lagvelger på egen linje, så lagmerke og «Kamper» på samme midtlinje */
.listhead { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.listhead .lh-ctx { max-width: 100%; }
.listhead .lh-id { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.listhead .lh-id h1 { line-height: 1; }
.listhead .lh-id .status { flex-basis: 100%; }
.list-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

<script data-modul="scouting/analyse.js">
/*
 * Scouting & Serveplan V1 – analysemodell (ren JavaScript, ingen DOM).
 * Brukes av moduler/scouting/scouting.html i nettleseren og av testene i Node.
 *
 * Inndata: samme form som den åpne sidens data.json (offentlig/bygg.py):
 *   { roster: [...], matches: [{ id, data }], logs: { <kampId>: { <loggdok>: { events: [...] } } }, opponents: { <lag>: { players } } }
 * Utdata: normaliserte observasjoner med kildesporing, nøkkeltall og en forklarbar serveprioritering.
 * Ingenting her skriver data. Trenerens vurderinger holdes utenfor alle beregninger.
 * Se docs/scouting.md for definisjoner.
 */
(function (root) {
  'use strict';

  const KILDENAVN = { egen: 'Egen føring', NVBF: 'NVBF', CEV: 'CEV' };
  // Definisjonsfamilier: tall med ulik definisjon summeres aldri sammen
  const DEF = { dv: 'datavolley', egen: 'egen-0-1-2' };
  const MIN_MOTTAK = 5;      // under dette rangeres ikke en mottaker
  const KRYMP = 10;          // antall «tenkte» mottak på lagsnittet (krymping mot snitt)

  const norm = (s) => String(s == null ? '' : s).replace(/\s*\(L\)\s*$/, '').trim().toLowerCase();
  const lagNokkel = (s) => norm(s).replace(/\s+(volleyball(klubb)?|vbk|il)$/, '');
  const tall = (v) => { if (v == null || v === '' || v === '-' || v === '.') return 0; const x = Number(String(v).replace(',', '.')); return isNaN(x) ? 0 : x; };
  const prosent = (v) => { if (v == null) return null; const x = parseFloat(String(v).replace('%', '').replace(',', '.').replace('−', '-')); return isNaN(x) ? null : x; };

  // ---------- Innlesing ----------

  function lesData(d) {
    const matches = (d.matches || []).map((m) => (m.data ? Object.assign({ id: m.id }, m.data) : m));
    const logs = {};
    Object.entries(d.logs || {}).forEach(([id, docs]) => {
      logs[id] = Array.isArray(docs) ? docs : [].concat(...Object.values(docs).map((x) => (x && x.events) || []));
    });
    return { __lest: true, matches, logs, roster: d.roster || [], opponents: d.opponents || {} };
  }

  // ---------- Normalisering ----------

  /* Én observasjon = én spiller, én kamp, én kategori, fra én kilde.
   * { kampId, dato, lag, motstander, nr, navn, kategori: 'mottak'|'angrep'|'serve', kilde, definisjon,
   *   omfang: 'kamp'|'delvis', hentet, tall: {...}, flagg: [...] } */
  function offisiellKilde(nv) { return nv && nv.src === 'CEV' ? 'CEV' : 'NVBF'; }

  function offisielleObs(m) {
    const nv = m.nvbf; if (!nv || !nv.teams || !nv.teams.length) return [];
    const kilde = offisiellKilde(nv), out = [];
    // Hele kampen som venter på kontroll regnes som hele kampen, men flagges. Settuttrekk og gamle delvise felt er delvise.
    const omfang = nv.scope === 'match' ? 'kamp' : nv.partial || nv.scope === 'set' ? 'delvis' : 'kamp';
    const forelopig = nv.scope === 'match' && nv.partial;
    nv.teams.forEach((t) => {
      const mot = nv.teams.find((x) => x !== t);
      const lagFlagg = forelopig ? ['Foreløpige tall (ikke bekreftet som endelige)'] : [];
      if (t.totals && t.totals.rec && prosent(t.totals.recPerf) === 0) lagFlagg.push('0 % perfekte mottak hos laget (mulig forenklet føring)');
      (t.players || []).forEach((p) => {
        const base = { kampId: m.id, dato: m.date || null, lag: t.name, motstander: mot ? mot.name : null, nr: String(p.nr || ''), navn: String(p.name || '').replace(/\s*\(L\)\s*$/, ''),
          kilde, definisjon: DEF.dv, omfang, hentet: nv.statsFetchedAt || nv.checked || null, flagg: lagFlagg.slice() };
        if (p.rec) out.push(Object.assign({}, base, { kategori: 'mottak', tall: { n: tall(p.rec), feil: tall(p.recErr), posPct: prosent(p.recPos), perfPct: prosent(p.recPerf) } }));
        if (p.att) out.push(Object.assign({}, base, { kategori: 'angrep', tall: { n: tall(p.att), kill: tall(p.kills), feil: tall(p.attErr), blokkert: tall(p.blocked) } }));
        if (p.srv || p.aces || p.srvErr) out.push(Object.assign({}, base, { kategori: 'serve', tall: { n: p.srv != null ? tall(p.srv) : null, ess: tall(p.aces), feil: tall(p.srvErr) } }));
      });
    });
    return out;
  }

  function egneObs(m, events, data, our) {
    if (!events || !events.length) return [];
    const us = m.focus || our, them = m.home === us ? m.away : m.home;
    const ros = m.focus ? null : data.roster;
    const oppRos = ((data.opponents[them] || {}).players || []);
    const fokusRos = m.focus ? ((data.opponents[m.focus] || {}).players || []) : [];
    const spiller = (id) => {
      if (ros) { const r = ros.find((x) => x.id === id); return r ? { nr: String(r.nr || ''), navn: r.name || '' } : { nr: '', navn: String(id) }; }
      const nr = String(id).split(':').pop(); const r = fokusRos.find((x) => String(x.nr) === nr); return { nr, navn: (r && r.name) || '' };
    };
    const acc = {};
    const add = (lag, mot, sp, kat, f) => {
      const k = lag + '|' + (sp.nr || sp.navn) + '|' + kat;
      const o = acc[k] || (acc[k] = { kampId: m.id, dato: m.date || null, lag, motstander: mot, nr: sp.nr, navn: sp.navn, kategori: kat, kilde: 'egen', definisjon: DEF.egen,
        omfang: m.status === 'ferdig' ? 'kamp' : 'delvis', hentet: null, flagg: [], tall: kat === 'mottak' ? { n: 0, feil: 0, k1: 0, k2: 0 } : kat === 'angrep' ? { n: 0, kill: 0, feil: 0, blokkert: 0 } : { n: 0, ess: 0, feil: 0 } });
      f(o.tall);
    };
    events.forEach((e) => {
      if (e.type === 'rec') add(us, them, spiller(e.p), 'mottak', (t) => { t.n++; if (e.c === '0') t.feil++; if (e.c === '1') t.k1++; if (e.c === '2') t.k2++; });
      else if (e.type === 'opp') { const r = oppRos.find((x) => String(x.nr) === String(e.p)); add(them, us, { nr: String(e.p), navn: (r && r.name) || '' }, 'mottak', (t) => { t.n++; if (e.c === '0') t.feil++; if (e.c === '1') t.k1++; if (e.c === '2') t.k2++; }); }
      else if (e.type === 'att') add(us, them, spiller(e.p), 'angrep', (t) => { t.n++; if (e.c === '2') t.kill++; if (e.c === '0') t.feil++; if (e.c === 'B') t.blokkert++; });
      else if (e.type === 'srv') add(us, them, spiller(e.p), 'serve', (t) => { t.n++; if (e.c === 'E') t.ess++; if (e.c === 'F') t.feil++; });
    });
    return Object.values(acc);
  }

  /* Velger én kilde per kamp, lag og kategori, og fjerner doble kampdokumenter.
   * Rekkefølge: offisiell for hele kampen > egen føring > offisiell delvis (for eksempel bare sett 1).
   * Settuttrekk og kamputtrekk summeres aldri: hver kamp har ett statistikkfelt, og et delvis uttrekk
   * brukes bare når ingenting bedre finnes. Alle valg logges i `beslutninger`. */
  function normaliser(raw, opts) {
    const data = raw && raw.__lest ? raw : lesData(raw || {});
    const our = (opts && opts.our) || 'Randaberg';
    const beslutninger = [];
    // Doble kampdokumenter: samme dato og lag
    const sett = {}, kamper = [];
    data.matches.filter((m) => m.round !== 'Test' && !m.test).forEach((m) => {
      const k = String(m.date || '').slice(0, 10) + '|' + lagNokkel(m.home) + '|' + lagNokkel(m.away);
      const mengde = (m.nvbf && m.nvbf.teams ? 2 : 0) + ((data.logs[m.id] || []).length ? 1 : 0);
      if (sett[k]) {
        const forrige = sett[k];
        const pm = (forrige.nvbf && forrige.nvbf.teams ? 2 : 0) + ((data.logs[forrige.id] || []).length ? 1 : 0);
        const behold = mengde > pm ? m : forrige, dropp = behold === m ? forrige : m;
        beslutninger.push({ type: 'dobbel-kamp', tekst: `${dropp.id} er samme kamp som ${behold.id} (${k}); brukte ${behold.id}` });
        if (behold === m) { kamper[kamper.indexOf(forrige)] = m; sett[k] = m; }
        return;
      }
      sett[k] = m; kamper.push(m);
    });
    const obs = [];
    kamper.forEach((m) => {
      const off = offisielleObs(m), egen = egneObs(m, data.logs[m.id], data, our);
      const grupper = {};
      off.concat(egen).forEach((o) => { const k = lagNokkel(o.lag) + '|' + o.kategori; (grupper[k] || (grupper[k] = [])).push(o); });
      Object.entries(grupper).forEach(([k, liste]) => {
        const har = (f) => liste.some(f);
        const valg = har((o) => o.kilde !== 'egen' && o.omfang === 'kamp') ? (o) => o.kilde !== 'egen' && o.omfang === 'kamp'
          : har((o) => o.kilde === 'egen') ? (o) => o.kilde === 'egen' : (o) => o.kilde !== 'egen';
        const brukt = liste.filter(valg), forkastet = liste.filter((o) => !valg(o));
        if (forkastet.length) {
          const kb = brukt[0], kf = forkastet[0];
          beslutninger.push({ type: 'kildevalg', kampId: m.id, tekst: `${m.id}, ${kb.lag} ${kb.kategori}: brukte ${KILDENAVN[kb.kilde]} (${kb.omfang}), ikke ${KILDENAVN[kf.kilde]} (${kf.omfang}, ${forkastet.reduce((a, o) => a + (o.tall.n || 0), 0)} forsøk)` });
        }
        brukt.forEach((o) => obs.push(o));
      });
    });
    return { kamper, obs, beslutninger, our };
  }

  // ---------- Nøkkeltall ----------

  /* Positiv mottaksprosent fra avrundede prosenter: hver kamp gir et heltall p (avrundet) av n mottak.
   * Riktig antall ligger i [ceil((p-0.5)·n/100), floor((p+0.5)·n/100)]. Vi summerer intervallene
   * og et punktanslag (round(p·n/100)). Nevneren er bare mottak med denne definisjonen. */
  function andelFraProsent(liste, felt) {
    let n = 0, pkt = 0, lo = 0, hi = 0, avrundet = false;
    liste.forEach((o) => {
      const p = o.tall[felt]; if (p == null || !o.tall.n) return;
      const x = o.tall.n;
      n += x; pkt += Math.round(p * x / 100);
      const a = Math.max(0, Math.ceil(((p - 0.5) * x / 100) - 1e-9)), b = Math.min(x, Math.floor(((p + 0.5) * x / 100) + 1e-9));
      lo += Math.min(a, b); hi += Math.max(a, b);
      if (a !== b) avrundet = true;  // antallet kan ikke bestemmes entydig fra den avrundede prosenten
    });
    return n ? { n, antall: pkt, lo, hi, pct: 100 * pkt / n, loPct: 100 * lo / n, hiPct: 100 * hi / n, avrundet } : null;
  }

  function mottak(liste) {
    const n = liste.reduce((a, o) => a + o.tall.n, 0), feil = liste.reduce((a, o) => a + o.tall.feil, 0);
    const dv = liste.filter((o) => o.definisjon === DEF.dv), eg = liste.filter((o) => o.definisjon === DEF.egen);
    const egN = eg.reduce((a, o) => a + o.tall.n, 0);
    return {
      n, feil, feilPct: n ? 100 * feil / n : null,
      positiv: andelFraProsent(dv, 'posPct'),          // DataVolley Pos% (CEV/NVBF)
      perfekt: andelFraProsent(dv, 'perfPct'),          // DataVolley Exc.%
      egen: egN ? { n: egN, k2: eg.reduce((a, o) => a + o.tall.k2, 0), k1: eg.reduce((a, o) => a + o.tall.k1, 0), snitt: eg.reduce((a, o) => a + o.tall.k1 + 2 * o.tall.k2, 0) / egN } : null,
      kamper: new Set(liste.map((o) => o.kampId)).size,
      kilder: [...new Set(liste.map((o) => o.kilde))],
    };
  }

  function angrep(liste, lagN) {
    const s = (f) => liste.reduce((a, o) => a + (o.tall[f] || 0), 0);
    const n = s('n'), kill = s('kill'), feil = s('feil'), blokkert = s('blokkert');
    return { n, kill, feil, blokkert, killPct: n ? 100 * kill / n : null, feilPct: n ? 100 * feil / n : null, blokkertPct: n ? 100 * blokkert / n : null,
      eff: n ? 100 * (kill - feil - blokkert) / n : null, andel: lagN ? 100 * n / lagN : null, kamper: new Set(liste.map((o) => o.kampId)).size, kilder: [...new Set(liste.map((o) => o.kilde))] };
  }

  function serve(liste) {
    const kjent = liste.filter((o) => o.tall.n != null), n = kjent.reduce((a, o) => a + o.tall.n, 0);
    const ess = liste.reduce((a, o) => a + o.tall.ess, 0), feil = liste.reduce((a, o) => a + o.tall.feil, 0);
    return { n: kjent.length ? n : null, ess, feil, essPct: n ? 100 * kjent.reduce((a, o) => a + o.tall.ess, 0) / n : null, feilPct: n ? 100 * kjent.reduce((a, o) => a + o.tall.feil, 0) / n : null,
      kamper: new Set(liste.map((o) => o.kampId)).size, kilder: [...new Set(liste.map((o) => o.kilde))] };
  }

  // ---------- Lagprofil ----------

  function spillerNokkel(o) { return o.nr ? '#' + o.nr : 'n:' + norm(o.navn); }

  function lagprofil(modell, lag, opts) {
    const ferOm = (opts && opts.foer) || null;      // bare kamper før denne datoen (plan før kamp)
    const unntak = (opts && opts.utenKamp) || null; // og aldri kampen som analyseres
    const mine = modell.obs.filter((o) => lagNokkel(o.lag) === lagNokkel(lag) && (!ferOm || (o.dato && o.dato < ferOm)) && o.kampId !== unntak);
    const spillere = {};
    mine.forEach((o) => {
      const k = spillerNokkel(o);
      const s = spillere[k] || (spillere[k] = { nr: o.nr, navn: [], obs: [] });
      if (o.navn && !s.navn.includes(o.navn)) s.navn.push(o.navn);
      s.obs.push(o);
    });
    const lagAngrep = mine.filter((o) => o.kategori === 'angrep').reduce((a, o) => a + o.tall.n, 0);
    const ut = Object.values(spillere).map((s) => {
      const m = s.obs.filter((o) => o.kategori === 'mottak'), a = s.obs.filter((o) => o.kategori === 'angrep'), v = s.obs.filter((o) => o.kategori === 'serve');
      const flagg = [...new Set(s.obs.flatMap((o) => o.flagg))];
      if (s.navn.length > 1) flagg.push('Ulike navn på samme nummer: ' + s.navn.join(' / '));
      if (s.navn.some((n) => /ukjent spiller|player unknown/i.test(n))) flagg.push('Navnet mangler i kilden');
      return { nr: s.nr, navn: s.navn[0] || '', navn_alle: s.navn, mottak: m.length ? mottak(m) : null, angrep: a.length ? angrep(a, lagAngrep) : null, serve: v.length ? serve(v) : null, flagg };
    }).sort((x, y) => (Number(x.nr) || 999) - (Number(y.nr) || 999));
    const kamper = [...new Set(mine.map((o) => o.kampId))];
    const kilder = {};
    mine.forEach((o) => { (kilder[o.kilde] || (kilder[o.kilde] = new Set())).add(o.kampId); });
    return { lag, kamper, kilder: Object.fromEntries(Object.entries(kilder).map(([k, v]) => [k, [...v]])), spillere: ut,
      lagMottak: mine.some((o) => o.kategori === 'mottak') ? mottak(mine.filter((o) => o.kategori === 'mottak')) : null, lagAngrep };
  }

  // ---------- Serveprioritering ----------

  function kvalitet(m) {
    if (!m || m.n < MIN_MOTTAK) return { nivaa: 'for lite', tekst: `under ${MIN_MOTTAK} mottak – rangeres ikke` };
    if (m.n >= 20 && m.kamper >= 2) return { nivaa: 'god', tekst: `${m.n} mottak i ${m.kamper} kamper` };
    if (m.n >= 10) return { nivaa: 'middels', tekst: `${m.n} mottak i ${m.kamper} kamp${m.kamper > 1 ? 'er' : ''}` };
    return { nivaa: 'svak', tekst: `bare ${m.n} mottak` };
  }

  const pct = (x, d) => x == null ? '–' : (Math.round(x * Math.pow(10, d || 0)) / Math.pow(10, d || 0)).toString().replace('.', ',').replace('-', '−') + '\u00a0%';

  /* Forklarbar prioritering. For hver mottaker:
   *   feil* = (feil + K·lagsnittFeil) / (n + K)           krympet mot lagets feilrate
   *   pos*  = (positive + K·lagsnittPos) / (nPos + K)      bare der CEV/NVBF har Pos%
   *   score = (feil* − lagsnittFeil) + ½·(lagsnittPos − pos*)   i prosentpoeng
   * Høyere score = svakere mottak enn lagsnittet = høyere prioritet. Under 5 mottak rangeres ikke.
   * Ingen rotasjon eller soner: grunnlaget har ikke det. Trenerens vurderinger påvirker ikke scoren. */
  function serveplan(profil) {
    const lm = profil.lagMottak; if (!lm || !lm.n) return { rader: [], grunnlag: 'Ingen mottaksdata for laget' };
    const e0 = lm.feil / lm.n, p0 = lm.positiv ? lm.positiv.antall / lm.positiv.n : null;

      let pk = null;
      if (p0 != null && m.positiv) pk = (m.positiv.antall + KRYMP * p0) / (m.positiv.n + KRYMP);
      const score = 100 * (ek - e0) + (pk != null ? 50 * (p0 - pk) : 0);
      const grunner = [`${m.feil} feil på ${m.n} mottak (${pct(m.feilPct)}), lagsnitt ${pct(100 * e0)}`];
      if (m.positiv) grunner.push(`positivt ${m.positiv.avrundet ? '≈ ' : ''}${pct(m.positiv.pct)} av ${m.positiv.n} mottak hos ${m.kilder.filter((k) => k !== 'egen').join('/')}` + (m.positiv.avrundet ? ` (${pct(m.positiv.loPct)}–${pct(m.positiv.hiPct)} pga. avrunding)` : '') + (p0 != null ? `, lagsnitt ${pct(100 * p0)}` : ''));
      if (m.egen) grunner.push(`egen føring: snitt ${m.egen.snitt.toFixed(2).replace('.', ',')} på ${m.egen.n} mottak (0–2-skala, ikke sammenlignbar med Pos%)`);
      return { nr: s.nr, navn: s.navn, n: m.n, kamper: m.kamper, kilder: m.kilder, feilPct: m.feilPct, positiv: m.positiv, egen: m.egen, score: q.nivaa === 'for lite' ? null : score,
        kvalitet: q, flagg: s.flagg, grunner };
    });
    rader.sort((a, b) => (a.score == null) - (b.score == null) || (b.score || 0) - (a.score || 0) || b.n - a.n);
    let rang = 0; rader.forEach((r) => { r.rang = r.score == null ? null : ++rang; });
    return { rader, lagsnitt: { feilPct: 100 * e0, posPct: p0 != null ? 100 * p0 : null, n: lm.n },
      grunnlag: `Krympet mot lagsnittet med ${KRYMP} mottak. Minst ${MIN_MOTTAK} mottak for rangering. Ingen rotasjons- eller sonedata.` };
  }

  // ---------- Under og etter kamp ----------

  function kampObs(modell, kampId, lag) {
    return modell.obs.filter((o) => o.kampId === kampId && (!lag || lagNokkel(o.lag) === lagNokkel(lag)));
  }

  /* Plan (bare kamper før denne) mot det som ble observert i kampen. Ingen årsakspåstander. */
  function etterKamp(modell, kamp, motstander, eget) {
    const plan = serveplan(lagprofil(modell, motstander, { foer: kamp.date, utenKamp: kamp.id }));
    const idag = lagprofil(modell, motstander, {}).spillere; // brukes bare til navn
    const iKamp = kampObs(modell, kamp.id, motstander).filter((o) => o.kategori === 'mottak');
    const perSpiller = {};
    iKamp.forEach((o) => { const k = spillerNokkel(o); (perSpiller[k] || (perSpiller[k] = [])).push(o); });
    const sammenligning = plan.rader.filter((r) => r.rang != null).slice(0, 6).map((r) => {
      const o = perSpiller['#' + r.nr] || [];
      const m = o.length ? mottak(o) : null;
      return { nr: r.nr, navn: r.navn, rang: r.rang, foerFeilPct: r.feilPct, foerN: r.n, iKamp: m, kilde: o.length ? KILDENAVN[o[0].kilde] : null };
    });

    return { plan, sammenligning, vaarServe: vaar.length ? serve(vaar) : null, navn: idag };
  }

  const api = { KILDENAVN, DEF, MIN_MOTTAK, KRYMP, lesData, normaliser, lagprofil, serveplan, etterKamp, kampObs, mottak, angrep, serve, andelFraProsent, kvalitet, lagNokkel, pct };

</script>

<script src="config.js" onerror="window.V2_CONFIG = window.V2_CONFIG || null"></script>
<script>/*
 * Statistikk V2 – datalag for registreringsappen (spor B, #10).

 * ClaudeStore(db)        dagens lagring (window.claude.use('db')), uendret. Standard.
 * SupabaseStore(opts)    samme API som appen bruker i dag – doc(sti) / collection(sti) med onSnapshot, get, set, update,
 *                        add, delete – men lagrer i Supabase etter V2-kontrakten (docs/v2-kontrakt.md, spor A).
 *
 * Appen trenger derfor ingen endring: den får bare et annet «db»-objekt. Stiene oversettes slik:
 *   config/contexts                       → stats.contexts
 *   <prefix>config/roster                 → stats.squad_players
 *   <prefix>config/logos                  → stats.logos
 *   <prefix>scouting/notater              → stats.scouting_notes
 *   <prefix>opponents[/slug]              → stats.opponents + opponent_players
 *   <prefix>matches[/id]                  → stats.matches + match_sets (resultat med versjonskontroll)
 *   <prefix>matches/id/log/<enhet>-s<sett> set({events}) → nye elementer blir hendelser (append),
 *                                         et fjernet siste element blir en «undo»-rad (tombstone)
 * Hendelser går via en lokal kø (IndexedDB i nettleseren) og sendes med fast id, så gjentak aldri gir duplikater.
 * Ren JavaScript uten DOM-avhengighet (unntatt valgfri IndexedDB). Testes i Node med en falsk klient.
 */
(function (root) {
  'use strict';

  // ---------- Hjelpere ----------
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const erUuid = (s) => UUID_RE.test(String(s || ''));
  // Deterministisk uuid fra tekst (samme tekst gir alltid samme id). 4 × FNV-1a 32 bit, formatert som uuid v5-variant.
  function uuidFra(tekst) {
    const h = [0x811c9dc5, 0x01000193 ^ 0x9e3779b9, 0x85ebca6b, 0xc2b2ae35];
    const s = String(tekst);
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      for (let k = 0; k < 4; k++) { h[k] ^= (c + k * 31); h[k] = Math.imul(h[k], 0x01000193) >>> 0; }
    }
    for (let k = 0; k < 4; k++) { h[k] ^= h[(k + 1) % 4] >>> 7; h[k] = Math.imul(h[k], 0x5bd1e995) >>> 0; }
    const x = h.map((v) => v.toString(16).padStart(8, '0')).join('');

  const kopi = (x) => JSON.parse(JSON.stringify(x));
  const nettverksfeil = (e) => !!e && (e.nettverk || /fetch|network|timeout|offline|ECONN/i.test(String(e.message || e)));

  // ---------- Mapping (rene funksjoner, testes direkte) ----------
  const KAMPFELT = { home: 'home', away: 'away', venue: 'venue', round: 'round', stage: 'stage', matchNo: 'match_no', type: 'type',
    source: 'source', custom: 'custom', inSeason: 'in_season', focus: 'focus_team', status: 'status', setsHome: 'sets_home', setsAway: 'sets_away' };

  function kampTilClaude(rad, sett) {
    const d = Object.assign({}, rad.legacy || {});
    for (const [c, s] of Object.entries(KAMPFELT)) if (rad[s] !== undefined && rad[s] !== null) d[c] = rad[s];

      else if (k === 'current') { if (v) { rad.current_set = v.set || 1; rad.current_home = v.home || 0; rad.current_away = v.away || 0; } }

      }

    }

    rad.legacy = legacy;

  }

  function rosterTilClaude(rader) {
    return { players: rader.slice().sort((a, b) => (+a.jersey || 999) - (+b.jersey || 999)).map((r) => {
      const p = { id: r.legacy_id || r.id, nr: r.jersey || '', name: r.name, pos: r.position || '' };
      if (r.archived) p.archived = true;
      return p;
    }) };
  }
  function rosterTilRader(players, ctxId) {
    return (players || []).map((p) => ({ context_id: ctxId, legacy_id: String(p.id), jersey: p.nr != null ? String(p.nr) : null,
      name: p.name || ('#' + (p.nr || '?')), position: p.pos || null, archived: !!p.archived }));
  }

  // Hendelse fra appen → rad. Egne spillere slås opp fra legacy-id til uuid.
  function eventTilRad(ev, k) {
    const type = ev.type, egen = type === 'rec' || type === 'att' || type === 'srv';
    const rad = { id: k.id, match_id: k.matchId, context_id: k.ctxId, device_id: k.device, seq: k.seq, set_no: +ev.set || +k.set || 1,
      recorded_at: new Date(ev.t || Date.now()).toISOString(), recorded_by: k.userId, type, code: ev.c == null ? '' : String(ev.c),
      squad_player_id: egen ? (k.spillerUuid(ev.p) || null) : null, opp_jersey: egen ? null : String(ev.p == null ? '?' : ev.p),
      name_at_time: ev.n || null, origin: 'app' };
    if (type === 'dir') {
      const g = {}; for (const [x, v] of Object.entries(ev)) if (!['id', 't', 'set', 'type', 'p', 'c', 'n', 'pid'].includes(x)) g[x] = v;
      rad.geom = g;
    }
    if (ev.id && !erUuid(ev.id)) rad.legacy_id = String(ev.id);
    return rad;
  }
  function radTilEvent(r, spillerLegacy) {
    const ev = { id: r.legacy_id || r.id, t: Date.parse(r.recorded_at), set: r.set_no, type: r.type,
      p: r.squad_player_id ? (spillerLegacy(r.squad_player_id) || r.squad_player_id) : r.opp_jersey, c: r.code };
    if (r.name_at_time) ev.n = r.name_at_time;
    if (r.opp_person_id) ev.pid = r.opp_person_id;   // motstanderens spiller-ID (NIF), fylles inn av databasen

  function grupperLogger(rader, spillerLegacy) {
    const angret = new Set(rader.filter((r) => r.type === 'undo').map((r) => r.undoes));
    const docs = {};
    rader.filter((r) => r.type !== 'undo' && !angret.has(r.id))
      .sort((a, b) => a.seq - b.seq || Date.parse(a.recorded_at) - Date.parse(b.recorded_at))
      .forEach((r) => {
        const key = r.device_id + '-s' + r.set_no;

      });

  }
  // Stabil id for en hendelse fra appen (eventets egen id hvis den finnes, ellers innhold + plass)
  function hendelsesId(matchId, key, ev) {
    if (erUuid(ev.id)) return ev.id;
    return uuidFra(['ev', matchId, key, ev.id || '', ev.t, ev.type, ev.p, ev.c].join('|'));
  }

  // ---------- Kø (IndexedDB i nettleser, minne i Node) ----------
  function lagLagring(navn) {
    const idb = root.indexedDB;
    if (!idb) { let mem = []; return { last: async () => mem.slice(), lagre: async (l) => { mem = l.slice(); } }; }

      async last() { const db = await åpne(); return new Promise((ok) => { const g = db.transaction('ko').objectStore('ko').get('ops'); g.onsuccess = () => ok(g.result || []); g.onerror = () => ok([]); }); },
      async lagre(l) { const db = await åpne(); return new Promise((ok) => { const t = db.transaction('ko', 'readwrite'); t.objectStore('ko').put(l, 'ops'); t.oncomplete = ok; t.onerror = ok; }); },
    };
  }

  function Ko(lagring) {
    let ops = [], lastet = false, kjører = null, forsøk = 0;
    const self = {
      async start() { if (!lastet) { ops = await lagring.last(); lastet = true; } return self; },
      antall: () => ops.length,
      ops: () => ops.slice(),
      async legg(op) { ops.push(op); await lagring.lagre(ops); },
      // Sender i rekkefølge. Nettverksfeil: stopp og prøv senere. Andre feil: forkast op og rapporter.
      async tøm(utfør, påFeil) {
        if (kjører) return kjører;
        kjører = (async () => {
          while (ops.length) {
            try { await utfør(ops[0]); forsøk = 0; }
            catch (e) {
              if (nettverksfeil(e)) { forsøk++; break; }
              if (påFeil) påFeil(e, ops[0]);
            }
            ops.shift(); await lagring.lagre(ops);
          }
          kjører = null; return ops.length;
        })();
        return kjører;
      },
      ventetid: () => Math.min(30000, 1000 * Math.pow(2, Math.max(0, forsøk - 1))),
    };
    return self;
  }

  // ---------- SupabaseStore ----------
  function SupabaseStore(opts) {
    const sb = opts.client, db = sb.schema('stats'), mainSlug = opts.mainSlug || 'main';
    const device = opts.deviceId || 'd' + Math.random().toString(36).slice(2, 10);
    const ko = opts.ko || Ko(lagLagring('rv-v2-ko'));
    const lyttere = new Set(), status = { ventende: 0, feil: [], konflikter: 0 };
    let userId = opts.userId || null, kontekster = null;
    const kampLegacy = {}, kampVersjon = {}, kampIdTilUuid = {}, kampUuidTilId = {};
    const spillere = {};          // ctxId → { legacyTilUuid, uuidTilLegacy }
    const loggKjent = {};         // matchUuid → Map(id → {key, ev}) – det appen har sett
    const ventende = {};          // matchUuid → [rad] i kø, vises i øyeblikksbilder
    const seqNeste = {};          // matchUuid → neste seq for denne enheten
    // seq må være unik per (kamp, enhet) også når enheten starter offline: tidsbasert (tidels sekunder siden 2026),
    // og alltid større enn forrige. Passer i int4 til ca. 2032.
    const nesteSeq = (m) => { const s = Math.max(seqNeste[m] || 0, Math.floor((Date.now() - Date.UTC(2026, 0, 1)) / 100)); seqNeste[m] = s + 1; return s; };
    const kanaler = [];

    const varsle = () => { status.ventende = ko.antall(); lyttere.forEach((f) => { try { f(Object.assign({}, status)); } catch (e) { /* lytterfeil */ } }); };
    const kast = (r) => { if (r && r.error) { const e = new Error(r.error.message); e.code = r.error.code; e.nettverk = nettverksfeil(r.error); throw e; } return r ? r.data : null; };

    async function hentKontekster() {
      const rader = kast(await db.from('contexts').select('*'));
      kontekster = {}; rader.forEach((c) => { kontekster[c.slug] = c; });
      return rader;
    }
    async function ctxFor(prefiksSlug) {
      if (!kontekster || !kontekster[prefiksSlug]) await hentKontekster();
      const c = kontekster[prefiksSlug]; if (!c) throw Object.assign(new Error('Ukjent lag/sesong: ' + prefiksSlug), { code: 'ukjent-kontekst' });
      return c;
    }
    // 'ctx/u20/matches/x' → { slug: 'u20', deler: ['matches','x'] }
    function tolk(sti) {
      const d = String(sti).split('/');
      if (d[0] === 'ctx') return { slug: d[1], deler: d.slice(2) };
      return { slug: mainSlug, deler: d };
    }
    async function lastSpillere(ctxId) {
      const rader = kast(await db.from('squad_players').select('*').eq('context_id', ctxId));
      const m = { legacyTilUuid: {}, uuidTilLegacy: {} };
      rader.forEach((r) => { const l = r.legacy_id || r.id; m.legacyTilUuid[l] = r.id; m.uuidTilLegacy[r.id] = l; });
      spillere[ctxId] = m; return rader;
    }
    async function kampUuid(ctxId, id) {
      if (erUuid(id)) return id;
      if (kampIdTilUuid[ctxId + '|' + id]) return kampIdTilUuid[ctxId + '|' + id];
      const r = kast(await db.from('matches').select('id').eq('context_id', ctxId).eq('legacy_id', id));
      if (!r.length) throw Object.assign(new Error('Ukjent kamp ' + id), { code: 'ukjent-kamp' });
      kampIdTilUuid[ctxId + '|' + id] = r[0].id; kampUuidTilId[r[0].id] = id; return r[0].id;
    }

    // Generisk lytter: første øyebliksbilde + Realtime; nytt fullt bilde ved hver endring og ved (re)tilkobling
    function lytt(navn, tabeller, hent, cb, feil) {
      let aktiv = true, timer = null;
      // Bare nye data sendes videre: polling uten endringer skal ikke tegne appen på nytt (nedtrekksmenyer og skjema hopper ellers ut)
      let sist;
      const kjør = () => { clearTimeout(timer); timer = setTimeout(() => hent().then((x) => { if (!aktiv) return; let n; try { n = JSON.stringify(x); } catch (e) { n = null; } if (n !== null && n === sist) return; sist = n; cb(x); }).catch((e) => feil && feil(e)), 30); };
      kjør();
      let kanal = null;
      if (sb.channel) {
        kanal = sb.channel(navn + ':' + Math.random().toString(36).slice(2, 7));
        tabeller.forEach(([tabell, filter]) => kanal.on('postgres_changes', Object.assign({ event: '*', schema: 'stats', table: tabell }, filter ? { filter } : {}), kjør));
        kanal.subscribe((s) => { if (s === 'SUBSCRIBED') kjør(); });
        kanaler.push(kanal);
      }
      // Polling som reserve: private tabeller er ikke i Realtime-publiseringen i testprosjektet, så andre
      // iPaders registreringer hentes med jevne mellomrom (standard hvert 4. sekund). Egne vises med én gang.
      const pollMs = opts.pollMs === undefined ? 4000 : opts.pollMs;
      const poll = pollMs ? setInterval(() => { if (!root.document || !root.document.hidden) kjør(); }, pollMs) : null;
      return () => { aktiv = false; clearTimeout(timer); if (poll) clearInterval(poll); if (kanal && sb.removeChannel) sb.removeChannel(kanal); };
    }
    const dokSnap = (d) => ({ exists: d != null, id: null, data: () => (d == null ? {} : kopi(d)) });
    const samSnap = (par) => ({ docs: par.map(([id, d]) => ({ id, data: () => kopi(d) })) });

    // ----- hendelser -----
    async function hentLogger(ctxId, mUuid) {
      if (!spillere[ctxId]) await lastSpillere(ctxId);
      const rader = kast(await db.from('events').select('*').eq('match_id', mUuid));
      const alle = rader.concat((ventende[mUuid] || []).filter((v) => !rader.some((r) => r.id === v.id)));
      const egen = alle.filter((r) => r.device_id === device);
      seqNeste[mUuid] = Math.max(seqNeste[mUuid] || 0, egen.reduce((a, r) => Math.max(a, r.seq + 1), 0));
      const sl = (u) => spillere[ctxId].uuidTilLegacy[u];
      const docs = grupperLogger(alle, sl);
      const kjent = loggKjent[mUuid] || (loggKjent[mUuid] = new Map());
      Object.entries(docs).forEach(([key, d]) => d.events.forEach((ev) => { const r = alle.find((x) => (x.legacy_id || x.id) === ev.id); if (r) kjent.set(r.id, { key, ev }); }));
      return docs;
    }
    async function settLogg(ctxId, mUuid, key, data) {
      if (!spillere[ctxId]) await lastSpillere(ctxId);
      const kjent = loggKjent[mUuid] || (loggKjent[mUuid] = new Map());
      const nye = data.events || [], ids = nye.map((ev) => hendelsesId(mUuid, key, ev));
      const før = [...kjent.entries()].filter(([, v]) => v.key === key).map(([id]) => id);
      // Nye hendelser (append)
      for (let i = 0; i < nye.length; i++) {
        if (kjent.has(ids[i])) continue;
        const rad = eventTilRad(nye[i], { id: ids[i], matchId: mUuid, ctxId, device, seq: nesteSeq(mUuid), set: data.set, userId,
          spillerUuid: (p) => spillere[ctxId].legacyTilUuid[p] });
        kjent.set(ids[i], { key, ev: nye[i] });
        (ventende[mUuid] || (ventende[mUuid] = [])).push(rad);
        await ko.legg({ t: 'ins', rad });
      }
      // Fjernet (angre): hver hendelse som ikke lenger er med, blir en undo-rad med fast id
      for (const id of før) {
        if (ids.includes(id)) continue;
        const rad = { id: uuidFra('undo|' + id), match_id: mUuid, context_id: ctxId, device_id: device, seq: nesteSeq(mUuid),
          set_no: +data.set || 1, recorded_at: new Date().toISOString(), recorded_by: userId, type: 'undo', code: '', undoes: id, origin: 'app' };
        kjent.delete(id);
        const v = ventende[mUuid] || (ventende[mUuid] = []);
        const i = v.findIndex((r) => r.id === id);
        if (i >= 0) v.splice(i, 1); // ikke sendt ennå: bare ta den ut av køen-visningen (køen sender likevel ins + undo i rekkefølge)
        v.push(rad);
        await ko.legg({ t: 'ins', rad });
      }
      varsle();
      return tøm();
    }
    async function utfør(op) {
      if (op.t === 'ins') {
        const r = await db.from('events').upsert(op.rad, { onConflict: 'id', ignoreDuplicates: true });
        if (r.error && /events_undo_once|duplicate key/i.test(r.error.message || '')) { status.konflikter++; } // allerede angret = ferdig
        else kast(r);
        const v = ventende[op.rad.match_id]; if (v) { const i = v.findIndex((x) => x.id === op.rad.id); if (i >= 0) v.splice(i, 1); }
      }
    }
    let tømTimer = null;
    async function tøm() {
      const igjen = await ko.tøm(utfør, (e, op) => { status.feil.push({ melding: e.message, kode: e.code, op: op.rad && op.rad.id }); });
      varsle();
      clearTimeout(tømTimer);
      if (igjen) tømTimer = setTimeout(tøm, ko.ventetid());
      return igjen;
    }

    // ----- kamp -----
    async function hentKamper(ctxId) {
      const ms = kast(await db.from('matches').select('*').eq('context_id', ctxId));
      const ids = ms.map((m) => m.id);
      const sett = ids.length ? kast(await db.from('match_sets').select('*').in('match_id', ids)) : [];
      return ms.map((m) => {
        const id = m.legacy_id || m.id; kampIdTilUuid[ctxId + '|' + id] = m.id; kampUuidTilId[m.id] = id;
        kampLegacy[m.id] = m.legacy || {}; kampVersjon[m.id] = m.version;
        return [id, kampTilClaude(m, sett.filter((s) => s.match_id === m.id))];
      });
    }
    // Endringer i samme kamp sendes én om gangen (appen kan sende flere raskt etter hverandre, f.eks. status + poeng)
    const kampKø = {};
    function oppdaterKamp(ctxId, id, patch) {
      const k = ctxId + '|' + id;
      const neste = (kampKø[k] || Promise.resolve()).catch(() => {}).then(() => oppdaterKampNå(ctxId, id, patch));
      kampKø[k] = neste; return neste;
    }
    async function oppdaterKampNå(ctxId, id, patch, nyttForsøk) {
      const u = await kampUuid(ctxId, id);
      if (kampVersjon[u] == null) await hentKamper(ctxId);
      const { rad, sett } = patchTilKamp(patch, kampLegacy[u]);
      const r = await db.from('matches').update(rad).eq('id', u).eq('version', kampVersjon[u]).select('version, legacy');
      const data = kast(r);
      if (!data || !data.length) {
        // Versjonskonflikt: en annen enhet har endret kampen. Hent ny versjon og legg endringen på igjen (én gang).
        status.konflikter++; varsle();
        await hentKamper(ctxId);
        if (!nyttForsøk) return oppdaterKampNå(ctxId, id, patch, true);
        throw Object.assign(new Error('Kampen ble endret på en annen enhet samtidig. Prøv igjen.'), { code: 'versjonskonflikt' });
      }
      kampVersjon[u] = data[0].version; kampLegacy[u] = data[0].legacy || kampLegacy[u];
      if (sett) {
        if (sett.length) kast(await db.from('match_sets').upsert(sett.map((s) => Object.assign({ match_id: u }, s)), { onConflict: 'match_id,set_no' }));
      }
    }

    // ----- dokument og samling (samme API som window.claude.use('db')) -----
    function doc(sti) {
      const { slug: s, deler } = tolk(sti);
      const p = deler.join('/');
      return {
        onSnapshot(cb, feil) {
          if (String(sti) === 'config/contexts') {
            return lytt('ctx', [['contexts']], async () => {
              const rader = await hentKontekster();
              return { list: rader.filter((c) => c.slug !== mainSlug).map((c) => ({ id: c.slug, name: c.name, our: c.our_team, prefix: 'ctx/' + c.slug + '/', teams: c.teams || [], theme: c.theme || undefined, gender: c.gender || undefined })) };
            }, (d) => cb(dokSnap(d)), feil);
          }
          if (String(sti) === 'config/access') { setTimeout(() => cb(dokSnap(null)), 0); return () => {}; }
          let av = () => {}; let lukket = false;
          ctxFor(s).then((c) => {
            if (lukket) return;
            if (p === 'config/roster') av = lytt('roster', [['squad_players', 'context_id=eq.' + c.id]], async () => rosterTilClaude(await lastSpillere(c.id)), (d) => cb(dokSnap(d)), feil);
            else if (p === 'config/logos') av = lytt('logos', [['logos', 'context_id=eq.' + c.id]], async () => {
              const r = kast(await db.from('logos').select('*').eq('context_id', c.id)); return r.length ? { logos: Object.fromEntries(r.map((x) => [x.team, x.data_url])) } : null;
            }, (d) => cb(dokSnap(d)), feil);
            else if (p === 'scouting/notater') av = lytt('scout', [['scouting_notes', 'context_id=eq.' + c.id]], async () => {
              const [r, o] = [kast(await db.from('scouting_notes').select('*').eq('context_id', c.id)), kast(await db.from('opponents').select('*').eq('context_id', c.id))];
              const navn = Object.fromEntries(o.map((x) => [x.slug, x.name])), lag = {};
              r.forEach((x) => { const n = navn[x.opponent_slug] || x.opponent_slug; (lag[n] || (lag[n] = {}))[x.jersey] = { vurdering: x.assessment || '', tekst: x.note || '', endret: x.updated_at }; });
              return { lag };
            }, (d) => cb(dokSnap(d)), (e) => { if (/permission|row-level/i.test(e.message)) cb(dokSnap(null)); else if (feil) feil(e); });
            else { setTimeout(() => cb(dokSnap(null)), 0); }
          }).catch((e) => feil && feil(e));
          return () => { lukket = true; av(); };
        },
        async get() { return new Promise((ok, feil) => { const av = this.onSnapshot((x) => { av(); ok(x); }, feil); }); },
        async set(data) {
          const c = await ctxFor(s);
          if (p === 'config/roster') {
            const rader = rosterTilRader(data.players, c.id);
            if (rader.length) kast(await db.from('squad_players').upsert(rader, { onConflict: 'context_id,legacy_id' }));
            await lastSpillere(c.id); return;
          }
          if (p === 'scouting/notater') {
            const o = kast(await db.from('opponents').select('*').eq('context_id', c.id));
            const tilSlug = Object.fromEntries(o.map((x) => [x.name, x.slug])), rader = [];
            for (const [lag, nr] of Object.entries(data.lag || {})) {
              let sl = tilSlug[lag];
              if (!sl) { sl = slug(lag); kast(await db.from('opponents').upsert({ context_id: c.id, slug: sl, name: lag }, { onConflict: 'context_id,slug' })); }
              for (const [j, n] of Object.entries(nr)) rader.push({ context_id: c.id, opponent_slug: sl, jersey: String(j), assessment: n.vurdering || null, note: n.tekst || null, updated_by: userId, updated_at: new Date().toISOString() });
            }
            if (rader.length) kast(await db.from('scouting_notes').upsert(rader, { onConflict: 'context_id,opponent_slug,jersey' }));
            return;
          }
          if (deler[0] === 'opponents' && deler[1]) {
            const r = kast(await db.from('opponents').upsert({ context_id: c.id, slug: deler[1], name: data.name }, { onConflict: 'context_id,slug' }).select('id'));
            const oid = r[0].id, pl = (data.players || []).filter((x) => x.nr != null).map((x) => Object.assign({ opponent_id: oid, jersey: String(x.nr), name: x.name || null, position: x.pos || null }, x.id ? { person_id: String(x.id) } : {}));
            if (pl.length) kast(await db.from('opponent_players').upsert(pl, { onConflict: 'opponent_id,jersey' }));
            return;
          }
          if (deler[0] === 'matches' && deler[2] === 'log' && deler[3]) return settLogg(c.id, await kampUuid(c.id, deler[1]), deler[3], data);
          if (deler[0] === 'matches' && deler[1] && deler.length === 2) return oppdaterKamp(c.id, deler[1], data);
          if (p === 'config/logos') {
            const rader = Object.entries(data.logos || {}).map(([team, data_url]) => ({ context_id: c.id, team, data_url }));
            if (rader.length) kast(await db.from('logos').upsert(rader, { onConflict: 'context_id,team' }));
            return;
          }
          if (String(sti) === 'config/access') throw Object.assign(new Error('Tilgang styres i Supabase (medlemskap), ikke i appen.'), { code: 'kun-lesing' });
          throw Object.assign(new Error('Ukjent sti ' + sti), { code: 'ukjent-sti' });
        },
        async update(patch) {
          const c = await ctxFor(s);
          if (deler[0] === 'matches' && deler.length === 2) return oppdaterKamp(c.id, deler[1], patch);
          return this.set(patch);
        },
        async delete() {
          const c = await ctxFor(s);
          if (deler[0] === 'matches' && deler.length === 2) { kast(await db.from('matches').delete().eq('id', await kampUuid(c.id, deler[1]))); return; }
          if (deler[2] === 'log') return; // hendelser slettes med kampen (append-only)
          throw Object.assign(new Error('Sletting støttes ikke for ' + sti), { code: 'ukjent-sti' });
        },
      };
    }
    function collection(sti) {
      const { slug: s, deler } = tolk(sti);
      return {
        onSnapshot(cb, feil) {
          let av = () => {}; let lukket = false;
          ctxFor(s).then(async (c) => {
            if (lukket) return;
            if (deler[0] === 'matches' && deler.length === 1)
              av = lytt('kamper', [['matches', 'context_id=eq.' + c.id], ['match_sets']], () => hentKamper(c.id), (x) => cb(samSnap(x)), feil);
            else if (deler[0] === 'matches' && deler[2] === 'log') {
              const u = await kampUuid(c.id, deler[1]);
              av = lytt('logg', [['events', 'match_id=eq.' + u]], async () => Object.entries(await hentLogger(c.id, u)), (x) => cb(samSnap(x)), feil);
            } else if (deler[0] === 'opponents')
              av = lytt('motst', [['opponents', 'context_id=eq.' + c.id], ['opponent_players']], async () => {
                const o = kast(await db.from('opponents').select('*').eq('context_id', c.id));
                const pl = o.length ? kast(await db.from('opponent_players').select('*').in('opponent_id', o.map((x) => x.id))) : [];
                return o.map((x) => [x.slug, { name: x.name, players: pl.filter((p) => p.opponent_id === x.id).map((p) => ({ nr: p.jersey, name: p.name || undefined, pos: p.position || undefined, id: p.person_id || undefined })) }]);
              }, (x) => cb(samSnap(x)), feil);
            else setTimeout(() => cb(samSnap([])), 0);
          }).catch((e) => feil && feil(e));
          return () => { lukket = true; av(); };
        },
        get() { return new Promise((ok, feil) => { const av = this.onSnapshot((x) => { av(); ok(x); }, feil); }); },
        async add(data) {
          const c = await ctxFor(s);
          if (deler[0] !== 'matches' || deler.length !== 1) throw Object.assign(new Error('add støttes bare for kamper'), { code: 'ukjent-sti' });
          const { rad, sett } = patchTilKamp(data, {});
          const id = uuid4();
          const ny = kast(await db.from('matches').insert(Object.assign({ id, context_id: c.id, home: data.home || '', away: data.away || '' }, rad)).select('id'));
          if (sett && sett.length) kast(await db.from('match_sets').upsert(sett.map((x) => Object.assign({ match_id: id }, x)), { onConflict: 'match_id,set_no' }));
          return { id: ny[0].id };
        },
      };
    }

    const api = {
      doc, collection,
      status: () => Object.assign({ ventende: ko.antall() }, status),
      påStatus(f) { lyttere.add(f); return () => lyttere.delete(f); },
      tøm, device,
      settBruker(id) { userId = id; },
      async start() { await ko.start(); varsle(); if (ko.antall()) tøm(); return api; },
      lukk() { clearTimeout(tømTimer); kanaler.forEach((k) => sb.removeChannel && sb.removeChannel(k)); },
    };
    return api;
  }

  function ClaudeStore(db) { return db; }

  const eksport = { SupabaseStore, ClaudeStore, Ko, lagLagring, uuidFra, erUuid, hendelsesId, eventTilRad, radTilEvent, grupperLogger,
    kampTilClaude, patchTilKamp, rosterTilClaude, rosterTilRader, lokalTid, fraLokalTid, slug };
  if (typeof module !== 'undefined' && module.exports) module.exports = eksport; else root.StatsV2 = eksport;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/*
 * Falsk Supabase-klient i minnet for tester og demo (spor B). Etterligner den delen av supabase-js som
 * SupabaseStore bruker: schema('stats').from(t).select/insert/upsert/update/delete/eq/in, channel().on().subscribe().
 * Etterligner også databasereglene fra spor A som er viktige for appen: unik hendelses-id (retry = no-op),
 * én angre per hendelse, versjonsøkning på kamper, og «nettverksbrudd» (offline = true).
 * Ingen ekte data. Brukes aldri mot et Supabase-prosjekt.
 */
(function (root) {
  'use strict';
  function FakeDb(seed) {
    const t = { contexts: [], squad_players: [], opponents: [], opponent_players: [], matches: [], match_sets: [], events: [], scouting_notes: [], logos: [] };
    Object.assign(t, JSON.parse(JSON.stringify(seed || {})));
    const lyttere = [];
    return {
      t, offline: false, nekt: null, kall: 0,
      varsle(tabell, rad) { lyttere.slice().forEach((l) => { if (l.table === tabell && (!l.filter || match(l.filter, rad))) setTimeout(() => l.cb({ new: rad }), 0); }); },
      lytt(l) { lyttere.push(l); return () => { const i = lyttere.indexOf(l); if (i >= 0) lyttere.splice(i, 1); }; },
    };
  }
  function match(filter, rad) { const m = String(filter).match(/^(\w+)=eq\.(.+)$/); return !m || !rad || String(rad[m[1]]) === m[2]; }

  // Slagene som skal tegnes: én spiller (nøkkel) eller hele laget (nøkkel = null), med spillerens farge

  // ---------- Lagring ----------
  function lokalLagring(navnerom) {
    const k = (n) => 'rv-forsvar:' + (navnerom || '') + ':' + n;

      async hent(n) { const t = root.localStorage.getItem(k(n)); return t ? JSON.parse(t) : null; },

  // Statistikk V2 (Supabase): tabellen stats.forsvar_planer, én rad per lag/sesong (context_id) og motstander.

      async lagre(n, dok) { kast(await db.from('forsvar_planer').upsert({ context_id: contextId, motstander: mot(n), data: dok, updated_at: new Date().toISOString(), updated_by: brukerId || null }, { onConflict: 'context_id,motstander' })); },
    };

  // ---------- Visning og flytting ----------
  /*

    const knapper = {};

    const gUnder = el('g', { class: 'fv-svg-under', 'pointer-events': 'none' }), gOver = el('g', { class: 'fv-svg-over', 'pointer-events': 'none' });
    const defs = el('defs', {});
    const klipp = el('clipPath', { id: 'fv-klipp' }); klipp.appendChild(el('rect', { x: BANE.venstre, y: BANE.nett, width: BANE.hoyre - BANE.venstre, height: BANE.bak - BANE.nett }));
    const pilhode = el('marker', { id: 'fv-pilhode', viewBox: '0 0 10 10', refX: '7', refY: '5', markerWidth: '3.2', markerHeight: '3.2', orient: 'auto-start-reverse' });
    pilhode.appendChild(el('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#0B2A66' }));
    defs.appendChild(klipp); defs.appendChild(pilhode); gUnder.appendChild(defs);
    const gSkygge = el('g', { class: 'fv-skygge', 'clip-path': 'url(#fv-klipp)', opacity: '.42' }), gDekning = el('g', { class: 'fv-dekning' });
    gUnder.appendChild(gSkygge); gUnder.appendChild(gDekning);
    const slagLag = svg.querySelector('#dir-layer');
    if (slagLag) svg.insertBefore(gUnder, slagLag); else svg.appendChild(gUnder);
    const gHist = el('g', { class: 'fv-historikk', 'pointer-events': 'none' });
    svg.appendChild(gHist);
    svg.appendChild(gOver);

    MARKORER.forEach(({ id, navn }) => {
      const b = root.document.createElement('button');
      b.type = 'button'; b.className = 'fv-markor'; b.textContent = id; b.dataset.id = id;
      b.setAttribute('aria-label', navn + ' (' + id + '). Dra for å flytte, eller bruk piltastene.');
      b.addEventListener('pointerdown', (ev) => ned(ev, id));
      b.addEventListener('pointermove', bevegelse);
      b.addEventListener('pointerup', slipp);
      b.addEventListener('pointercancel', slipp);
      b.addEventListener('lostpointercapture', slipp);
      b.addEventListener('keydown', (ev) => tast(ev, id));

    });
    // Motstanderens angriper: bestemmer retningen på blokkskyggen. Vises når blokkskyggen er på.
    const angrKnapp = root.document.createElement('button');
    angrKnapp.type = 'button'; angrKnapp.className = 'fv-markor fv-angriper'; angrKnapp.textContent = 'A'; angrKnapp.dataset.id = 'A';

      const [dok, std] = await Promise.all([
        lagring.hent(nokkel(S.prefiks, S.motstander)),
        S.motstander ? lagring.hent(nokkel(S.prefiks, null)) : Promise.resolve(null)]);
      S.dok = gyldig(dok) ? oppgrader(dok) : nyttOppsett(S.laget, S.motstander);

    return {
      tilstand,
      last,
      settRotasjon(rot) { if (ROTASJONER.includes(rot)) { S.rot = rot; S.drar = S.pil = S.angr = null; tegn(); meld(); } },
      settVariant(v) { if (VARIANTER.some((x) => x.id === v)) { S.variant = v; S.drar = S.pil = S.angr = null; tegn(); meld(); } },
      // Tidligere slag (fra registreringene) vises i eget lag. Liste med { x1, y1, x2, y2, k, c, farge } i banekoordinater.
      settHistorikk(liste) { S.historikk = Array.isArray(liste) ? liste : []; tegn(); meld(); },
      settVisHistorikk(v) { S.visHistorikk = !!v; tegn(); meld(); },
      settVis(v) { S.vis = !!v; S.drar = S.pil = S.angr = null; tegn(); meld(); },
      settLast(v) { S.last = !!v; S.drar = S.pil = S.angr = null; tegn(); meld(); },

<script>/*

 * Bygges inn av v2/bygg_v2.py. Appen kaller window.ForsvarKamp.apne/oppdater/lukk fra slagretningsvisningen.
 * - Planen (stats.forsvar_planer) er skjult til den slås på, og låst til «Rediger» er valgt, så registreringen virker som før.
 * - Endringer lagres automatisk.
 * - «Tidligere kamper» viser slag fra andre kamper, men bare for spillerne i denne kampen (spiller-ID, ellers lag + nummer).
 * Leser bare slaghistorikk og tropper; skriver bare forsvarsplanen.
 */
(function () {
