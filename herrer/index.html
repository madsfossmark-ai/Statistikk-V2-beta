  const F = window.Forsvar; if (!F) return;
  const cfg = window.V2_CONFIG || {}, demo = new URLSearchParams(location.search).has('demo');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const erUuid = (s) => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s));
  const kast = (r) => { if (r && r.error) throw new Error(r.error.message); return r ? r.data : null; };
  let mem = { vis: false, hist: 'av' };
  try { mem = Object.assign(mem, JSON.parse(localStorage.getItem('rv-forsvar-kamp') || '{}')); } catch (e) { /* uten lagring */ }
  const husk = () => { try { localStorage.setItem('rv-forsvar-kamp', JSON.stringify({ vis: mem.vis, hist: mem.hist })); } catch (e) { /* uten lagring */ } };

  const CSS = F.CSS
    + '.dir-court{position:relative}'
    + '.dir-fk .fk-rad{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}'
    + '.dir-fk .fk-rad[hidden]{display:none}'
    + '.dir-fk .fk-chip{min-height:44px;padding:0 14px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer}'
    + '.dir-fk .fk-chip::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid currentColor}'
    + '.dir-fk .fk-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}'
    + '.dir-fk .fk-chip[aria-pressed="true"]::before{background:currentColor}'
    + '.dir-fk select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;padding:0 8px}'
    + '.dir-fk .seg{margin:0}'
    + '.dir-fk .fk-status{font-size:13px;font-weight:600;color:var(--muted);margin-left:auto}'
    + '.dir-fk .fk-status.feil{color:var(--bad)} .dir-fk .fk-status.ok{color:var(--good,#17603a)}'
    + '.dir-fk .fk-info{font-size:13px;color:var(--muted);margin-top:6px}'
    + '.dir-fk .fk-fare{border-color:var(--bad)!important;color:var(--bad)!important}'
    + '.dir-fk a{color:var(--accent);font-weight:600;font-size:14px}'
    + '.dir-ov.pres .dir-side>section.dir-fk{display:flex!important}'
    + '@media print{.dir-fk{display:none!important}}';
  let stilLagt = false;

  let st = null;
  function kontekstSlug(pfx) { const m = /^ctx\/([^/]+)\//.exec(pfx || ''); return m ? m[1] : (cfg.mainSlug || 'main'); }

  function apne(o) {
    if (st) lukk();
    if (!stilLagt) { const s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s); stilLagt = true; }
    const court = o.el.querySelector('.dir-court'), side = o.el.querySelector('.dir-side');
    if (!court || !side || !o.svg) return;
    const lag = document.createElement('div'); court.appendChild(lag);
    const klient = !demo && window.__v2 && window.__v2.client;
    const slug = kontekstSlug(o.pfx);
    const ctx = klient ? kontekst(klient, slug) : Promise.resolve(null);
    ctx.catch(() => {});
    const lagring = klient ? {
      async hent(n) { const c = await ctx; return F.supabaseLagring(klient, c.id, o.brukerId).hent(n); },
      async lagre(n, d) { const c = await ctx; const u = (await klient.auth.getUser()).data.user; return F.supabaseLagring(klient, c.id, u && u.id).lagre(n, d); },
    } : F.lokalLagring('kamp-demo');

    const panel = document.createElement('section');
    panel.className = 'panel dir-fk';
    panel.innerHTML = '<div class="panel-head"><h2>Forsvarsplan</h2><span class="fk-status" role="status" aria-live="polite"></span></div>'
      + '<div class="fk-rad"><button type="button" class="fk-chip" data-fk="vis" aria-pressed="false">Vis plan</button>'
      + '<label class="label" for="fk-rot" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Rotasjon</label>'
      + '<select id="fk-rot">' + F.ROTASJONER.map((r) => '<option>' + r + '</option>').join('') + '</select>'
      + '<div class="seg" role="group" aria-label="Forsvarsvalg">' + F.VARIANTER.map((v) => '<button type="button" data-fk="variant" data-v="' + v.id + '" aria-pressed="false">' + esc(v.navn || v.id) + '</button>').join('') + '</div></div>'
      + '<div class="fk-rad" data-fk-del="plan">' + (o.ro ? '' : '<button type="button" class="fk-chip" data-fk="rediger" aria-pressed="false">Rediger</button>')
      + '<div class="seg" role="group" aria-label="Redigering" data-fk-del="red"><button type="button" data-fk="modus" data-v="flytt" aria-pressed="true">Flytt</button><button type="button" data-fk="modus" data-v="bevegelse" aria-pressed="false">Tegn bevegelse</button></div>'
      + '<button type="button" class="fk-chip" data-fk="rekke" aria-pressed="true">Rekkevidde</button>'
      + '<button type="button" class="fk-chip" data-fk="skygge" aria-pressed="true">Blokkskygge</button>'
      + '<button type="button" data-fk="null" data-fk-del="red" class="secondary">Nullstill</button></div>'
      + '<div class="fk-rad"><span class="label">Tidligere kamper</span><div class="seg" role="group" aria-label="Tidligere kamper">'
      + [['av', 'Av'], ['valgt', 'Valgt spiller'], ['alle', 'Alle i kampen']].map(([v, l]) => '<button type="button" data-fk="hist" data-v="' + v + '" aria-pressed="false">' + l + '</button>').join('') + '</div></div>'
      + '<div class="fk-info" id="fk-info"></div><div class="fk-info" id="fk-kobling"></div>'
      + '<div class="fk-info"><a id="fk-analyse" href="#">Åpne laget i Analyse ›</a></div>';
    const sum = side.querySelector('.dir-sum');
    side.insertBefore(panel, sum || null);
    panel.querySelector('#fk-analyse').href = 'analyse/?' + new URLSearchParams(Object.assign({ motstander: o.opp }, cfg.locked ? {} : { lag: slug }, demo ? { demo: '1' } : {})).toString();

    const fv = F.monter({ svg: o.svg, lag, laget: o.our, motstander: o.opp, prefiks: '', lagring, erTegning: o.tegner, onEndring: (t) => { visPanel(t); if (t.ulagret) planleggLagring(); } });
    st = { o, fv, panel, lag, klient, ctx, slug, red: false, status: '', statusKlasse: '', timer: null, nullTimer: null, lagrer: null,
      app: { nums: [], aktiv: null, farge: {} }, hist: null, histFeil: '', histHenter: null };
    fv.settLast(true); fv.settVis(!!mem.vis);
    fv.last('', o.opp, o.our).then(() => settStatus('', '')).catch((e) => settStatus('Kunne ikke hente planen: ' + e.message, 'feil'));
    panel.addEventListener('click', klikk);
    panel.querySelector('#fk-rot').addEventListener('change', (e) => fv.settRotasjon(e.target.value));
    oppdaterHistorikk();
    visPanel(fv.tilstand());
  }

  async function kontekst(klient, slug) {
    const r = kast(await klient.schema('stats').from('contexts').select('id,slug').eq('slug', slug));
    if (!r || !r.length) throw new Error('fant ikke laget ' + slug);
    return r[0];
  }

  function settStatus(t, k) { if (!st) return; st.status = t; st.statusKlasse = k; const s = st.panel.querySelector('.fk-status'); s.textContent = t; s.className = 'fk-status' + (k ? ' ' + k : ''); }
  function planleggLagring() {
    if (!st) return;
    clearTimeout(st.timer); settStatus('Ulagret …', '');
    st.timer = setTimeout(lagreNå, 700);
  }
  async function lagreNå() {
    if (!st) return; const s = st; clearTimeout(s.timer); s.timer = null;
    if (!s.fv.tilstand().ulagret) return;
    settStatus('Lagrer …', '');
    try { s.lagrer = s.fv.lagre(); await s.lagrer; if (st === s) settStatus('Lagret', 'ok'); }
    catch (e) { if (st === s) settStatus('Ikke lagret: ' + e.message, 'feil'); }
    finally { s.lagrer = null; }
  }

  function visPanel(t) {
    if (!st) return; const p = st.panel, sett = (sel, v) => p.querySelectorAll(sel).forEach((b) => b.setAttribute('aria-pressed', String(v(b))));
    sett('[data-fk="vis"]', () => t.vis);
    sett('[data-fk="variant"]', (b) => b.dataset.v === t.variant);
    sett('[data-fk="rediger"]', () => st.red);
    sett('[data-fk="modus"]', (b) => b.dataset.v === t.modus);
    sett('[data-fk="rekke"]', () => t.rekkevidde);
    sett('[data-fk="skygge"]', () => t.skygge);
    sett('[data-fk="hist"]', (b) => b.dataset.v === mem.hist);
    p.querySelector('#fk-rot').value = t.rotasjon;
    p.querySelector('[data-fk-del="plan"]').hidden = !t.vis;
    p.querySelectorAll('[data-fk-del="red"]').forEach((x) => { x.hidden = !st.red; });
  }

  function klikk(ev) {
    const b = ev.target.closest('[data-fk]'); if (!b || !st) return;
    const fv = st.fv, t = fv.tilstand(), a = b.dataset.fk;
    if (a === 'vis') { mem.vis = !t.vis; husk(); if (!mem.vis && st.red) { st.red = false; fv.settLast(true); } fv.settVis(mem.vis); }
    else if (a === 'variant') fv.settVariant(b.dataset.v);
    else if (a === 'rediger') { st.red = !st.red; fv.settLast(!st.red); if (!st.red) { fv.settModus('flytt'); lagreNå(); } }
    else if (a === 'modus') fv.settModus(b.dataset.v);
    else if (a === 'rekke') fv.settRekkevidde(!t.rekkevidde);
    else if (a === 'skygge') fv.settSkygge(!t.skygge);
    else if (a === 'null') {
      if (!st.nullTimer) { b.textContent = 'Nullstill ' + t.rotasjon + ' ' + (t.variant === 'dia' ? 'Dia' : 'Linje') + '?'; b.classList.add('fk-fare');
        st.nullTimer = setTimeout(() => { if (st) st.nullTimer = null; b.textContent = 'Nullstill'; b.classList.remove('fk-fare'); }, 4000); return; }
      clearTimeout(st.nullTimer); st.nullTimer = null; b.textContent = 'Nullstill'; b.classList.remove('fk-fare'); fv.nullstill();
    }
    else if (a === 'hist') { mem.hist = b.dataset.v; husk(); oppdaterHistorikk(); }
    visPanel(fv.tilstand());
  }

  // ---------- Tidligere kamper ----------
  async function hentHistorikk(s) {
    const db = s.klient.schema('stats'), c = await s.ctx, o = s.o;
    let mUuid = erUuid(o.matchId) ? o.matchId : null;
    if (!mUuid) { const r = kast(await db.from('matches').select('id').eq('context_id', c.id).eq('legacy_id', String(o.matchId))); mUuid = r.length ? r[0].id : null; }
    const mot = kast(await db.from('opponents').select('id').eq('context_id', c.id).eq('name', o.opp));
    const tropp = mot.length ? kast(await db.from('opponent_players').select('jersey,person_id').in('opponent_id', mot.map((x) => x.id))) : [];
    const pidTilNr = {}; tropp.forEach((p) => { if (p.person_id) pidTilNr[p.person_id] = String(p.jersey); });
    const egne = kast(await db.rpc('slaghistorikk', { p_lag: o.opp, p_person: null })) || [];
    // Spillere med ID: også slag fra andre lag og sesonger
    const pids = Object.keys(pidTilNr);
    const andre = (await Promise.all(pids.map((pid) => db.rpc('slaghistorikk', { p_lag: null, p_person: pid }).then(kast)))).flat();
    const sett = new Set(), ut = [];
    egne.concat(andre).forEach((r) => {
      if (!r || r.match_id === mUuid) return;
      const k = r.match_id + '|' + r.x1 + '|' + r.y1 + '|' + r.x2 + '|' + r.y2 + '|' + r.set_no; if (sett.has(k)) return; sett.add(k);
      let nr = null;
      if (r.person_id && pidTilNr[r.person_id]) nr = pidTilNr[r.person_id];
      else if (!r.person_id && r.lag === o.opp && r.kontekst === c.slug) nr = String(r.jersey);
      if (nr == null) return;
      ut.push({ nr, kamp: r.match_id, x1: +r.x1, y1: +r.y1, x2: +r.x2, y2: +r.y2, k: r.k, c: r.utfall });
    });
    return ut;
  }
  function oppdaterHistorikk() {
    if (!st) return; const s = st, info = s.panel.querySelector('#fk-info');
    if (mem.hist === 'av') { s.fv.settVisHistorikk(false); s.fv.settHistorikk([]); info.textContent = ''; return; }
    if (!s.klient) { s.fv.settHistorikk([]); info.textContent = 'Tidligere kamper vises ikke i demo.'; return; }
    if (!s.hist) {
      if (s.histFeil) { info.textContent = s.histFeil; return; }
      info.textContent = 'Henter tidligere slag …';
      if (!s.histHenter) s.histHenter = hentHistorikk(s).then((h) => { s.hist = h; }).catch((e) => { s.histFeil = 'Kunne ikke hente tidligere slag: ' + e.message; }).finally(() => { s.histHenter = null; if (st === s) oppdaterHistorikk(); });
      return;
    }
    const { nums, aktiv, farge } = s.app;
    const hvem = mem.hist === 'valgt' ? (aktiv ? [String(aktiv)] : []) : nums.map(String);
    const liste = s.hist.filter((h) => hvem.includes(h.nr));
    s.fv.settHistorikk(liste.map((h) => Object.assign({}, h, { farge: farge[h.nr] || '#6B2C91' })));
    s.fv.settVisHistorikk(true);
    const kamper = new Set(liste.map((h) => h.kamp)).size;
    const navn = mem.hist === 'valgt' ? (aktiv ? '#' + aktiv : 'ingen valgt spiller') : 'spillerne i kampen';
    info.textContent = liste.length ? 'Tidligere kamper, ' + navn + ': ' + liste.length + ' slag fra ' + kamper + (kamper === 1 ? ' kamp' : ' kamper') + ' (tynne piler med prikk ved landing).' : 'Ingen tidligere slag registrert for ' + navn + '.';
  }
  function oppdater(a) {
    if (!st) return;
    const før = st.app.nums.join(',') + '|' + st.app.aktiv;
    st.app = { nums: (a.nums || []).map(String), aktiv: a.aktiv == null ? null : String(a.aktiv), farge: a.farge || {} };
    // Nytt nummer kan ha fått spiller-ID i troppen etter at vi hentet: hent på nytt ved neste visning
    if (st.app.nums.join(',') !== før.split('|')[0] && st.hist && st.app.nums.some((n) => !st.hist.some((h) => h.nr === n))) { st.hist = null; st.histFeil = ''; }
    if (mem.hist !== 'av') oppdaterHistorikk();
    visKobling();
    st.fv.oppdater();
  }
  // Oppstillingen (issue #20) kobler markørene til faktiske spillere: M = midt foran nå, L = libero inne (ellers midt bak).
  // Bare visning; markørdataene og planen endres ikke.
  function visKobling() {
    if (!st) return; const boks = st.panel.querySelector('#fk-kobling'), O = window.Oppstilling;
    const opp = O && st.o.oppstilling ? st.o.oppstilling() : null;
    if (!opp) { boks.textContent = ''; return; }
    const k = O.forsvarKobling(opp), sp = st.o.spillere ? st.o.spillere() : [], nr = (id) => { const p = sp.find((x) => String(x.id) === String(id)); return p ? '#' + (p.nr || '?') : '?'; };
    boks.textContent = 'På banen nå: ' + ['O', 'K1', 'M', 'D', 'K2', 'L'].filter((r) => k[r]).map((r) => r + ' ' + nr(k[r])).join(' · ');
  }
  function lukk() {
    if (!st) return; const s = st; st = null;
    clearTimeout(s.timer); clearTimeout(s.nullTimer);
    // Ulagrede endringer lagres før visningen lukkes
    if (s.fv.tilstand().ulagret) s.fv.lagre().catch(() => {});
    s.fv.fjern(); s.panel.remove(); s.lag.remove();
  }

  window.ForsvarKamp = { apne, oppdater, lukk, get tilstand() { return st ? Object.assign(st.fv.tilstand(), { redigerer: st.red, status: st.status, historikk: st.hist ? st.hist.length : null }) : null; } };
})();
</script>
<script>/*
 * Oppstillingsvelger V1 (issue #20): startsekser, rotasjon R1–R6, første serve, libero og mottaksformasjon per sett.
 *
 * Felles komponent for alle lag og sesonger. Den kjenner bare spillerlisten den får (id, nr, navn, posisjon), ikke laget.
 * Rene funksjoner (testes i node) + en stor, iPad-tilpasset velger (monter).
 *
 * Begreper
 *   Plass 1–6: formell rotasjonsplass sett fra vår side med nettet øverst:  4 3 2 (foran) / 5 6 1 (bak).
 *   R1–R6:     oppleggerens plass. R1 = opplegger på plass 1, nederst til høyre.
 *   Rotasjon:  når laget roterer, går spilleren på plass 2 til 1, 3 til 2 … og 1 til 6 (R1 → R6 → R5 …).
 *   Libero:    er ikke en sjuende plass. De seks grunnspillerne beholder plassene sine; liberoen erstatter én bakspiller.
 *
 * Datamodell (kampens legacy-felt «lineups», én post per sett, versjonert):
 *   lineups = { v: 1, sets: { "1": Sett, "2": Sett, … } }
 *   Sett = { v, confirmed, confirmedAt, confirmedBy, updatedAt,
 *            start:  Oppsett   // bekreftet startoppstilling; endres aldri etter første registrering i settet
 *            naa:    Oppsett   // det som er på banen nå (bytter, libero inn/ut, manuell rotasjon)
 *            receptionPositions: { R1: { spillerId: [x, y] }, … }   // normalisert 0–1 på vår halvdel (y 0 = nett)
 *            endringer: [{ t, type, … }] }
 *   Oppsett = { rotation: 'R1'…'R6', firstServe: 'oss'|'motstander', positions: { '1': id, … '6': id },
 *               roles: { id: 'O'|'K1'|'K2'|'M1'|'M2'|'D'|… }, libero: { spillere: [id], aktiv: id|null, inne: bool, erstatter: id|null },
 *               receivers: [id] }
 * Appens «onCourt» og «receivers» regnes ut fra Oppsett (onCourtOgMottak) og lagres i samme oppdatering.
 */
(function (root) {
  'use strict';
  const PLASSER = [1, 2, 3, 4, 5, 6];
  const FORAN = [4, 3, 2], BAK = [5, 6, 1];
  const ROTASJONER = ['R1', 'R2', 'R3', 'R4', 'R5', 'R6'];
  // 5-1: rekkefølgen rundt banen fra oppleggerens plass (1 → 2 → … → 6)
  const REKKEFOLGE_51 = ['O', 'K1', 'M1', 'D', 'K2', 'M2'];
  const ROLLER = ['O', 'K1', 'K2', 'M1', 'M2', 'D'];
  const ROLLENAVN = { O: 'Opplegger', K1: 'Kant 1', K2: 'Kant 2', M1: 'Midt 1', M2: 'Midt 2', D: 'Diagonal', L: 'Libero' };
  // Formelle plasser på vår halvdel (samme som forsvarsmarkørene): x 0–1 venstre–høyre, y 0 = nett, 1 = baklinje
  const PLASS_XY = { 1: [0.83, 0.72], 2: [0.83, 0.17], 3: [0.5, 0.17], 4: [0.17, 0.17], 5: [0.17, 0.72], 6: [0.5, 0.72] };

  const kopi = (x) => JSON.parse(JSON.stringify(x));
  const erBak = (p) => BAK.includes(Number(p));
  const rNr = (R) => Number(String(R || '').replace(/\D/g, '')) || null;
  const klem = (v) => Math.max(0, Math.min(1, v));
  const rund = (v) => Math.round(v * 1000) / 1000;

  function plassAv(pos, id) { for (const p of PLASSER) if (pos && String(pos[p]) === String(id)) return p; return null; }
  function ider(pos) { return PLASSER.map((p) => pos && pos[p]).filter((x) => x != null && x !== ''); }
  // Spillerne i rotasjonsrekkefølge fra plass «fra» (1 → 2 → … → 6 → 1)
  function rekkefolge(pos, fra) { return PLASSER.map((_, i) => pos[((fra - 1 + i) % 6) + 1]); }
  // Plasser fra R og en rekkefølge (rekke[0] er oppleggeren)
  function fraRotasjon(R, rekke) { const k = rNr(R) || 1, pos = {}; rekke.forEach((id, i) => { pos[((k - 1 + i) % 6) + 1] = id; }); return pos; }
  // Én rotasjon (laget vinner serven): spilleren på 2 går til 1, …, 1 til 6. steg kan være negativt (tilbake).
  function roter(pos, steg) {
    let ut = Object.assign({}, pos); const n = ((steg == null ? 1 : steg) % 6 + 6) % 6;
    for (let i = 0; i < n; i++) { const f = ut; ut = {}; PLASSER.forEach((p) => { ut[p] = f[(p % 6) + 1]; }); }
    return ut;
  }
  // Hovedoppleggeren: første spiller med rolle O i plassrekkefølge
  function opplegger(pos, roller) { for (const p of PLASSER) { const id = pos[p]; if (id != null && roller && roller[id] === 'O') return id; } return null; }
  function rotasjonAv(pos, roller) { const o = opplegger(pos, roller); const p = o == null ? null : plassAv(pos, o); return p ? 'R' + p : null; }
  // Ny R: samme rekkefølge rundt banen, oppleggeren flyttes til plass R
  function settRotasjon(pos, roller, R) {
    const o = opplegger(pos, roller); if (o == null || !rNr(R)) return Object.assign({}, pos);
    return fraRotasjon(R, rekkefolge(pos, plassAv(pos, o)));
  }
  // Alle seks rotasjoner fra startoppstillingen: { R1: plasser, … } (nøkkel = oppleggerens plass)
  function alleRotasjoner(pos, roller) {
    const ut = {}; for (let s = 0; s < 6; s++) { const p = roter(pos, s); const R = rotasjonAv(p, roller); if (R) ut[R] = p; }
    return ut;
  }

  // 5-1-systemet: rotasjonen R gir fast rolle på hver plass (R1: 1 O, 2 K1, 3 M1, 4 D, 5 K2, 6 M2).
  // Spilleren som settes på en plass får plassens rolle.
  function rolleForPlass(R, p) { const k = rNr(R) || 1; return REKKEFOLGE_51[((Number(p) - k) % 6 + 6) % 6]; }
  function rollerFraSystem(pos, R) { const r = {}; PLASSER.forEach((p) => { const id = pos && pos[p]; if (id != null && id !== '') r[id] = rolleForPlass(R, p); }); return r; }
  // Ny rotasjon: hver spiller beholder rollen og flyttes til plassen som har den rollen i den nye rotasjonen
  function flyttTilRotasjon(pos, fra, til) {

  if (!deviceId) { deviceId = 'd' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('rv-device', deviceId); } catch (e) {} }
  try { const v = localStorage.getItem('rv-view'); if (v) { const o = JSON.parse(v); S.filter = o.filter === 'vare' ? 'vare' : 'alle'; } } catch (e) {}

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (a, b) => b ? Math.round((a / b) * 100) + ' %' : '–';
  const pct1 = (a, b) => b ? (Math.round((a / b) * 1000) / 10).toString().replace('.', ',') + ' %' : '–';
  const dec = (x) => (Math.round(x * 100) / 100).toFixed(2).replace('.', ',');
  // Snitt (0–2) med søyle: under 1,00 rød, 1,00–1,20 gul, over 1,20 grønn
  const avgNum = (v) => typeof v === 'number' ? v : parseFloat(String(v ?? '').replace('−', '-').replace(',', '.'));
  // Fargegrenser per kjønn: [rød under, grønn over]. Kvinner har lavere angrepseffektivitet enn menn (ca. 0,07–0,10),
  // og litt bedre mottak. Midtspillere har høyere angrepssnitt enn andre. Se «Fargeforklaring» i menyen
  const THRESH = {
    kvinner: { att: [1.10, 1.25], attMidt: [1.15, 1.35], rec: [1.20, 1.40], srv: [0.95, 1.10] },
    menn: { att: [1.15, 1.30], attMidt: [1.25, 1.45], rec: [1.15, 1.35], srv: [0.90, 1.05] }
  };
  const ctxGender = () => CTX.gender === 'menn' || (!CTX.gender && /herre|menn|\bH\d/i.test((CTX.name || '') + ' ' + (CTX.our || ''))) ? 'menn' : 'kvinner';
  const thr = (kind, pos) => { const T = THRESH[ctxGender()]; return kind === 'att' ? (pos === 'Midt' ? T.attMidt : T.att) : kind === 'srv' ? T.srv : T.rec; };
  // Lav og høy: lavest og høyest snitt blant spillere med nok forsøk (mottak og angrep minst 5, serve minst 3). Krever minst to spillere
  const extremes = (obj, f, minN) => { const el = Object.entries(obj).filter(([, r]) => r.n >= minN).sort((a, b) => f(a[1]) - f(b[1]) || b[1].n - a[1].n); return el.length > 1 && f(el[0][1]) !== f(el[el.length - 1][1]) ? { lo: el[0][0], hi: el[el.length - 1][0] } : {}; };
  const loHi = (id, ex) => id === ex.lo ? [' class="weakest"', ' <span class="weak-tag">Lav</span>'] : id === ex.hi ? [' class="strongest"', ' <span class="weak-tag strong">Høy</span>'] : ['', ''];
  // Svakest: lavest snitt blant spillere med nok forsøk (mottak og angrep minst 5, serve minst 3)
  const srvAvg = (r) => 1 + (r.E - r.F) / r.n;
  const weakestOf = (obj, f, minN) => (Object.entries(obj).filter(([, r]) => r.n >= minN).sort((a, b) => f(a[1]) - f(b[1]) || b[1].n - a[1].n)[0] || [])[0];
  const attAvg = (r) => 1 + (r.c2 - r.c0 - r.B) / r.n;
  const avgLvl = (n, kind, pos) => { n = Math.round(n * 100) / 100; const [lo, hi] = thr(kind, pos); return n < lo ? 'lo' : n <= hi ? 'mid' : 'hi'; };
  const posOf = (id) => (player(id) || {}).pos || '';
  const posByNr = (nr) => ((S.roster || []).find((x) => !x.archived && String(x.nr) === String(nr)) || {}).pos || '';
  function avgBarOnly(v, cls, kind, pos) {
    const n = avgNum(v); if (v == null || !isFinite(n)) return '';
    return '<span class="avgbar ' + avgLvl(n, kind, pos) + (cls ? ' ' + cls : '') + '" aria-hidden="true"><i style="width:' + Math.max(3, Math.min(100, n / 2 * 100)) + '%"></i></span>';
  }
  function avgBar(v, txt, kind, pos) {
    const n = avgNum(v); if (v == null || !isFinite(n)) return txt != null ? txt : '–';
    return '<span class="avg">' + (txt != null ? txt : dec(n)) + avgBarOnly(n, '', kind, pos) + '</span>';
  }
  const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleDateString('nb-NO', { weekday: 'short', day: 'numeric', month: 'short' }) + (iso.length > 10 ? ' · ' + d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' }) : ''); };
  const isOurs = (m) => m.home === OUR || m.away === OUR;
  const cur = () => S.matches.find((m) => m.id === S.matchId);
  // Spillere på et annet lag (når vi fører statistikk for andres kamper) har id «o:<lag>:<nr>»
  const player = (id) => {
    if (typeof id === 'string' && id.startsWith('o:')) {
      const [, slug, nr] = id.split(':'); const p = ((S.opps[slug] || {}).players || []).find((x) => String(x.nr) === nr) || {};
      return { id, nr, name: NAMEHINT[id] || p.name || '#' + nr, pos: p.pos || '' };
    }
    return S.roster.find((p) => p.id === id);
  };
  const EXTRA = { midt: 'Midtspillere' };
  // Navn slik de var da registreringen ble gjort (følger spilleren selv om tropp eller nummer endres senere)
  const NAMEHINT = {}, OPPHINT = {};
  const learnNames = (evs, opp) => evs.forEach((e) => { if (!e.n) return; if (e.type === 'opp' || e.type === 'dir') { if (opp) opp[String(e.p)] = e.n; } else NAMEHINT[e.p] = e.n; });
  const pname = (id) => { const p = player(id); return p ? p.name.split(' ')[0] : NAMEHINT[id] ? NAMEHINT[id].split(' ')[0] : (EXTRA[id] || '?'); };
  // Kamptyper: serie fra terminlisten, eller egne kamper (cup, europacup, trening)
  const TYPES = { serie: 'Seriekamp', cup: 'Cupkamp', europacup: 'Europacup', turnering: 'Turnering', trening: 'Treningskamp' };
  const TSHORT = { serie: 'Serie', cup: 'Cup', europacup: 'EC', turnering: 'T', trening: 'Tr' };
  const roundLabel = (m) => m.custom ? (m.type === 'turnering' && m.round ? m.round : (TYPES[m.type] || 'Egen kamp') + (m.round ? ' · ' + m.round : '')) : (m.round ? 'Runde ' + m.round : 'Uten runde');
  const roundShort = (m) => m.custom ? (m.short || TSHORT[m.type] || 'Egen') : 'R' + (m.round || '?');
  // Motstanderens tropp lagres per lag og huskes til neste kamp mot samme lag
  const teamSlug = (s) => String(s || '').toLowerCase().replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/å/g, 'a').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'lag';
  const usName = (m) => (m && m.focus) || OUR;
  const canLive = (m) => isOurs(m) || !!(m && m.focus);
  const oppTeam = (m) => m.home === usName(m) ? m.away : m.home;
  const rosterOf = (team) => ((S.opps[teamSlug(team)] || {}).players || []);
  const oppRoster = (m) => rosterOf(oppTeam(m));
  const teamRoster = (m) => m && m.focus ? rosterOf(m.focus).map((p) => ({ id: 'o:' + teamSlug(m.focus) + ':' + p.nr, nr: String(p.nr), name: p.name || '#' + p.nr, pos: p.pos || '' })) : S.roster;
  const isSlot = (t) => /^\d\. plass$/.test(String(t || ''));
  const oppP = (m, nr) => oppRoster(m).find((p) => String(p.nr) === String(nr));
  const oppName = (m, nr) => OPPHINT[String(nr)] || ((m && oppP(m, nr)) || {}).name || '';
  const oppLabel = (m, nr) => { const n = oppName(m, nr); return '#' + nr + (n ? ' ' + n.split(' ')[0] : ''); };

  // ---------- Data ----------
  // Appen er flyttet til den nye løsningen (Supabase, beta) 25.10.2026. Denne versjonen er bare til lesing.
  // Gjelder bare Claude-artefakten: ikke de åpne sidene (PUBLIC) og ikke V2-bygget (V2_CONFIG).
  const MOVED_URL = 'https://madsfossmark-ai.github.io/Statistikk-V2-beta/';
  const FROZEN = !window.PUBLIC && !window.V2_CONFIG;
  function frozenDb(db) {
    const nope = async () => { S.error = 'Appen er flyttet til den nye løsningen (beta). Her kan du bare se, ikke endre. Før statistikk på ' + MOVED_URL; render(); throw Object.assign(new Error('flyttet'), { code: 'flyttet' }); };
    return {
      doc: (path) => { const d = db.doc(path); return { onSnapshot: (...a) => d.onSnapshot(...a), get: (...a) => d.get(...a), set: nope, update: nope, delete: nope }; },
      collection: (path) => { const c = db.collection(path); return { onSnapshot: (...a) => c.onSnapshot(...a), get: (...a) => c.get(...a), add: nope }; },
    };
  }
  function movedBanner() {
    if (!FROZEN || document.getElementById('moved-banner')) return;
    const d = document.createElement('div'); d.id = 'moved-banner'; d.setAttribute('role', 'status');
    d.innerHTML = '<b>Flyttet:</b> statistikken føres nå i den nye løsningen (beta). Denne versjonen er bare til lesing. <a href="' + MOVED_URL + '" target="_blank" rel="noopener">Åpne den nye appen ›</a>';
    document.body.prepend(d);
  }
  async function boot() {
    try { S.db = await window.claude?.use?.('db'); } catch (e) { S.db = null; }
    if (FROZEN && S.db) { S.db = frozenDb(S.db); movedBanner(); }
    try { S.dl = await window.claude?.use?.('downloads'); } catch (e) { S.dl = null; }
    if (!window.PUBLIC) {
      try { S.user = await window.claude?.use?.('user'); } catch (e) { S.user = null; }
      if (S.user) {
        const [w, owner, adm, id] = await Promise.all([S.user.can('data.write'), S.user.isOwner(), S.user.canEdit(), S.user.id()]);
        S.dash = w === false && !owner; S.canAdmin = !!(owner || adm); S.myId = id;
      }
    }
    document.documentElement.classList.toggle('dash', S.dash);
    if (!S.db) { S.offline = true; S.ready = true; render(); return; }
    let saved = null; try { saved = localStorage.getItem('rv-ctx'); } catch (e) {}
    if (!window.PUBLIC) S.db.doc('config/access').onSnapshot((snap) => {
      S.grants = snap.exists ? (snap.data().grants || {}) : {}; if (S.dash) resolveDashCtx(); else render();
    }, () => { S.grants = {}; if (S.dash) resolveDashCtx(); });
    S.db.doc('config/contexts').onSnapshot((snap) => {
      const list = snap.exists ? (snap.data().list || []) : [];
      S.contexts = [MAIN_CTX].concat(list.filter((c) => c && c.id && c.id !== 'main'));
      if (S.dash && !window.PUBLIC) { S.ctxLoaded = true; resolveDashCtx(); return; }
      if (!S.ctxReady) { S.ctxReady = true; applyCtx(saved || 'main'); }
      else if (!S.contexts.some((c) => c.id === CTX.id)) applyCtx('main');
      else { CTX = S.contexts.find((c) => c.id === CTX.id); render(); }
    }, () => { if (!S.ctxReady) { S.ctxReady = true; applyCtx('main'); } });
  }

  // En som bare kan se, får laget som er knyttet til dem under «Tilgang»
  function resolveDashCtx() {
    if (!S.ctxLoaded || S.grants == null) return;
    const id = S.myId && S.grants[S.myId];
    if (!id || !S.contexts.some((c) => c.id === id)) {
      ctxUnsubs.forEach((u) => { try { u(); } catch (e) {} }); ctxUnsubs = [];
      S.noAccess = true; S.ready = true; S.ctxReady = true; render(); return;
    }
    S.noAccess = false;
    if (!S.ctxReady || CTX.id !== id) { S.ctxReady = true; applyCtx(id); } else render();
  }

  let ctxUnsubs = [];
  function applyCtx(id) {
    CTX = S.contexts.find((c) => c.id === id) || MAIN_CTX;
    PFX = CTX.prefix || ''; OUR = CTX.our || 'Randaberg';
    try { localStorage.setItem('rv-ctx', CTX.id); } catch (e) {}
    ctxUnsubs.forEach((u) => { try { u(); } catch (e) {} }); ctxUnsubs = [];
    closeSeasonLogs(); openLogs(null);
    applyTheme(); S.logos = {};
    S.roster = []; S.matches = []; S.opps = {}; S.ready = false; S.view = 'list'; S.matchId = null; S.showNew = false; S.showNewCtx = false; S.showShare = false;
    SEASON.player = 'team';
    render(); toTop();
    subscribeCtx();
  }
  function subscribeCtx() {
    const keep = (u) => { if (typeof u === 'function') ctxUnsubs.push(u); };
    keep(S.db.doc(PFX + 'config/roster').onSnapshot((snap) => {
      S.roster = snap.exists ? (snap.data().players || []).map((p) => ({ ...p })) : [];
      S.ready = true; render();
    }, (e) => { S.error = 'Kunne ikke laste troppen (' + e.code + ').'; render(); }));
    keep(S.db.doc(PFX + 'config/logos').onSnapshot((snap) => { S.logos = snap.exists ? (snap.data().logos || {}) : {}; render(); }, () => {}));
    // Trenerens vurderinger til serveplanen: eget dokument, holdes utenfor all statistikk
    S.scoutNotes = {}; Object.values(SCOUT.unsubs).forEach((u) => { try { u(); } catch (e) {} }); SCOUT.unsubs = {}; SCOUT.logs = {}; SCOUT.memo = null;
    if (!window.PUBLIC) keep(S.db.doc(PFX + 'scouting/notater').onSnapshot((snap) => { S.scoutNotes = snap.exists ? JSON.parse(JSON.stringify(snap.data().lag || {})) : {}; render(); }, () => {}));
    keep(S.db.collection(PFX + 'opponents').onSnapshot((snap) => {
      const o = {}; snap.docs.forEach((d) => { o[d.id] = JSON.parse(JSON.stringify(d.data())); }); S.opps = o; render();
    }, () => {}));
    keep(S.db.collection(PFX + 'matches').onSnapshot((snap) => {
      S.matches = snap.docs.map((d) => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) }));
      S.matches.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      S.ready = true; if (S.view === 'season') openSeasonLogs(); render();
    }, (e) => { S.error = 'Kunne ikke laste kamper (' + e.code + ').'; render(); }));
  }

  // Felles toppmeny: lag/sesong, Kamper · Tabell · Dashboard · Analyse, og menyen med det som brukes sjeldnere
  // Bare i V2-bygget (der analysesiden ligger ved siden av lagsiden); slås av med config.analyse = false
  function analyseHref() { return (window.ForsvarKamp && !(window.V2_CONFIG && window.V2_CONFIG.analyse === false) && !window.PUBLIC) ? 'analyse/' + (location.search.indexOf('demo') >= 0 ? '?demo=1' : '') : null; }
  function navHtml(aktiv) {
    const tab = (k, a, l) => '<button class="navtab" data-a="' + a + '"' + (aktiv === k ? ' aria-current="page"' : '') + '>' + l + '</button>';
    const an = analyseHref();
    return '<nav class="topnav" aria-label="Hovedmeny"><div class="tn-id">' + crest(OUR, 'md') + ctxPicker() + '</div>'
      + '<div class="navtabs">' + tab('kamper', 'back', 'Kamper') + tab('tabell', 'table', 'Tabell') + tab('dashboard', 'season', 'Dashboard')
      + (an ? '<a class="navtab" href="' + an + '">Analyse</a>' : '') + '</div><span class="spacer"></span>' + menuHtml() + '</nav>';
  }
  function ctxPicker() {
    if (window.PUBLIC || S.offline || S.dash) return '<span class="label">' + esc(CTX.name) + '</span>';
    return '<label class="ctx-pick" for="ctx-pick"><span class="sr">Sesong eller lag</span><select id="ctx-pick" data-a="ctx">'
      + S.contexts.map((c) => '<option value="' + esc(c.id) + '"' + (c.id === CTX.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('')
      + '<option value="__new">+ Ny sesong eller lag …</option></select></label>';
  }
  function newCtxForm() {
    return '<form class="panel" id="ctxform" aria-label="Ny sesong eller lag"><div class="panel-head"><h2>Ny sesong eller lag</h2><span class="status">Får egne kamper, egen tropp og egen sesongstatistikk. Det du har nå, ligger urørt og kan velges i menyen.</span></div><div class="form">'
      + '<div class="field"><label for="ctx-name">Navn</label><input id="ctx-name" type="text" required placeholder="F.eks. Randaberg · Mizunoligaen kvinner 27/28"></div>'
      + '<div class="field"><label for="ctx-our">Vårt lag heter</label><input id="ctx-our" type="text" required value="' + esc(OUR) + '"></div>'
      + '<div class="field"><label for="ctx-gender">Klasse</label><select id="ctx-gender"><option value="kvinner"' + (ctxGender() === 'kvinner' ? ' selected' : '') + '>Kvinner</option><option value="menn"' + (ctxGender() === 'menn' ? ' selected' : '') + '>Menn</option></select></div>'
      + '<label class="chk" for="ctx-copy"><input id="ctx-copy" type="checkbox"> Ta med spillertroppen fra «' + esc(CTX.name) + '»</label>'
      + '<div style="display:flex;gap:8px"><button class="primary" type="submit">Opprett</button><button class="secondary" type="button" data-a="ctx-cancel">Avbryt</button></div></div></form>';
  }

  function openLogs(id) {
    if (S.logUnsub) { S.logUnsub(); S.logUnsub = null; }
    S.logs = {}; S.logsFor = null;
    if (!S.db || !id) return;
    S.logUnsub = S.db.collection(PFX + 'matches/' + id + '/log').onSnapshot((snap) => {
      const logs = {};
      snap.docs.forEach((d) => { logs[d.id] = (d.data().events || []).slice(); });
      Object.keys(OPPHINT).forEach((k) => delete OPPHINT[k]); Object.values(logs).forEach((evs) => learnNames(evs, OPPHINT));
      S.logs = logs; S.logsFor = id; render();
    }, (e) => { S.error = 'Registreringene kunne ikke lastes (' + e.code + ').'; render(); });
  }

  function allEvents() { const out = []; Object.values(S.logs).forEach((a) => out.push(...a)); out.sort((a, b) => a.t - b.t); return out; }

  async function saveMatch(id, patch) {
    if (!S.db) return;
    try { await S.db.doc(PFX + 'matches/' + id).update(patch); }
    catch (e) { S.error = 'Lagring feilet (' + e.code + '). Prøv igjen.'; render(); }
  }
  async function saveRoster(players) {
    S.roster = players; render();
    if (!S.db) return;
    try { await S.db.doc(PFX + 'config/roster').set({ players }); }
    catch (e) { S.error = 'Troppen ble ikke lagret (' + e.code + ').'; render(); }
  }

  async function logEvent(type, who, code, extra) {
    const m = cur(); if (!m || !S.db) return;
    const set = (m.current && m.current.set) || 1;
    const key = deviceId + '-s' + set;
    const own = (S.logs[key] || []).slice();
    const ev = Object.assign({ t: Date.now(), set, type, p: who, c: code }, extra || {});
    const nm = type === 'opp' || type === 'dir' ? ((oppP(m, who) || {}).name || '') : (((type === 'rec' || type === 'att' || type === 'srv') && player(who)) || {}).name;
    if (nm && !String(nm).startsWith('#')) ev.n = nm;
    own.push(ev);
    S.logs[key] = own;
    render();
    try { await S.db.doc(PFX + 'matches/' + m.id + '/log/' + key).set({ device: deviceId, set, events: own }); }
    catch (e) { S.error = 'Registreringen ble ikke lagret (' + e.code + ').'; render(); }
    if (m.status !== 'pågår' && m.status !== 'ferdig') saveMatch(m.id, { status: 'pågår' });
  }

  async function undo() {
    const m = cur(); if (!m || !S.db) return;
    let bestKey = null, bestT = -1;
    Object.entries(S.logs).forEach(([k, evs]) => { if (k.startsWith(deviceId + '-') && evs.length && evs[evs.length - 1].t > bestT) { bestT = evs[evs.length - 1].t; bestKey = k; } });
    if (!bestKey) return;
    const own = S.logs[bestKey].slice(0, -1);
    S.logs[bestKey] = own; render();
    try { await S.db.doc(PFX + 'matches/' + m.id + '/log/' + bestKey).set({ device: deviceId, set: Number(bestKey.split('-s')[1]), events: own }); }
    catch (e) { S.error = 'Angre ble ikke lagret (' + e.code + ').'; render(); }
  }

  // ---------- Statistikk ----------
  function computeStats(events) {
    const rec = {}, att = {}, srv = {}, opp = {};
    const bump = (o, k) => (o[k] ||= { n: 0, s: 0, c0: 0, c1: 0, c2: 0, B: 0, F: 0, I: 0, E: 0 });
    events.forEach((e) => {
      if (e.type === 'rec') { const r = bump(rec, e.p); r.n++; r['c' + e.c]++; r.s += Number(e.c); }
      if (e.type === 'opp') { const r = bump(opp, e.p); r.n++; r['c' + e.c]++; r.s += Number(e.c); }
      if (e.type === 'att') { const r = bump(att, e.p); r.n++; if (e.c === 'B') r.B++; else r['c' + e.c]++; }
      if (e.type === 'srv') { const r = bump(srv, e.p); r.n++; r[e.c]++; }
    });
    const sum = (o) => Object.values(o).reduce((a, r) => { Object.keys(r).forEach((k) => a[k] = (a[k] || 0) + r[k]); return a; }, { n: 0, s: 0, c0: 0, c1: 0, c2: 0, B: 0, F: 0, I: 0, E: 0 });
    return { rec, att, srv, opp, tRec: sum(rec), tAtt: sum(att), tSrv: sum(srv), tOpp: sum(opp) };
  }

  // ---------- Visninger ----------
  // Nedtrekksmenyer og skjema skal ikke hoppe ut når data oppdateres (sanntid/polling hvert 4. sekund):
  // - mens en nedtrekksmeny er åpen (fokus, ikke valgt ennå) utsettes tegningen til valget er gjort eller fokus forlater den
  // - verdier brukeren har fylt inn i et skjema (ny kamp, resultat, nytt lag …) beholdes når siden tegnes på nytt
  const UI = { velger: null, utsatt: false, utkast: {} };
  app.addEventListener('focusin', (ev) => { if (ev.target.tagName === 'SELECT') UI.velger = ev.target; });
  app.addEventListener('focusout', (ev) => { if (ev.target === UI.velger) { UI.velger = null; if (UI.utsatt) { UI.utsatt = false; setTimeout(render, 0); } } });
  const huskUtkast = (ev) => { const el = ev.target; if (el.tagName === 'SELECT' && el === UI.velger && ev.type === 'change') { UI.velger = null; if (UI.utsatt) { UI.utsatt = false; setTimeout(render, 0); } }
    if (el.id && el.closest && el.closest('form')) UI.utkast[el.id] = el.type === 'checkbox' ? { c: el.checked } : { v: el.value }; };
  app.addEventListener('input', huskUtkast, true); app.addEventListener('change', huskUtkast, true);
  app.addEventListener('submit', (ev) => { ev.target.querySelectorAll('[id]').forEach((el) => { delete UI.utkast[el.id]; }); }, true);
  function render() {
    if (UI.velger && UI.velger.isConnected && document.activeElement === UI.velger) { UI.utsatt = true; return; }

      + '<span><b>Serve.</b> Snittet er 0 for feil, 1 for serve i spill og 2 for ess, altså 1 + (ess − feil) / antall serve. Over 1,00 betyr flere ess enn feil. Grensene er en faglig vurdering, litt lavere for menn fordi hoppserve gir flere feil.</span>'

  function logoFromFile(file) {
    return new Promise((ok, feil) => {
      const r = new FileReader();
      r.onerror = () => feil(new Error('kunne ikke lese filen'));
      r.onload = () => {
        const img = new Image();
        img.onerror = () => feil(new Error('ikke et bilde'));
        img.onload = () => {
          const N = 256, k = Math.min(1, N / Math.max(img.width || N, img.height || N));
          const w = Math.max(1, Math.round((img.width || N) * k)), hh = Math.max(1, Math.round((img.height || N) * k));
          const c = document.createElement('canvas'); c.width = w; c.height = hh; c.getContext('2d').drawImage(img, 0, 0, w, hh);
          let url = c.toDataURL('image/png'); if (url.length > 150000) url = c.toDataURL('image/webp', 0.85);
          if (url.length > 190000) return feil(new Error('bildet er for stort'));
          ok(url);
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  async function bytteLagre(m) {

  // Antall og snitt (0–2) ved siden av navnet: hele kampen
  // ---- Serveplan (analysemodellen i moduler/scouting/analyse.js, innbakt over app-skriptet) ----
  // Planen bygger bare på kamper før denne: offisiell statistikk (CEV/NVBF) og egen føring mot samme lag.
  const SCOUT = { unsubs: {}, logs: {}, memo: null };
  function scoutLoad(m) {
    if (!S.db || window.PUBLIC || S.dash || !m) return;
    const them = oppTeam(m);
    S.matches.filter((x) => x.id !== m.id && x.status !== 'kommende' && (x.home === them || x.away === them) && !SCOUT.unsubs[x.id]).forEach((x) => {
      SCOUT.unsubs[x.id] = S.db.collection(PFX + 'matches/' + x.id + '/log').onSnapshot((snap) => {
        const evs = []; snap.docs.forEach((d) => evs.push(...(d.data().events || []))); SCOUT.logs[x.id] = evs; SCOUT.memo = null; render();
      }, () => {});
    });
  }
  function scoutPlan(m) {
    if (!window.Scouting || !m) return null;
    const key = [CTX.id, m.id, usName(m), Object.keys(SCOUT.logs).length, S.matches.map((x) => x.id + (x.nvbf ? (x.nvbf.statsFetchedAt || x.nvbf.checked || 1) : '')).join(',')].join('|');
    if (SCOUT.memo && SCOUT.memo.key === key) return SCOUT.memo.val;
    const W = window.Scouting, them = oppTeam(m);
    const model = W.normaliser({ matches: S.matches.filter((x) => x.id !== m.id), logs: SCOUT.logs, roster: S.roster, opponents: S.opps || {} }, { our: usName(m) });
    const plan = W.serveplan(W.lagprofil(model, them, { foer: m.date, utenKamp: m.id }));
    const val = { lag: them, plan, byNr: Object.fromEntries(plan.rader.map((r) => [String(r.nr), r])), beslutninger: model.beslutninger };
    SCOUT.memo = { key, val }; return val;
  }
  const scoutNote = (lag, nr) => ((S.scoutNotes || {})[lag] || {})[String(nr)] || null;
  function scoutMarks(nr, txt) {
    const sp = scoutPlan(cur()); if (!sp) return txt;
    const r = sp.byNr[String(nr)], n = scoutNote(sp.lag, nr), harNotat = n && (n.vurdering || n.tekst);
    let pre = '';
    if (r && r.rang) pre += '<span class="plan-tag' + (r.kvalitet.nivaa === 'svak' ? ' svak' : '') + '" title="' + esc(r.grunner.join(' · ')) + '">Plan ' + r.rang + '</span>';

  function scoutView() {

    const W = window.Scouting, pct = (x) => W.pct(x), lag = sp.lag, kan = !window.PUBLIC && !S.dash;
    let h = '<header class="bar det-bar"><button class="link" data-a="scout-back">‹ Tilbake</button><div class="title"><span class="display tm">Serveplan mot ' + esc(shortName(lag)) + '</span><span class="sub">Bygger på kamper før ' + esc(fmtDate(m.date)) + '. Trenerens vurdering påvirker ikke rekkefølgen.</span></div></header>';
    if (!sp.plan.rader.length) return h + '<div class="panel"><div class="empty">Ingen mottaksdata for ' + esc(lag) + ' i tidligere kamper.</div></div>';
    h += '<section class="panel"><table class="tbl"><thead><tr><th>#</th><th style="text-align:left">Spiller</th><th>Mottak</th><th>Feil</th><th>Positivt</th><th style="text-align:left">Kvalitet</th></tr></thead><tbody>' + sp.plan.rader.map((r) => {
      const n = scoutNote(lag, r.nr) || {};
      return '<tr><td class="display" style="font-size:22px;color:var(--accent)">' + (r.rang || '–') + '</td><td style="text-align:left"><b>#' + esc(r.nr) + ' ' + esc(r.navn) + '</b><div class="scout-why">' + r.grunner.map(esc).join('<br>') + '</div>' + r.flagg.map((f) => '<div class="scout-why" style="color:var(--opp)">⚑ ' + esc(f) + '</div>').join('')

  // Tabell: CEV-poeng (3–0/3–1 gir 3, 3–2 gir 2, 2–3 gir 1), så seire, poeng, settkvotient og ballkvotient
  function tableMatches() {
    return seasonMatches().filter((m) => m.stage !== 'sluttspill');
  }
  // Alle seriens/turneringens kamper med kjente lag, også sluttspill (brukes av topplistene)
  function seasonMatches() {
    return S.matches.filter((m) => !isSlot(m.home) && !isSlot(m.away) && !isTest(m) && (!m.custom || m.type === 'turnering' || m.type === 'serie'));
  }
  function standings() {
    const T = {}; const row = (t) => (T[t] ||= { team: t, k: 0, v: 0, tap: 0, p: 0, sv: 0, st: 0, bv: 0, bt: 0 });
    tableMatches().forEach((m) => {
      row(m.home); row(m.away);
      if (m.status !== 'ferdig' || !(m.setsHome + m.setsAway)) return;
      const H = row(m.home), A = row(m.away), hs = m.setsHome || 0, as = m.setsAway || 0;
      H.k++; A.k++; H.sv += hs; H.st += as; A.sv += as; A.st += hs;
      (m.setScores || []).forEach(([x, y]) => { H.bv += x; H.bt += y; A.bv += y; A.bt += x; });
      const win = hs > as ? H : A, lose = hs > as ? A : H, close = Math.min(hs, as) === 2;
      win.v++; lose.tap++; win.p += close ? 2 : 3; lose.p += close ? 1 : 0;
    });
    const q = (a, b) => b ? a / b : (a ? Infinity : 0);
    return Object.values(T).sort((a, b) => b.v - a.v || b.p - a.p || q(b.sv, b.st) - q(a.sv, a.st) || q(b.bv, b.bt) - q(a.bv, a.bt) || a.team.localeCompare(b.team, 'nb'));
  }
  function tableView() {
    const st = standings(), q = (a, b) => b ? (Math.round(a / b * 1000) / 1000).toFixed(3).replace('.', ',') : (a ? 'MAX' : '–');
    const all = tableMatches(), done = all.filter((m) => m.status === 'ferdig').length;
    let h = navHtml('tabell') + '<header class="bar"><div class="title"><span class="display">Tabell</span><span class="sub">' + esc(CTX.name) + ' · ' + done + ' av ' + all.length + ' kamper spilt</span></div><span class="spacer"></span></header>';
    h += '<section class="panel"><div class="tbl-wrap"><table class="tbl standings"><thead><tr><th>#</th><th class="l-al">Lag</th><th>K</th><th>V</th><th>T</th><th>Poeng</th><th>Sett</th><th class="hide-sm">Settkv.</th><th class="hide-sm">Ballkv.</th></tr></thead><tbody>'
      + st.map((r, i) => '<tr' + (r.team === OUR ? ' class="us"' : '') + '><td>' + (i + 1) + '</td><td class="key l-al">' + teamTag(r.team, 'sm', shortName(r.team)) + '</td><td>' + r.k + '</td><td>' + r.v + '</td><td>' + r.tap + '</td><td class="key">' + r.p + '</td><td>' + r.sv + '–' + r.st + '</td><td class="hide-sm">' + q(r.sv, r.st) + '</td><td class="hide-sm">' + q(r.bv, r.bt) + '</td></tr>').join('')
      + '</tbody></table></div><div class="code-legend">Rangering: seire, poeng (3–0 og 3–1 gir 3 poeng, 3–2 gir 2 og 2–3 gir 1), settkvotient, ballkvotient.</div></section>';
    const po = S.matches.filter((m) => m.stage === 'sluttspill' || isSlot(m.home) || isSlot(m.away));
    if (po.length) h += '<section class="panel"><div class="panel-head"><h2>Sluttspill</h2></div><div class="po">' + po.map((m) => {
      const slot = (t) => { if (!isSlot(t)) return esc(t); const r = st[parseInt(t, 10) - 1]; return esc(t) + (r && r.k ? ' <span class="muted">(nå: ' + esc(shortName(r.team)) + ')</span>' : ''); };
      return '<button class="po-card" data-a="open" data-id="' + esc(m.id) + '"><span class="label">' + esc(m.round || 'Sluttspill') + ' · ' + esc(fmtDate(m.date)) + (m.venue ? ' · ' + esc(m.venue) : '') + '</span><span class="po-teams">' + slot(m.home) + ' – ' + slot(m.away) + '</span><span class="po-res">' + (m.status === 'ferdig' ? (m.setsHome || 0) + '–' + (m.setsAway || 0) + (setList(m) ? ' <small>(' + esc(setList(m)) + ')</small>' : '') : 'Ikke spilt') + '</span></button>';
    }).join('') + '</div></section>';
    h += topListsView();
    return h;
  }

  // Topplister for serien/turneringen: NVBF-statistikk der den finnes, ellers egen føring (også kamper der vi har ført for et annet lag)
  // Kilden for offisiell statistikk: NVBF for serien, CEV for landslagsturneringer
  function srcName(n) { return (n && n.src) || 'NVBF'; }
  function topListsData() {
    const P = {}, pn = (v) => v == null ? null : parseFloat(String(v).replace('−', '-').replace('%', '').replace(',', '.'));
    let src = 0;
    seasonMatches().filter((m) => m.status === 'ferdig').forEach((m) => {
      let n = m.nvbf && m.nvbf.teams && m.nvbf.teams.length && !m.nvbf.partial ? m.nvbf : null;
      if (!n && canLive(m) && SEASON.logs[m.id] && SEASON.logs[m.id].length) n = ownStats(m, SEASON.logs[m.id]);
      if (!n) return; src++; addRecAvg(n);
      n.teams.forEach((t) => (t.players || []).forEach((p) => {
        const key = t.name + '|' + (p.name ? String(p.name).replace(/ \(L\)$/, '') : '#' + p.nr);
        const r = (P[key] ||= { team: t.name, name: p.name ? String(p.name).replace(/ \(L\)$/, '') : '#' + p.nr, nr: p.nr, games: new Set(), rec: 0, recSum: 0, att: 0, kills: 0, attErr: 0, blocked: 0, srv: 0, aces: 0, srvErr: 0, srvKnown: 0, pts: 0 });
        r.games.add(m.id); if (p.nr) r.nr = p.nr;
        if (p.rec) { const a = pn(p.recAvg); if (a != null && !isNaN(a)) { r.rec += p.rec; r.recSum += a * p.rec; } }
        if (p.att) { r.att += p.att; r.kills += p.kills || 0; r.attErr += p.attErr || 0; r.blocked += p.blocked || 0; }
        if (p.srv != null) { r.srv += p.srv; r.srvKnown += p.srv; }
        r.aces += p.aces || 0; r.srvErr += p.srvErr || 0; r.pts += p.pts || 0;
      }));
    });
    return { players: Object.values(P), matches: src };
  }
  function topListsView() {
    const { players, matches } = topListsData(), mode = S.topMode || 'snitt';
    if (!matches) return '<section class="panel"><div class="panel-head"><h2>Topplister</h2></div><div class="empty">Ingen spilte kamper med statistikk ennå.</div></section>';
    const minOf = (f) => Math.max(10, Math.round(0.25 * Math.max(0, ...players.map(f))));
    const lists = [
      { t: 'Angrep', kind: 'att', n: (r) => r.att, v: (r) => 1 + (r.kills - r.attErr - r.blocked) / r.att, vol: (r) => r.kills, volL: 'poeng', unit: 'angrep' },
      { t: 'Mottak', kind: 'rec', n: (r) => r.rec, v: (r) => r.recSum / r.rec, vol: (r) => r.rec, volL: 'mottak', unit: 'mottak' },
      { t: 'Serve', kind: 'srv', n: (r) => r.srvKnown, v: (r) => 1 + (r.aces - r.srvErr) / r.srvKnown, vol: (r) => r.aces, volL: 'ess', unit: 'serve' },
      { t: 'Poeng totalt', kind: null, n: (r) => r.pts, v: null, vol: (r) => r.pts, volL: 'poeng', unit: 'poeng' }
    ];
    const card = (L) => {
      const byVol = mode === 'volum' || !L.v, min = L.v ? minOf(L.n) : 1;
      const rows = players.filter((r) => byVol ? L.vol(r) > 0 : L.n(r) >= min).sort((a, b) => byVol ? (L.vol(b) - L.vol(a) || L.n(a) - L.n(b)) : (L.v(b) - L.v(a) || L.n(b) - L.n(a))).slice(0, 5);
      return '<div class="top-card"><div class="label" style="color:var(--accent)">' + L.t + '</div>'
        + (rows.length ? '<ol class="top-list">' + rows.map((r, i) => '<li' + (r.team === OUR ? ' class="us"' : '') + '><span class="top-rank">' + (i + 1) + '</span>' + crest(r.team, 'sm') + '<span class="top-name"><b>' + esc(r.name) + '</b><small>' + esc(shortName(r.team)) + ' · ' + r.games.size + ' kamp' + (r.games.size === 1 ? '' : 'er') + '</small></span>'
          + '<span class="top-val">' + (byVol ? '<b class="num">' + L.vol(r) + '</b><small>' + L.volL + '</small>' : avgBar(L.v(r), null, L.kind) + '<small>' + L.n(r) + ' ' + L.unit + '</small>') + '</span></li>').join('') + '</ol>'
          : '<div class="empty">For lite data ennå.</div>')
        + (L.v && !byVol ? '<div class="code-legend">Snitt 0–2, minst ' + min + ' ' + L.unit + '.</div>' : '') + '</div>';
    };
    return '<section class="panel"><div class="panel-head"><h2>Topplister · topp 5</h2><div class="seg" role="group" aria-label="Rangering"><button data-a="topmode" data-v="snitt" aria-pressed="' + (mode === 'snitt') + '">Beste snitt</button><button data-a="topmode" data-v="volum" aria-pressed="' + (mode === 'volum') + '">Flest</button></div></div>'
      + '<div class="top-grid">' + lists.map(card).join('') + '</div>'
      + '<div class="code-legend">Fra ' + matches + ' spilte kamper i ' + esc(CTX.name) + '. NVBF-statistikk der den finnes, ellers egen føring fra benken. Serve med snitt krever at serve i spill er ført. ' + legendLink() + '</div></section>';
  }

  async function saveOpp(m, players, team) {
    team = team || oppTeam(m); const id = teamSlug(team);
    players = players.slice().sort((a, b) => Number(a.nr) - Number(b.nr));
    S.opps = Object.assign({}, S.opps, { [id]: { name: team, players } }); render();

    catch (e) { S.error = 'Motstanderens spillere ble ikke lagret (' + e.code + ').'; render(); }
  }

  async function deleteMatch(m) {
    if (!S.db || !m) return;
    try {
      const logs = await S.db.collection(PFX + 'matches/' + m.id + '/log').get();
      for (const d of logs.docs) await S.db.doc(PFX + 'matches/' + m.id + '/log/' + d.id).delete();
      await S.db.doc(PFX + 'matches/' + m.id).delete();
      closeSeasonLogs(); openLogs(null); S.view = 'list'; S.matchId = null; render(); toTop();
    } catch (e) { S.error = 'Kampen ble ikke slettet (' + e.code + ').'; render(); }
  }

  // ---------- Kampark (som Excel-arket) ----------
  function sheetView() {
    const m = cur();

    const maxSet = Math.max(5, ...evs.map((e) => e.set || 1), (m.current && m.current.set) || 1);

    const block = (title, type, ids, labelOf, totalsHead, totals) => {
      const list = byType(type);

        + '<tr><td class="sk-blank"></td><td class="sk-band" colspan="' + (sets.length + 3) + '">' + title + '</td></tr>'

    const recIds = order([...new Set(byType('rec').map((e) => e.p).concat(m.receivers || []))]);

    let t = '<table class="sk"><tbody>'

      + '<td class="sk-legend" colspan="' + (sets.length - Math.ceil(sets.length / 2) + 3) + '">0 Feil (blokkert vises som rød 0)<br>1 Spill videre<br>2 Perfekt / poeng</td></tr>'
