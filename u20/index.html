<script>/*
 * Falsk Supabase-klient i minnet for tester og demo (spor B). Etterligner den delen av supabase-js som
 * SupabaseStore bruker: schema('stats').from(t).select/insert/upsert/update/delete/eq/in, channel().on().subscribe().
 * Etterligner også databasereglene fra spor A som er viktige for appen: unik hendelses-id (retry = no-op),
 * én angre per hendelse, versjonsøkning på kamper, og «nettverksbrudd» (offline = true).
 * Ingen ekte data. Brukes aldri mot et Supabase-prosjekt.
 */
(function (root) {
  'use strict';
  function FakeDb(seed) {
    const t = { contexts: [], squad_players: [], opponents: [], opponent_players: [], matches: [], match_sets: [], events: [], scouting_notes: [], logos: [] };
    Object.assign(t, JSON.parse(JSON.stringify(seed || {})));
    const lyttere = [];
    return {
      t, offline: false, nekt: null, kall: 0,
      varsle(tabell, rad) { lyttere.slice().forEach((l) => { if (l.table === tabell && (!l.filter || match(l.filter, rad))) setTimeout(() => l.cb({ new: rad }), 0); }); },
      lytt(l) { lyttere.push(l); return () => { const i = lyttere.indexOf(l); if (i >= 0) lyttere.splice(i, 1); }; },
    };
  }
  function match(filter, rad) { const m = String(filter).match(/^(\w+)=eq\.(.+)$/); return !m || !rad || String(rad[m[1]]) === m[2]; }
  const nøkler = { events: ['id'], matches: ['id'], contexts: ['id'], squad_players: ['context_id', 'legacy_id'], opponents: ['context_id', 'slug'],
    opponent_players: ['opponent_id', 'jersey'], match_sets: ['match_id', 'set_no'], scouting_notes: ['context_id', 'opponent_slug', 'jersey'], logos: ['context_id', 'team'] };
  const uid = () => 'f' + Math.random().toString(16).slice(2, 10) + '-0000-4000-8000-' + Math.random().toString(16).slice(2, 14).padEnd(12, '0');

  function FakeClient(db) {
    function from(tabell) {
      let op = 'select', rader = null, patch = null, opt = {}, filtre = [], retur = false;
      const b = {
        select() { if (op !== 'select') retur = true; return b; },
        eq(k, v) { filtre.push((r) => String(r[k]) === String(v)); return b; },
        in(k, vs) { filtre.push((r) => vs.map(String).includes(String(r[k]))); return b; },
        insert(r) { op = 'insert'; rader = [].concat(r); return b; },
        upsert(r, o) { op = 'upsert'; rader = [].concat(r); opt = o || {}; return b; },
        update(p) { op = 'update'; patch = p; return b; },
        delete() { op = 'delete'; return b; },
        then(ok, feil) { return Promise.resolve().then(kjør).then(ok, feil); },
      };
      function kjør() {
        db.kall++;
        if (db.offline) return { data: null, error: { message: 'TypeError: Failed to fetch' } };
        if (db.nekt && db.nekt(tabell, op)) return { data: null, error: { message: 'new row violates row-level security policy', code: '42501' } };
        const T = db.t[tabell]; const passer = (r) => filtre.every((f) => f(r));
        if (op === 'select') return { data: JSON.parse(JSON.stringify(T.filter(passer))), error: null };
        if (op === 'delete') { const ut = T.filter(passer); db.t[tabell] = T.filter((r) => !passer(r)); if (tabell === 'matches') ut.forEach((m) => { db.t.events = db.t.events.filter((e) => e.match_id !== m.id); db.t.match_sets = db.t.match_sets.filter((s) => s.match_id !== m.id); }); ut.forEach((r) => db.varsle(tabell, r)); return { data: retur ? ut : null, error: null }; }
        if (op === 'update') {
          const ut = [];
          T.filter(passer).forEach((r) => { Object.assign(r, JSON.parse(JSON.stringify(patch))); if (tabell === 'matches') r.version = (r.version || 1) + 1; ut.push(r); db.varsle(tabell, r); });
          return { data: retur ? JSON.parse(JSON.stringify(ut)) : null, error: null };
        }
        const k = (opt.onConflict ? opt.onConflict.split(',') : nøkler[tabell]);
        const ut = [];
        for (const r0 of rader) {
          const r = JSON.parse(JSON.stringify(r0));
          if (tabell === 'events' && r.type === 'undo' && T.some((e) => e.undoes === r.undoes && e.id !== r.id))
            return { data: null, error: { message: 'duplicate key value violates unique constraint "events_undo_once"', code: '23505' } };
          const fins = T.find((x) => k.every((f) => String(x[f]) === String(r[f])));
          if (fins) {
            if (op === 'insert') return { data: null, error: { message: 'duplicate key value violates unique constraint', code: '23505' } };
            if (!opt.ignoreDuplicates) { Object.assign(fins, r); db.varsle(tabell, fins); }
            ut.push(fins); continue;
          }
          if (!r.id && tabell !== 'match_sets' && tabell !== 'opponent_players' && tabell !== 'scouting_notes' && tabell !== 'logos') r.id = uid();
          if (tabell === 'matches') Object.assign(r, Object.assign({ version: 1, status: 'kommende', current_set: 1, current_home: 0, current_away: 0, sets_home: 0, sets_away: 0, publish: true, is_test: false }, r));
          if (tabell === 'events') r.received_at = new Date().toISOString();
          T.push(r); ut.push(r); db.varsle(tabell, r);
        }
        return { data: retur ? JSON.parse(JSON.stringify(ut)) : null, error: null };
      }
      return b;
    }
    return {
      db,
      schema() { return { from }; },
      from,
      channel() {
        const ls = [];
        const k = {
          on(_type, f, cb) { ls.push({ table: f.table, filter: f.filter, cb }); return k; },
          subscribe(cb) { k._av = ls.map((l) => db.lytt(l)); setTimeout(() => cb && cb('SUBSCRIBED'), 0); return k; },
        };
        return k;
      },
      removeChannel(k) { (k._av || []).forEach((f) => f()); },
      auth: { getUser: async () => ({ data: { user: { id: '00000000-0000-0000-0000-0000000000c1', email: 'demo@test.invalid' } } }) },
    };
  }

  // Syntetiske demodata (oppdiktede navn): to kontekster, tropp, motstander og én kamp
  const DEMO = {
    contexts: [
      { id: '20000000-0000-0000-0000-000000000001', slug: 'main', name: 'Randaberg · demo', our_team: 'Randaberg', teams: ['Motlag'], is_public: true },
      { id: '20000000-0000-0000-0000-000000000002', slug: 'u20-demo', name: 'U20 demo', our_team: 'Demoland', teams: ['Naboland'], is_public: true },
    ],
    squad_players: [
      { id: '30000000-0000-0000-0000-000000000001', context_id: '20000000-0000-0000-0000-000000000001', legacy_id: 'd-01', jersey: '1', name: 'Spiller En', position: 'Kant' },
      { id: '30000000-0000-0000-0000-000000000002', context_id: '20000000-0000-0000-0000-000000000001', legacy_id: 'd-02', jersey: '2', name: 'Spiller To', position: 'Midt' },
      { id: '30000000-0000-0000-0000-000000000003', context_id: '20000000-0000-0000-0000-000000000001', legacy_id: 'd-03', jersey: '3', name: 'Spiller Tre', position: 'Libero' },
      { id: '30000000-0000-0000-0000-000000000004', context_id: '20000000-0000-0000-0000-000000000001', legacy_id: 'd-04', jersey: '4', name: 'Spiller Fire', position: 'Opplegger' },
    ],
    opponents: [{ id: '40000000-0000-0000-0000-000000000001', context_id: '20000000-0000-0000-0000-000000000001', slug: 'motlag', name: 'Motlag' }],
    opponent_players: [{ opponent_id: '40000000-0000-0000-0000-000000000001', jersey: '9', name: 'Motspiller Ni' }, { opponent_id: '40000000-0000-0000-0000-000000000001', jersey: '11', name: 'Motspiller Elleve' }],
    matches: [{ id: '50000000-0000-0000-0000-000000000001', context_id: '20000000-0000-0000-0000-000000000001', legacy_id: 'demo-1', home: 'Randaberg', away: 'Motlag',
      starts_at: '2026-10-30T17:00:00Z', status: 'kommende', source: 'egen', version: 1, current_set: 1, current_home: 0, current_away: 0, sets_home: 0, sets_away: 0,
      publish: true, is_test: false, legacy: { round: '1', receivers: ['d-01', 'd-02', 'd-03'], onCourt: ['d-01', 'd-02', 'd-03', 'd-04'], oppNumbers: ['9', '11'] } }],
  };

  const eksport = { FakeDb, FakeClient, DEMO };
  if (typeof module !== 'undefined' && module.exports) module.exports = eksport; else root.StatsV2Fake = eksport;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* V2: Supabase-lagring med innlogging. Standard i appen er fortsatt Claude-lagringen; denne siden er et eget valg. */
(function () {
  const q = new URLSearchParams(location.search), demo = q.has('demo');
  const cfg = window.V2_CONFIG || {};
  // Én side per lag/sesong: config.main gir navn, vårt lag og klasse (kvinner/menn) for laget siden gjelder.
  // config.locked skjuler lagvelgeren. Brukeren på siden har bare tilgang til denne konteksten i databasen.
  if (cfg.main) window.PUBLIC_CTX = Object.assign({ id: 'main', prefix: '', teams: [] }, cfg.main);
  if (cfg.locked) { const st = document.createElement('style'); st.textContent = '.ctx-pick{display:none!important}'; document.head.appendChild(st); }
  let klar; const ferdig = new Promise((r) => { klar = r; });
  let deviceId = null; try { deviceId = localStorage.getItem('rv-device'); } catch (e) {}
  if (!deviceId) { deviceId = 'd' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('rv-device', deviceId); } catch (e) {} }

  function statuslinje(store) {
    const el = document.createElement('div'); el.id = 'v2-status'; el.setAttribute('role', 'status'); document.body.appendChild(el);
    if (demo) { const d = document.createElement('div'); d.id = 'v2-demo'; d.textContent = 'DEMO – lagres ikke, vises ikke på live-siden'; document.body.appendChild(d); }
    if (!demo && cfg.autoLogin) { const d = document.createElement('div'); d.id = 'v2-demo'; d.style.background = '#1d4ed8'; d.textContent = cfg.badge || 'ÅPEN BETA – testdata'; document.body.appendChild(d); }
    if (!demo && !cfg.autoLogin) { const ut = document.createElement('a'); ut.href = '?loggut'; ut.textContent = 'Logg ut'; ut.id = 'v2-loggut'; document.body.appendChild(ut); }
    let skjul = null;
    store.påStatus((s) => {
      clearTimeout(skjul);
      if (s.feil.length) { el.className = 'feil'; el.textContent = 'Ikke lagret: ' + s.feil[s.feil.length - 1].melding; el.style.display = 'block'; return; }
      if (s.ventende) { el.className = ''; el.textContent = s.ventende + ' registrering' + (s.ventende > 1 ? 'er' : '') + ' venter på nett …'; el.style.display = 'block'; return; }
      el.className = 'ok'; el.textContent = 'Alt lagret'; el.style.display = 'block'; skjul = setTimeout(() => { el.style.display = 'none'; }, 1500);
    });
  }
  async function start(client, user, skrive) {
    const store = await StatsV2.SupabaseStore({ client, deviceId, userId: user.id, mainSlug: demo ? 'main' : (cfg.mainSlug || 'main'), pollMs: demo ? 0 : 4000, ko: StatsV2.Ko(StatsV2.lagLagring('rv-v2-ko' + (cfg.queue ? '-' + cfg.queue : ''))) }).start();
    window.addEventListener('online', () => store.tøm());
    window.__v2 = { store, client };
    const vis = () => statuslinje(store);
    if (document.body) vis(); else document.addEventListener('DOMContentLoaded', vis);
    klar({ store, user, skrive });
  }
  // Etter innlogging: uten medlemskap i noe lag vises en tydelig melding (ikke en feil fra appen)
  async function videre(client, user) {
    let roller = [];
    try { const r = await client.schema('stats').from('context_members').select('role').eq('user_id', user.id); roller = (r.data || []).map((x) => x.role); } catch (e) { roller = []; }
    if (!roller.length) {
      const vis = () => { document.body.innerHTML = '<div id="v2-login"><form><h2 style="margin:0">Ingen tilgang ennå</h2><div style="color:#666">Du er logget inn som ' + (user.email || 'ukjent') + ', men brukeren er ikke lagt til i noe lag. Be treneren/eieren legge deg til, eller logg inn med en annen bruker.</div><button type="button" id="v2-ut">Logg ut</button></form></div>';
        document.getElementById('v2-ut').onclick = async () => { await client.auth.signOut(); location.reload(); }; };
      if (document.body) vis(); else document.addEventListener('DOMContentLoaded', vis);
      return;
    }
    start(client, user, roller.some((r) => r !== 'viewer'));
  }
  function innlogging(client) {
    const v = document.createElement('div'); v.id = 'v2-login';
    v.innerHTML = '<form><h2 style="margin:0">Kampstatistikk</h2><div style="color:#666;font-size:14px">Logg inn for å føre statistikk</div>'
      + '<input type="email" name="e" autocomplete="username" placeholder="E-post" required aria-label="E-post">'
      + '<input type="password" name="p" autocomplete="current-password" placeholder="Passord" aria-label="Passord">'
      + '<button type="submit">Logg inn</button><div class="feil"></div></form>';
    const vis = () => document.body.appendChild(v); if (document.body) vis(); else document.addEventListener('DOMContentLoaded', vis);
    const f = v.querySelector('form'), feil = v.querySelector('.feil');
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault(); feil.textContent = '';
      const { data, error } = await client.auth.signInWithPassword({ email: f.e.value, password: f.p.value });
      if (error) { feil.textContent = 'Innlogging feilet: ' + error.message; return; }
      v.remove(); videre(client, data.user);
    });
  }
  if (demo) {
    const db = StatsV2Fake.FakeDb(StatsV2Fake.DEMO); window.__v2fake = db;
    start(StatsV2Fake.FakeClient(db), { id: '00000000-0000-0000-0000-0000000000c1' }, true);
  } else if (!cfg.url || !cfg.publishableKey || !window.supabase) {
    document.addEventListener('DOMContentLoaded', () => { document.body.innerHTML = '<div style="padding:24px;font:16px system-ui">Mangler <code>config.js</code> med Supabase-adresse og publishable key (se v2/config.example.js). Åpne med <code>?demo=1</code> for å prøve med testdata.</div>'; });
  } else {
    // Bare publishable key i nettleseren. Aldri secret/service_role.
    const client = window.supabase.createClient(cfg.url, cfg.publishableKey, cfg.queue ? { auth: { storageKey: 'sb-rv-' + cfg.queue } } : undefined);
    client.auth.getSession().then(async ({ data }) => {
      // Åpen beta (valgfritt): config.autoLogin = {email, password} logger inn en felles beta-bruker automatisk.
      // Brukeren har bare tilgang til beta-konteksten. Fjern autoLogin fra config.js for vanlig innlogging.
      const auto = cfg.autoLogin;
      if (auto && auto.email) {
        if (data && data.session && data.session.user.email === auto.email) return videre(client, data.session.user);
        if (data && data.session) await client.auth.signOut();
        const r = await client.auth.signInWithPassword({ email: auto.email, password: auto.password });
        if (r.error) { innlogging(client); return; }
        return videre(client, r.data.user);
      }
      if (q.has('loggut') && data && data.session) { await client.auth.signOut(); location.replace(location.pathname); return; }
      if (data && data.session) videre(client, data.session.user); else innlogging(client);
    });
  }
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
  };
  const brukerApi = (u, skrive) => ({ can: async () => !!skrive, isOwner: async () => false, canEdit: async () => false, id: async () => u.id });
  window.claude = { use: async (n) => { const { store, user, skrive } = await ferdig;
    return n === 'db' ? store : n === 'downloads' ? downloads : n === 'user' ? brukerApi(user, skrive) : null; } };
})();
</script>
<script>
(() => {
  // Sesong eller lag: hver kontekst har egne kamper, egen tropp og egne motstandere.
  // Hovedkonteksten ligger i roten av databasen; de andre under ctx/<id>/.
  // Den åpne lesesiden kan bygges for en annen sesong eller et annet lag (window.PUBLIC_CTX)
  const MAIN_CTX = window.PUBLIC_CTX || { id: 'main', name: 'Randaberg · Mizunoligaen kvinner 26/27', our: 'Randaberg', prefix: '',
    teams: ['Finstad Sportsklubb', 'Førde Volleyballklubb', 'Koll IL', 'ØKSIL', 'OSI', 'Oslo Volley', 'TIF Viking', 'ToppVolley Norge'] };
  let CTX = MAIN_CTX, PFX = '', OUR = 'Randaberg';
  // Hver sesong/lag har sin aksentfarge: Randaberg blå, landslaget rødt. Motstander er alltid oransje
  const THEMES = {

    red: { a: '#B0162E', soft: '#F6D5DA', ink: '#7E0F21', bar: '#C8243C', hero: '#B0162E', aD: '#F0899A', softD: '#3E1B22', inkD: '#F6D5DA', heroD: '#8E1226' }
  };
  function ctxTheme(c) { return THEMES[c && c.theme] || (c && (c.our === 'Norge' || /^u\d/.test(c.id || '')) ? THEMES.red : THEMES.blue); }
  function applyTheme() {

    const light = '--accent:' + t.a + ';--accent-soft:' + t.soft + ';--accent-ink:' + t.ink + ';--accent-bar:' + t.bar + ';--hero:' + t.hero + ';';
    const dark = '--accent:' + t.aD + ';--accent-soft:' + t.softD + ';--accent-ink:' + t.inkD + ';--accent-bar:' + t.bar + ';--hero:' + t.heroD + ';';
    el.textContent = 'html:root{' + light + '}@media (prefers-color-scheme: dark){html:root:not([data-theme="light"]){' + dark + '}}html:root[data-theme="dark"]{' + dark + '}';
  }
  applyTheme();

  // Lagmerker. Opplastede logoer (config/logos) går foran; ellers skjold med forbokstaver og fast farge, og flagg for landslag
  const CREST = { 'Randaberg': ['RB', null], 'Finstad Sportsklubb': ['FI', '#2F6B3A'], 'Førde Volleyballklubb': ['FØ', '#B5651D'], 'Koll IL': ['KO', '#7A1A14'], 'ØKSIL': ['ØK', '#44505F'],
    'OSI': ['OSI', '#6B2C91'], 'Oslo Volley': ['OV', '#0E7C86'], 'TIF Viking': ['TV', '#8C6D1F'], 'ToppVolley Norge': ['TN', '#1F2A44'] };
  const CREST_PAL = ['#2F6B3A', '#B5651D', '#7A1A14', '#44505F', '#6B2C91', '#0E7C86', '#8C6D1F', '#1F2A44', '#5B3A29', '#3D5A80'];
  // Flagg i en 30×20-ramme: [bakgrunn, [farge, x, bredde, y, høyde] for korset, eventuelt indre kors]
  const FLAGS = {
    Norge: ['#BA0C2F', ['#FFFFFF', 8.2, 5.5, 7.5, 5], ['#00205B', 9.5, 2.75, 8.75, 2.5]],
    Sverige: ['#006AA7', ['#FECC00', 9.4, 3.75, 8, 4]],
    Danmark: ['#C8102E', ['#FFFFFF', 9.7, 3.2, 8.6, 2.9]],
    Finland: ['#FFFFFF', ['#002F6C', 8.3, 5, 7.3, 5.5]],
    England: ['#FFFFFF', ['#CE1124', 13.5, 3, 8, 4]],
    Island: ['#02529C', ['#FFFFFF', 7.9, 5, 7.5, 5], ['#DC1E35', 9.1, 2.5, 8.75, 2.5]],
    'Færøyene': ['#FFFFFF', ['#0065BD', 7.9, 5, 7.5, 5], ['#EF303E', 9.1, 2.5, 8.75, 2.5]]
  };
  function flagHtml(f, size) {
    const bars = (c) => '<i style="background:' + c[0] + ';left:' + (c[1] / 30 * 100) + '%;width:' + (c[2] / 30 * 100) + '%;top:0;bottom:0"></i><i style="background:' + c[0] + ';top:' + (c[3] / 20 * 100) + '%;height:' + (c[4] / 20 * 100) + '%;left:0;right:0"></i>';
    return '<span class="flag ' + size + '" style="background:' + f[0] + '" aria-hidden="true">' + bars(f[1]) + (f[2] ? bars(f[2]) : '') + '</span>';
  }
  function initials(t) {
    const w = String(t).replace(/ (IL|Sportsklubb|Volleyballklubb|Volleyball|VBK|Volley Norge)$/, '').split(/[\s-]+/).filter(Boolean);
    return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?').slice(0, 2)).toUpperCase();
  }
  function crest(team, size) {
    size = size || 'sm'; team = String(team || '');
    const logo = (S.logos || {})[team];
    if (logo) return '<span class="crest img ' + size + '" aria-hidden="true"><img src="' + esc(logo) + '" alt=""></span>';
    if (FLAGS[team]) return flagHtml(FLAGS[team], size);
    if (isSlot(team)) return '<span class="crest sh slot ' + size + '" aria-hidden="true">' + esc(parseInt(team, 10)) + '</span>';
    const c = CREST[team]; let h = 0; for (const ch of team) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const col = team === OUR ? 'var(--hero)' : (c && c[1]) || CREST_PAL[h % CREST_PAL.length];
    return '<span class="crest sh ' + size + '" style="background:' + col + '" aria-hidden="true">' + esc(c ? c[0] : initials(team)) + '</span>';
  }
  const teamTag = (t, size, label) => '<span class="tm">' + crest(t, size) + '<span class="nmx">' + esc(label == null ? t : label) + '</span></span>';
  // Utfall sett fra vårt lag
  function outcome(m) {
    if (m.status !== 'ferdig' || !((m.setsHome || 0) + (m.setsAway || 0))) return null;
    const us = usName(m); if (m.home !== us && m.away !== us) return null;
    const our = m.home === us ? m.setsHome : m.setsAway, their = m.home === us ? m.setsAway : m.setsHome;
    return our > their ? 'win' : 'loss';
  }
  const POS = ['Opplegger', 'Diagonal', 'Kant', 'Midt', 'Libero'];
  const app = document.getElementById('app');

  const S = {
    db: null, dl: null, ready: false, offline: false,
    roster: [], matches: [], logs: {}, logUnsub: null, opps: {}, contexts: [MAIN_CTX], ctxReady: false, showNewCtx: false,
    view: 'list', matchId: null, filter: 'alle', statSet: 'all',
    showNew: false, flash: null, error: '',
    // Dashboard: lesetilgang uten registrering (den åpne siden, eller personer med «Kan se»-tilgang)
    dash: !!window.PUBLIC, user: null, myId: null, canAdmin: false, grants: null, noAccess: false, names: {}, accHits: [], accPick: null
  };

  let deviceId = null;
  try { deviceId = localStorage.getItem('rv-device'); } catch (e) {}
  if (!deviceId) { deviceId = 'd' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('rv-device', deviceId); } catch (e) {} }
  try { const v = localStorage.getItem('rv-view'); if (v) { const o = JSON.parse(v); S.filter = o.filter === 'vare' ? 'vare' : 'alle'; } } catch (e) {}

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (a, b) => b ? Math.round((a / b) * 100) + ' %' : '–';
  const pct1 = (a, b) => b ? (Math.round((a / b) * 1000) / 10).toString().replace('.', ',') + ' %' : '–';
  const dec = (x) => (Math.round(x * 100) / 100).toFixed(2).replace('.', ',');
  // Snitt (0–2) med søyle: under 1,00 rød, 1,00–1,20 gul, over 1,20 grønn
  const avgNum = (v) => typeof v === 'number' ? v : parseFloat(String(v ?? '').replace('−', '-').replace(',', '.'));
  // Fargegrenser per kjønn: [rød under, grønn over]. Kvinner har lavere angrepseffektivitet enn menn (ca. 0,07–0,10),
  // og litt bedre mottak. Midtspillere har høyere angrepssnitt enn andre. Se «Fargeforklaring» i menyen
  const THRESH = {
    kvinner: { att: [1.10, 1.25], attMidt: [1.15, 1.35], rec: [1.20, 1.40], srv: [0.95, 1.10] },
    menn: { att: [1.15, 1.30], attMidt: [1.25, 1.45], rec: [1.15, 1.35], srv: [0.90, 1.05] }
  };
  const ctxGender = () => CTX.gender === 'menn' || (!CTX.gender && /herre|menn|\bH\d/i.test((CTX.name || '') + ' ' + (CTX.our || ''))) ? 'menn' : 'kvinner';
  const thr = (kind, pos) => { const T = THRESH[ctxGender()]; return kind === 'att' ? (pos === 'Midt' ? T.attMidt : T.att) : kind === 'srv' ? T.srv : T.rec; };
  // Lav og høy: lavest og høyest snitt blant spillere med nok forsøk (mottak og angrep minst 5, serve minst 3). Krever minst to spillere
  const extremes = (obj, f, minN) => { const el = Object.entries(obj).filter(([, r]) => r.n >= minN).sort((a, b) => f(a[1]) - f(b[1]) || b[1].n - a[1].n); return el.length > 1 && f(el[0][1]) !== f(el[el.length - 1][1]) ? { lo: el[0][0], hi: el[el.length - 1][0] } : {}; };
  const loHi = (id, ex) => id === ex.lo ? [' class="weakest"', ' <span class="weak-tag">Lav</span>'] : id === ex.hi ? [' class="strongest"', ' <span class="weak-tag strong">Høy</span>'] : ['', ''];
  // Svakest: lavest snitt blant spillere med nok forsøk (mottak og angrep minst 5, serve minst 3)
  const srvAvg = (r) => 1 + (r.E - r.F) / r.n;
  const weakestOf = (obj, f, minN) => (Object.entries(obj).filter(([, r]) => r.n >= minN).sort((a, b) => f(a[1]) - f(b[1]) || b[1].n - a[1].n)[0] || [])[0];
  const attAvg = (r) => 1 + (r.c2 - r.c0 - r.B) / r.n;
  const avgLvl = (n, kind, pos) => { n = Math.round(n * 100) / 100; const [lo, hi] = thr(kind, pos); return n < lo ? 'lo' : n <= hi ? 'mid' : 'hi'; };
  const posOf = (id) => (player(id) || {}).pos || '';
  const posByNr = (nr) => ((S.roster || []).find((x) => !x.archived && String(x.nr) === String(nr)) || {}).pos || '';
  function avgBarOnly(v, cls, kind, pos) {
    const n = avgNum(v); if (v == null || !isFinite(n)) return '';
    return '<span class="avgbar ' + avgLvl(n, kind, pos) + (cls ? ' ' + cls : '') + '" aria-hidden="true"><i style="width:' + Math.max(3, Math.min(100, n / 2 * 100)) + '%"></i></span>';
  }
  function avgBar(v, txt, kind, pos) {
    const n = avgNum(v); if (v == null || !isFinite(n)) return txt != null ? txt : '–';
    return '<span class="avg">' + (txt != null ? txt : dec(n)) + avgBarOnly(n, '', kind, pos) + '</span>';
  }
  const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleDateString('nb-NO', { weekday: 'short', day: 'numeric', month: 'short' }) + (iso.length > 10 ? ' · ' + d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' }) : ''); };
  const isOurs = (m) => m.home === OUR || m.away === OUR;
  const cur = () => S.matches.find((m) => m.id === S.matchId);
  // Spillere på et annet lag (når vi fører statistikk for andres kamper) har id «o:<lag>:<nr>»
  const player = (id) => {
    if (typeof id === 'string' && id.startsWith('o:')) {
      const [, slug, nr] = id.split(':'); const p = ((S.opps[slug] || {}).players || []).find((x) => String(x.nr) === nr) || {};
      return { id, nr, name: NAMEHINT[id] || p.name || '#' + nr, pos: p.pos || '' };
    }
    return S.roster.find((p) => p.id === id);
  };
  const EXTRA = { midt: 'Midtspillere' };
  // Navn slik de var da registreringen ble gjort (følger spilleren selv om tropp eller nummer endres senere)
  const NAMEHINT = {}, OPPHINT = {};
  const learnNames = (evs, opp) => evs.forEach((e) => { if (!e.n) return; if (e.type === 'opp' || e.type === 'dir') { if (opp) opp[String(e.p)] = e.n; } else NAMEHINT[e.p] = e.n; });
  const pname = (id) => { const p = player(id); return p ? p.name.split(' ')[0] : NAMEHINT[id] ? NAMEHINT[id].split(' ')[0] : (EXTRA[id] || '?'); };
  // Kamptyper: serie fra terminlisten, eller egne kamper (cup, europacup, trening)
  const TYPES = { serie: 'Seriekamp', cup: 'Cupkamp', europacup: 'Europacup', turnering: 'Turnering', trening: 'Treningskamp' };
  const TSHORT = { serie: 'Serie', cup: 'Cup', europacup: 'EC', turnering: 'T', trening: 'Tr' };
  const roundLabel = (m) => m.custom ? (m.type === 'turnering' && m.round ? m.round : (TYPES[m.type] || 'Egen kamp') + (m.round ? ' · ' + m.round : '')) : (m.round ? 'Runde ' + m.round : 'Uten runde');
  const roundShort = (m) => m.custom ? (m.short || TSHORT[m.type] || 'Egen') : 'R' + (m.round || '?');
  // Motstanderens tropp lagres per lag og huskes til neste kamp mot samme lag
  const teamSlug = (s) => String(s || '').toLowerCase().replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/å/g, 'a').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'lag';
  const usName = (m) => (m && m.focus) || OUR;
  const canLive = (m) => isOurs(m) || !!(m && m.focus);
  const oppTeam = (m) => m.home === usName(m) ? m.away : m.home;
  const rosterOf = (team) => ((S.opps[teamSlug(team)] || {}).players || []);
  const oppRoster = (m) => rosterOf(oppTeam(m));
  const teamRoster = (m) => m && m.focus ? rosterOf(m.focus).map((p) => ({ id: 'o:' + teamSlug(m.focus) + ':' + p.nr, nr: String(p.nr), name: p.name || '#' + p.nr, pos: p.pos || '' })) : S.roster;
  const isSlot = (t) => /^\d\. plass$/.test(String(t || ''));
  const oppP = (m, nr) => oppRoster(m).find((p) => String(p.nr) === String(nr));
  const oppName = (m, nr) => OPPHINT[String(nr)] || ((m && oppP(m, nr)) || {}).name || '';
  const oppLabel = (m, nr) => { const n = oppName(m, nr); return '#' + nr + (n ? ' ' + n.split(' ')[0] : ''); };

  // ---------- Data ----------
  // Appen er flyttet til den nye løsningen (Supabase, beta) 25.10.2026. Denne versjonen er bare til lesing.
  // Gjelder bare Claude-artefakten: ikke de åpne sidene (PUBLIC) og ikke V2-bygget (V2_CONFIG).
  const MOVED_URL = 'https://madsfossmark-ai.github.io/Statistikk-V2-beta/';
  const FROZEN = !window.PUBLIC && !window.V2_CONFIG;
  function frozenDb(db) {
    const nope = async () => { S.error = 'Appen er flyttet til den nye løsningen (beta). Her kan du bare se, ikke endre. Før statistikk på ' + MOVED_URL; render(); throw Object.assign(new Error('flyttet'), { code: 'flyttet' }); };
    return {
      doc: (path) => { const d = db.doc(path); return { onSnapshot: (...a) => d.onSnapshot(...a), get: (...a) => d.get(...a), set: nope, update: nope, delete: nope }; },
      collection: (path) => { const c = db.collection(path); return { onSnapshot: (...a) => c.onSnapshot(...a), get: (...a) => c.get(...a), add: nope }; },
    };
  }
  function movedBanner() {
    if (!FROZEN || document.getElementById('moved-banner')) return;
    const d = document.createElement('div'); d.id = 'moved-banner'; d.setAttribute('role', 'status');
    d.innerHTML = '<b>Flyttet:</b> statistikken føres nå i den nye løsningen (beta). Denne versjonen er bare til lesing. <a href="' + MOVED_URL + '" target="_blank" rel="noopener">Åpne den nye appen ›</a>';
    document.body.prepend(d);
  }
  async function boot() {
    try { S.db = await window.claude?.use?.('db'); } catch (e) { S.db = null; }
    if (FROZEN && S.db) { S.db = frozenDb(S.db); movedBanner(); }
    try { S.dl = await window.claude?.use?.('downloads'); } catch (e) { S.dl = null; }
    if (!window.PUBLIC) {
      try { S.user = await window.claude?.use?.('user'); } catch (e) { S.user = null; }
      if (S.user) {
        const [w, owner, adm, id] = await Promise.all([S.user.can('data.write'), S.user.isOwner(), S.user.canEdit(), S.user.id()]);
        S.dash = w === false && !owner; S.canAdmin = !!(owner || adm); S.myId = id;
      }
    }
    document.documentElement.classList.toggle('dash', S.dash);
    if (!S.db) { S.offline = true; S.ready = true; render(); return; }
    let saved = null; try { saved = localStorage.getItem('rv-ctx'); } catch (e) {}
    if (!window.PUBLIC) S.db.doc('config/access').onSnapshot((snap) => {
      S.grants = snap.exists ? (snap.data().grants || {}) : {}; if (S.dash) resolveDashCtx(); else render();
    }, () => { S.grants = {}; if (S.dash) resolveDashCtx(); });
    S.db.doc('config/contexts').onSnapshot((snap) => {
      const list = snap.exists ? (snap.data().list || []) : [];
      S.contexts = [MAIN_CTX].concat(list.filter((c) => c && c.id && c.id !== 'main'));
      if (S.dash && !window.PUBLIC) { S.ctxLoaded = true; resolveDashCtx(); return; }
      if (!S.ctxReady) { S.ctxReady = true; applyCtx(saved || 'main'); }
      else if (!S.contexts.some((c) => c.id === CTX.id)) applyCtx('main');
      else { CTX = S.contexts.find((c) => c.id === CTX.id); render(); }
    }, () => { if (!S.ctxReady) { S.ctxReady = true; applyCtx('main'); } });
  }

  // En som bare kan se, får laget som er knyttet til dem under «Tilgang»
  function resolveDashCtx() {
    if (!S.ctxLoaded || S.grants == null) return;
    const id = S.myId && S.grants[S.myId];
    if (!id || !S.contexts.some((c) => c.id === id)) {
      ctxUnsubs.forEach((u) => { try { u(); } catch (e) {} }); ctxUnsubs = [];
      S.noAccess = true; S.ready = true; S.ctxReady = true; render(); return;
    }
    S.noAccess = false;
    if (!S.ctxReady || CTX.id !== id) { S.ctxReady = true; applyCtx(id); } else render();
  }

  let ctxUnsubs = [];
  function applyCtx(id) {
    CTX = S.contexts.find((c) => c.id === id) || MAIN_CTX;
    PFX = CTX.prefix || ''; OUR = CTX.our || 'Randaberg';
    try { localStorage.setItem('rv-ctx', CTX.id); } catch (e) {}
    ctxUnsubs.forEach((u) => { try { u(); } catch (e) {} }); ctxUnsubs = [];
    closeSeasonLogs(); openLogs(null);
    applyTheme(); S.logos = {};
    S.roster = []; S.matches = []; S.opps = {}; S.ready = false; S.view = 'list'; S.matchId = null; S.showNew = false; S.showNewCtx = false; S.showShare = false;
    SEASON.player = 'team';
    render(); toTop();
    subscribeCtx();
  }
  function subscribeCtx() {
    const keep = (u) => { if (typeof u === 'function') ctxUnsubs.push(u); };
    keep(S.db.doc(PFX + 'config/roster').onSnapshot((snap) => {
      S.roster = snap.exists ? (snap.data().players || []).map((p) => ({ ...p })) : [];
      S.ready = true; render();
    }, (e) => { S.error = 'Kunne ikke laste troppen (' + e.code + ').'; render(); }));
    keep(S.db.doc(PFX + 'config/logos').onSnapshot((snap) => { S.logos = snap.exists ? (snap.data().logos || {}) : {}; render(); }, () => {}));
    // Trenerens vurderinger til serveplanen: eget dokument, holdes utenfor all statistikk
    S.scoutNotes = {}; Object.values(SCOUT.unsubs).forEach((u) => { try { u(); } catch (e) {} }); SCOUT.unsubs = {}; SCOUT.logs = {}; SCOUT.memo = null;
    if (!window.PUBLIC) keep(S.db.doc(PFX + 'scouting/notater').onSnapshot((snap) => { S.scoutNotes = snap.exists ? JSON.parse(JSON.stringify(snap.data().lag || {})) : {}; render(); }, () => {}));
    keep(S.db.collection(PFX + 'opponents').onSnapshot((snap) => {
      const o = {}; snap.docs.forEach((d) => { o[d.id] = JSON.parse(JSON.stringify(d.data())); }); S.opps = o; render();
    }, () => {}));
    keep(S.db.collection(PFX + 'matches').onSnapshot((snap) => {
      S.matches = snap.docs.map((d) => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) }));
      S.matches.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      S.ready = true; if (S.view === 'season') openSeasonLogs(); render();
    }, (e) => { S.error = 'Kunne ikke laste kamper (' + e.code + ').'; render(); }));
  }

  function ctxPicker() {
    if (window.PUBLIC || S.offline || S.dash) return '<span class="label">' + esc(CTX.name) + '</span>';
    return '<label class="ctx-pick" for="ctx-pick"><span class="sr">Sesong eller lag</span><select id="ctx-pick" data-a="ctx">'
      + S.contexts.map((c) => '<option value="' + esc(c.id) + '"' + (c.id === CTX.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('')
      + '<option value="__new">+ Ny sesong eller lag …</option></select></label>';
  }
  function newCtxForm() {
    return '<form class="panel" id="ctxform" aria-label="Ny sesong eller lag"><div class="panel-head"><h2>Ny sesong eller lag</h2><span class="status">Får egne kamper, egen tropp og egen sesongstatistikk. Det du har nå, ligger urørt og kan velges i menyen.</span></div><div class="form">'
      + '<div class="field"><label for="ctx-name">Navn</label><input id="ctx-name" type="text" required placeholder="F.eks. Randaberg · Mizunoligaen kvinner 27/28"></div>'
      + '<div class="field"><label for="ctx-our">Vårt lag heter</label><input id="ctx-our" type="text" required value="' + esc(OUR) + '"></div>'
      + '<div class="field"><label for="ctx-gender">Klasse</label><select id="ctx-gender"><option value="kvinner"' + (ctxGender() === 'kvinner' ? ' selected' : '') + '>Kvinner</option><option value="menn"' + (ctxGender() === 'menn' ? ' selected' : '') + '>Menn</option></select></div>'
      + '<label class="chk" for="ctx-copy"><input id="ctx-copy" type="checkbox"> Ta med spillertroppen fra «' + esc(CTX.name) + '»</label>'
      + '<div style="display:flex;gap:8px"><button class="primary" type="submit">Opprett</button><button class="secondary" type="button" data-a="ctx-cancel">Avbryt</button></div></div></form>';
  }

  function openLogs(id) {
    if (S.logUnsub) { S.logUnsub(); S.logUnsub = null; }
    S.logs = {};
    if (!S.db || !id) return;
    S.logUnsub = S.db.collection(PFX + 'matches/' + id + '/log').onSnapshot((snap) => {
      const logs = {};
      snap.docs.forEach((d) => { logs[d.id] = (d.data().events || []).slice(); });
      Object.keys(OPPHINT).forEach((k) => delete OPPHINT[k]); Object.values(logs).forEach((evs) => learnNames(evs, OPPHINT));
      S.logs = logs; render();
    }, (e) => { S.error = 'Registreringene kunne ikke lastes (' + e.code + ').'; render(); });
  }

  function allEvents() { const out = []; Object.values(S.logs).forEach((a) => out.push(...a)); out.sort((a, b) => a.t - b.t); return out; }

  async function saveMatch(id, patch) {
    if (!S.db) return;
    try { await S.db.doc(PFX + 'matches/' + id).update(patch); }
    catch (e) { S.error = 'Lagring feilet (' + e.code + '). Prøv igjen.'; render(); }
  }
  async function saveRoster(players) {
    S.roster = players; render();
    if (!S.db) return;
    try { await S.db.doc(PFX + 'config/roster').set({ players }); }
    catch (e) { S.error = 'Troppen ble ikke lagret (' + e.code + ').'; render(); }
  }

  async function logEvent(type, who, code, extra) {
    const m = cur(); if (!m || !S.db) return;
    const set = (m.current && m.current.set) || 1;
    const key = deviceId + '-s' + set;
    const own = (S.logs[key] || []).slice();
    const ev = Object.assign({ t: Date.now(), set, type, p: who, c: code }, extra || {});
    const nm = type === 'opp' || type === 'dir' ? ((oppP(m, who) || {}).name || '') : (((type === 'rec' || type === 'att' || type === 'srv') && player(who)) || {}).name;
    if (nm && !String(nm).startsWith('#')) ev.n = nm;
    own.push(ev);
    S.logs[key] = own;
    render();
    try { await S.db.doc(PFX + 'matches/' + m.id + '/log/' + key).set({ device: deviceId, set, events: own }); }
    catch (e) { S.error = 'Registreringen ble ikke lagret (' + e.code + ').'; render(); }
    if (m.status !== 'pågår' && m.status !== 'ferdig') saveMatch(m.id, { status: 'pågår' });
  }

  async function undo() {
    const m = cur(); if (!m || !S.db) return;
    let bestKey = null, bestT = -1;
    Object.entries(S.logs).forEach(([k, evs]) => { if (k.startsWith(deviceId + '-') && evs.length && evs[evs.length - 1].t > bestT) { bestT = evs[evs.length - 1].t; bestKey = k; } });
    if (!bestKey) return;
    const own = S.logs[bestKey].slice(0, -1);
    S.logs[bestKey] = own; render();
    try { await S.db.doc(PFX + 'matches/' + m.id + '/log/' + bestKey).set({ device: deviceId, set: Number(bestKey.split('-s')[1]), events: own }); }
    catch (e) { S.error = 'Angre ble ikke lagret (' + e.code + ').'; render(); }
  }

  // ---------- Statistikk ----------
  function computeStats(events) {
    const rec = {}, att = {}, srv = {}, opp = {};
    const bump = (o, k) => (o[k] ||= { n: 0, s: 0, c0: 0, c1: 0, c2: 0, B: 0, F: 0, I: 0, E: 0 });
    events.forEach((e) => {
      if (e.type === 'rec') { const r = bump(rec, e.p); r.n++; r['c' + e.c]++; r.s += Number(e.c); }
      if (e.type === 'opp') { const r = bump(opp, e.p); r.n++; r['c' + e.c]++; r.s += Number(e.c); }
      if (e.type === 'att') { const r = bump(att, e.p); r.n++; if (e.c === 'B') r.B++; else r['c' + e.c]++; }
      if (e.type === 'srv') { const r = bump(srv, e.p); r.n++; r[e.c]++; }
    });
    const sum = (o) => Object.values(o).reduce((a, r) => { Object.keys(r).forEach((k) => a[k] = (a[k] || 0) + r[k]); return a; }, { n: 0, s: 0, c0: 0, c1: 0, c2: 0, B: 0, F: 0, I: 0, E: 0 });
    return { rec, att, srv, opp, tRec: sum(rec), tAtt: sum(att), tSrv: sum(srv), tOpp: sum(opp) };
  }

  // ---------- Visninger ----------
  function render() {
    if (S.view === 'live' && !S.offline && cur()) {
      const root = document.getElementById('live-root');
      if (root && root.dataset.sig === liveSig(cur())) { updateLive(); return; }
    }
    const active = document.activeElement;
    const keepId = active && active.id && active.tagName !== 'SELECT' ? active.id : null;
    let selStart = null; try { selStart = active && 'selectionStart' in active ? active.selectionStart : null; } catch (e) {}
    const keepVal = active && active.tagName === 'INPUT' ? active.value : null;
    let html = '';
    if (S.offline) html = offlineView();
    else if (S.dash && S.noAccess) html = noAccessView();
    else if (!S.ready) html = '<div class="panel"><div class="empty">Laster kamper …</div></div>';
    else if (S.view === 'live' && cur()) html = liveView();
    else if (S.view === 'scout' && cur()) html = scoutView();
    else if (S.view === 'squad' && cur()) html = squadView();
    else if (S.view === 'detail' && cur()) html = detailView();
    else if (S.view === 'sheet' && cur()) html = sheetView();
    else if (S.view === 'season') html = seasonView();
    else if (S.view === 'table') html = tableView();
    else if (S.view === 'access' && S.canAdmin) html = accessView();
    else if (S.view === 'legend') html = legendView();
    else if (S.view === 'logos' && !S.dash) html = logosView();
    else if (S.view === 'watch' && cur()) html = cur().status === 'ferdig' ? detailView() : watchView();
    else html = listView();
    app.innerHTML = '<div id="err">' + errHtml() + '</div>' + html;
    if (S.view === 'live') fillMini();
    dirSync();
    if (S.menuOpen) { const pop = app.querySelector('.menu-pop'); if (pop) { const r = pop.getBoundingClientRect(); if (r.left < 8) { pop.style.right = 'auto'; pop.style.left = '0'; } } }
    if (keepId) { const el = document.getElementById(keepId); if (el) { if (keepVal != null && el.tagName === 'INPUT') el.value = keepVal; el.focus(); try { if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  }

  function noAccessView() {
    return '<div class="panel"><h2 class="display" style="font-size:28px">Kampstatistikk</h2><div class="empty">Du har lesetilgang, men er ikke knyttet til et lag ennå. Be den som delte appen med deg, om å gi deg tilgang til laget under «Tilgang».</div></div>';
  }
  // Live-visning for den som bare ser på: resultat, siste registreringer og løpende statistikk
  function watchView() {
    const m = cur(), oppName = oppTeam(m), evs = allEvents(), c = m.current || { set: 1 };
    return scoreBoard(m, c)
      + '<div class="lastbar"><span class="label">Siste</span><div class="chips">' + lastChips(evs, oppName) + '</div></div>'
      + statsPanel(m, evs, oppName);
  }
  function scoreBoard(m, c) {
    const sc = m.setScores || [], us = usName(m), weHome = m.home === us;
    const pills = sc.map((s, i) => { s = Array.isArray(s) ? s : [s.home, s.away]; const won = weHome ? s[0] > s[1] : s[1] > s[0]; return '<span class="' + (won ? 'won' : 'lost') + '">S' + (i + 1) + ' ' + s[0] + '–' + s[1] + '</span>'; }).join('')
      + '<span class="now">S' + c.set + ' ' + (c.home || 0) + '–' + (c.away || 0) + '</span>';
    return '<section class="board" aria-label="Resultat"><div class="b-top"><button class="link" data-a="back">‹ Kamper</button><span class="spacer"></span><span class="badge b-live">LIVE</span><span class="sub">' + esc(roundLabel(m)) + (m.venue ? ' · ' + esc(m.venue) : '') + '</span><span class="spacer"></span>' + (fsOk() ? fsBtn('barbtn') : '') + '</div>'
      + '<div class="b-mid"><div class="b-team">' + crest(m.home, 'lg') + '<div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="display">' + esc(shortName(m.home)) + '</span><span class="sw">Sett vunnet: ' + (m.setsHome || 0) + '</span></div></div>'
      + '<div class="b-score"><span class="label">Sett ' + c.set + '</span><div class="b-pts"><span>' + (c.home || 0) + '</span><span class="sep">:</span><span>' + (c.away || 0) + '</span></div></div>'
      + '<div class="b-team r"><div style="display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-end"><span class="display">' + esc(shortName(m.away)) + '</span><span class="sw">Sett vunnet: ' + (m.setsAway || 0) + '</span></div>' + crest(m.away, 'lg') + '</div></div>'
      + '<div class="b-sets">' + pills + '</div></section>';
  }

  // Lagmerker: klubblogoer ligger i config/logos (lagt inn av Claude), vist i hvit medaljong

  // Fargeforklaring: hva rød, gul og grønn betyr, og hvorfor grensene er som de er
  const legendLink = () => '<button class="textbtn" data-a="legend" style="padding:0;font-size:12px">Hva betyr fargene?</button>';
  function legendView() {
    const g = ctxGender(), f = (x) => dec(x);
    const sw = (c) => '<span class="avgbar ' + c + ' inl" style="margin:0 6px 0 0;width:28px"><i style="width:100%"></i></span>';
    const row = (lbl, t) => '<tr><td class="key l-al">' + lbl + '</td><td>' + sw('hi') + 'over ' + f(t[1]) + '</td><td>' + sw('mid') + f(t[0]) + '–' + f(t[1]) + '</td><td>' + sw('lo') + 'under ' + f(t[0]) + '</td></tr>';
    const table = (k) => { const T = THRESH[k]; return '<div class="tbl-wrap"><table class="tbl legend"><thead><tr><th class="l-al">' + (k === 'menn' ? 'Menn' : 'Kvinner') + '</th><th>Grønn</th><th>Gul</th><th>Rød</th></tr></thead><tbody>' + row('Angrep, alle', T.att) + row('Angrep, midtspillere', T.attMidt) + row('Mottak', T.rec) + row('Serve', T.srv) + '</tbody></table></div>'; };
    let h = '<header class="bar"><button class="link" data-a="back">‹ Tilbake</button><div class="title"><span class="display">Fargeforklaring</span><span class="sub">' + esc(CTX.name) + ' · grenser for ' + g + '</span></div><span class="spacer"></span></header>';
    h += '<section class="panel"><div class="panel-head"><h2>Slik leses søylene</h2></div><div class="status">Alle snitt er på skalaen 0–2, og søylen viser hvor langt opp på skalaen snittet ligger. Fargen viser nivået: grønn er godt, gul er middels og rød er svakt. Grensene er ulike for angrep og mottak, for midtspillere og for kvinner og menn. Laget du står i, bruker grensene for <b>' + g + '</b>.</div>' + table(g) + '</section>';
    h += '<section class="panel"><div class="panel-head"><h2>Hvorfor disse grensene</h2></div><div class="status" style="display:flex;flex-direction:column;gap:8px">'
      + '<span><b>Angrep.</b> Snittet er 1 + (poeng − feil − blokkert) / antall angrep. Det er den vanlige internasjonale angrepseffektiviteten pluss 1, så 1,25 tilsvarer en effektivitet på 0,250. Tommelfingerregler fra USA sier at under 0,100 er svakt, 0,200–0,250 er middels og 0,250–0,300 er godt.</span>'
      + '<span><b>Kvinner og menn.</b> Studier fra europeiske mesterskap og fra amerikansk collegevolleyball viser at menn har omtrent 0,07–0,10 høyere angrepseffektivitet, mest fordi de får flere poeng. Kvinner er litt bedre i mottak, trolig fordi menn server hardere. Derfor er angrepsgrensene lavere og mottaksgrensene litt høyere for kvinner.</span>'
      + '<span><b>Midtspillere.</b> Midtspillere angriper raskere og oftere mot enkeltblokk, og har normalt klart høyere effektivitet enn kant og diagonal. De får derfor en høyere grense. Posisjonen hentes fra troppen.</span>'
      + '<span><b>Mottak.</b> Snittet er 0 for feil, 1 for spillbart og 2 for perfekt, og kan leses som 1 + andel perfekte − andel feil. 1,40 betyr altså 40 prosentpoeng flere perfekte mottak enn feil. Det finnes ingen internasjonal norm for akkurat denne skalaen (vanligst er 0–3), så mottaksgrensene er en faglig vurdering.</span>'
      + '<span><b>Serve.</b> Snittet er 0 for feil, 1 for serve i spill og 2 for ess, altså 1 + (ess − feil) / antall serve. Over 1,00 betyr flere ess enn feil. Grensene er en faglig vurdering, litt lavere for menn fordi hoppserve gir flere feil.</span>'
      + '<span><b>Lav og høy.</b> Spilleren med lavest snitt markeres med oransje «Lav», og den med høyest snitt med grønn «Høy», i mottak, angrep og serve, både i registreringen og i tabellene. Bare spillere med minst 5 mottak eller angrep, eller minst 3 serve, er med (i kampvisningen gjelder litt høyere krav ut fra volumet i kampen). Motstanderens svakeste mottaker markeres med «Server hit».</span>'
      + '<span><b>Motstanderens mottak</b> bruker de samme fargene. Grønt der betyr at motstanderen tar imot godt, altså at vår serve har lite effekt.</span>'
      + '</div></section>';
    h += '<section class="panel"><div class="panel-head"><h2>Grenser for ' + (g === 'menn' ? 'kvinner' : 'menn') + '</h2></div>' + table(g === 'menn' ? 'kvinner' : 'menn') + '<div class="code-legend">Velges automatisk ut fra laget. Nye sesonger og lag får valget «Klasse» når de opprettes.</div></section>';
    return h;
  }

  // Lagmerker: last opp logo for hvert lag i sesongen. Bildet skaleres ned til 256 px og lagres i config/logos.
  function logoTeams() {
    const t = new Set([OUR].concat(CTX.teams || []));
    S.matches.forEach((m) => { if (!isSlot(m.home)) t.add(m.home); if (!isSlot(m.away)) t.add(m.away); });
    return [...t].filter(Boolean).sort((a, b) => (a === OUR ? -1 : b === OUR ? 1 : a.localeCompare(b, 'nb')));
  }
  function logosView() {
    let h = '<header class="bar"><button class="link" data-a="back">‹ Kamper</button><div class="title"><span class="display">Lagmerker</span><span class="sub">' + esc(CTX.name) + '</span></div><span class="spacer"></span></header>';

  function logoFromFile(file) {
    return new Promise((ok, feil) => {
      const r = new FileReader();
      r.onerror = () => feil(new Error('kunne ikke lese filen'));
      r.onload = () => {
        const img = new Image();
        img.onerror = () => feil(new Error('ikke et bilde'));
        img.onload = () => {
          const N = 256, k = Math.min(1, N / Math.max(img.width || N, img.height || N));
          const w = Math.max(1, Math.round((img.width || N) * k)), hh = Math.max(1, Math.round((img.height || N) * k));
          const c = document.createElement('canvas'); c.width = w; c.height = hh; c.getContext('2d').drawImage(img, 0, 0, w, hh);
          let url = c.toDataURL('image/png'); if (url.length > 150000) url = c.toDataURL('image/webp', 0.85);
          if (url.length > 190000) return feil(new Error('bildet er for stort'));
          ok(url);
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  const SCOUT = { unsubs: {}, logs: {}, memo: null };
  function scoutLoad(m) {
    if (!S.db || window.PUBLIC || S.dash || !m) return;
    const them = oppTeam(m);

  // Tabell: CEV-poeng (3–0/3–1 gir 3, 3–2 gir 2, 2–3 gir 1), så seire, poeng, settkvotient og ballkvotient
  function tableMatches() {
    return seasonMatches().filter((m) => m.stage !== 'sluttspill');
  }
  // Alle seriens/turneringens kamper med kjente lag, også sluttspill (brukes av topplistene)
  function seasonMatches() {
    return S.matches.filter((m) => !isSlot(m.home) && !isSlot(m.away) && !isTest(m) && (!m.custom || m.type === 'turnering' || m.type === 'serie'));
  }
  function standings() {
    const T = {}; const row = (t) => (T[t] ||= { team: t, k: 0, v: 0, tap: 0, p: 0, sv: 0, st: 0, bv: 0, bt: 0 });
    tableMatches().forEach((m) => {
      row(m.home); row(m.away);
      if (m.status !== 'ferdig' || !(m.setsHome + m.setsAway)) return;
      const H = row(m.home), A = row(m.away), hs = m.setsHome || 0, as = m.setsAway || 0;
      H.k++; A.k++; H.sv += hs; H.st += as; A.sv += as; A.st += hs;
      (m.setScores || []).forEach(([x, y]) => { H.bv += x; H.bt += y; A.bv += y; A.bt += x; });
      const win = hs > as ? H : A, lose = hs > as ? A : H, close = Math.min(hs, as) === 2;
      win.v++; lose.tap++; win.p += close ? 2 : 3; lose.p += close ? 1 : 0;
    });
    const q = (a, b) => b ? a / b : (a ? Infinity : 0);
    return Object.values(T).sort((a, b) => b.v - a.v || b.p - a.p || q(b.sv, b.st) - q(a.sv, a.st) || q(b.bv, b.bt) - q(a.bv, a.bt) || a.team.localeCompare(b.team, 'nb'));
  }
  function tableView() {
    const st = standings(), q = (a, b) => b ? (Math.round(a / b * 1000) / 1000).toFixed(3).replace('.', ',') : (a ? 'MAX' : '–');
    const all = tableMatches(), done = all.filter((m) => m.status === 'ferdig').length;
    let h = '<header class="bar"><button class="link" data-a="back">‹ Kamper</button><div class="title"><span class="display">Tabell</span><span class="sub">' + esc(CTX.name) + ' · ' + done + ' av ' + all.length + ' kamper spilt</span></div><span class="spacer"></span></header>';
    h += '<section class="panel"><div class="tbl-wrap"><table class="tbl standings"><thead><tr><th>#</th><th class="l-al">Lag</th><th>K</th><th>V</th><th>T</th><th>Poeng</th><th>Sett</th><th class="hide-sm">Settkv.</th><th class="hide-sm">Ballkv.</th></tr></thead><tbody>'
      + st.map((r, i) => '<tr' + (r.team === OUR ? ' class="us"' : '') + '><td>' + (i + 1) + '</td><td class="key l-al">' + teamTag(r.team, 'sm', shortName(r.team)) + '</td><td>' + r.k + '</td><td>' + r.v + '</td><td>' + r.tap + '</td><td class="key">' + r.p + '</td><td>' + r.sv + '–' + r.st + '</td><td class="hide-sm">' + q(r.sv, r.st) + '</td><td class="hide-sm">' + q(r.bv, r.bt) + '</td></tr>').join('')
      + '</tbody></table></div><div class="code-legend">Rangering: seire, poeng (3–0 og 3–1 gir 3 poeng, 3–2 gir 2 og 2–3 gir 1), settkvotient, ballkvotient.</div></section>';

      const slot = (t) => { if (!isSlot(t)) return esc(t); const r = st[parseInt(t, 10) - 1]; return esc(t) + (r && r.k ? ' <span class="muted">(nå: ' + esc(shortName(r.team)) + ')</span>' : ''); };
      return '<button class="po-card" data-a="open" data-id="' + esc(m.id) + '"><span class="label">' + esc(m.round || 'Sluttspill') + ' · ' + esc(fmtDate(m.date)) + (m.venue ? ' · ' + esc(m.venue) : '') + '</span><span class="po-teams">' + slot(m.home) + ' – ' + slot(m.away) + '</span><span class="po-res">' + (m.status === 'ferdig' ? (m.setsHome || 0) + '–' + (m.setsAway || 0) + (setList(m) ? ' <small>(' + esc(setList(m)) + ')</small>' : '') : 'Ikke spilt') + '</span></button>';
    }).join('') + '</div></section>';
    h += topListsView();
    return h;
  }

  // Topplister for serien/turneringen: NVBF-statistikk der den finnes, ellers egen føring (også kamper der vi har ført for et annet lag)
  // Kilden for offisiell statistikk: NVBF for serien, CEV for landslagsturneringer
  function srcName(n) { return (n && n.src) || 'NVBF'; }
  function topListsData() {
    const P = {}, pn = (v) => v == null ? null : parseFloat(String(v).replace('−', '-').replace('%', '').replace(',', '.'));
    let src = 0;
    seasonMatches().filter((m) => m.status === 'ferdig').forEach((m) => {
      let n = m.nvbf && m.nvbf.teams && m.nvbf.teams.length && !m.nvbf.partial ? m.nvbf : null;
      if (!n && canLive(m) && SEASON.logs[m.id] && SEASON.logs[m.id].length) n = ownStats(m, SEASON.logs[m.id]);
      if (!n) return; src++; addRecAvg(n);
      n.teams.forEach((t) => (t.players || []).forEach((p) => {
        const key = t.name + '|' + (p.name ? String(p.name).replace(/ \(L\)$/, '') : '#' + p.nr);
        const r = (P[key] ||= { team: t.name, name: p.name ? String(p.name).replace(/ \(L\)$/, '') : '#' + p.nr, nr: p.nr, games: new Set(), rec: 0, recSum: 0, att: 0, kills: 0, attErr: 0, blocked: 0, srv: 0, aces: 0, srvErr: 0, srvKnown: 0, pts: 0 });
        r.games.add(m.id); if (p.nr) r.nr = p.nr;
        if (p.rec) { const a = pn(p.recAvg); if (a != null && !isNaN(a)) { r.rec += p.rec; r.recSum += a * p.rec; } }
        if (p.att) { r.att += p.att; r.kills += p.kills || 0; r.attErr += p.attErr || 0; r.blocked += p.blocked || 0; }
        if (p.srv != null) { r.srv += p.srv; r.srvKnown += p.srv; }
        r.aces += p.aces || 0; r.srvErr += p.srvErr || 0; r.pts += p.pts || 0;
      }));
    });
    return { players: Object.values(P), matches: src };
  }
  function topListsView() {
    const { players, matches } = topListsData(), mode = S.topMode || 'snitt';
    if (!matches) return '<section class="panel"><div class="panel-head"><h2>Topplister</h2></div><div class="empty">Ingen spilte kamper med statistikk ennå.</div></section>';
    const minOf = (f) => Math.max(10, Math.round(0.25 * Math.max(0, ...players.map(f))));
    const lists = [
      { t: 'Angrep', kind: 'att', n: (r) => r.att, v: (r) => 1 + (r.kills - r.attErr - r.blocked) / r.att, vol: (r) => r.kills, volL: 'poeng', unit: 'angrep' },
      { t: 'Mottak', kind: 'rec', n: (r) => r.rec, v: (r) => r.recSum / r.rec, vol: (r) => r.rec, volL: 'mottak', unit: 'mottak' },
      { t: 'Serve', kind: 'srv', n: (r) => r.srvKnown, v: (r) => 1 + (r.aces - r.srvErr) / r.srvKnown, vol: (r) => r.aces, volL: 'ess', unit: 'serve' },
      { t: 'Poeng totalt', kind: null, n: (r) => r.pts, v: null, vol: (r) => r.pts, volL: 'poeng', unit: 'poeng' }
    ];
    const card = (L) => {
      const byVol = mode === 'volum' || !L.v, min = L.v ? minOf(L.n) : 1;
      const rows = players.filter((r) => byVol ? L.vol(r) > 0 : L.n(r) >= min).sort((a, b) => byVol ? (L.vol(b) - L.vol(a) || L.n(a) - L.n(b)) : (L.v(b) - L.v(a) || L.n(b) - L.n(a))).slice(0, 5);
      return '<div class="top-card"><div class="label" style="color:var(--accent)">' + L.t + '</div>'
        + (rows.length ? '<ol class="top-list">' + rows.map((r, i) => '<li' + (r.team === OUR ? ' class="us"' : '') + '><span class="top-rank">' + (i + 1) + '</span>' + crest(r.team, 'sm') + '<span class="top-name"><b>' + esc(r.name) + '</b><small>' + esc(shortName(r.team)) + ' · ' + r.games.size + ' kamp' + (r.games.size === 1 ? '' : 'er') + '</small></span>'
          + '<span class="top-val">' + (byVol ? '<b class="num">' + L.vol(r) + '</b><small>' + L.volL + '</small>' : avgBar(L.v(r), null, L.kind) + '<small>' + L.n(r) + ' ' + L.unit + '</small>') + '</span></li>').join('') + '</ol>'
          : '<div class="empty">For lite data ennå.</div>')
        + (L.v && !byVol ? '<div class="code-legend">Snitt 0–2, minst ' + min + ' ' + L.unit + '.</div>' : '') + '</div>';
    };
    return '<section class="panel"><div class="panel-head"><h2>Topplister · topp 5</h2><div class="seg" role="group" aria-label="Rangering"><button data-a="topmode" data-v="snitt" aria-pressed="' + (mode === 'snitt') + '">Beste snitt</button><button data-a="topmode" data-v="volum" aria-pressed="' + (mode === 'volum') + '">Flest</button></div></div>'
      + '<div class="top-grid">' + lists.map(card).join('') + '</div>'
      + '<div class="code-legend">Fra ' + matches + ' spilte kamper i ' + esc(CTX.name) + '. NVBF-statistikk der den finnes, ellers egen føring fra benken. Serve med snitt krever at serve i spill er ført. ' + legendLink() + '</div></section>';
  }

  function sheetView() {

    const maxSet = Math.max(5, ...evs.map((e) => e.set || 1), (m.current && m.current.set) || 1);

      if (!ids.length) h += '<tr><td class="sk-name">–</td><td colspan="' + (sets.length + 3) + '" class="sk-empty">Ingen registreringer</td></tr>';
      ids.forEach((id) => {

    const oppIds = [...new Set(byType('opp').map((e) => String(e.p)).concat(m.oppNumbers || []))].sort((a, b) => Number(a) - Number(b));

    let t = '<table class="sk"><tbody>'
      + '<tr><td class="sk-title" colspan="' + (Math.ceil(sets.length / 2) + 1) + '">' + esc(m.home) + ' - ' + esc(m.away) + (dstr ? ' ' + dstr : '') + '</td>'

      + '<tr><td class="sk-res" colspan="' + (sets.length + 4) + '">Resultat: ' + esc(res) + '</td></tr>'
      + block('Mottak', 'rec', recIds, pname, ['Antall', 'Poeng', 'Snitt'], sumAvg)
      + block('Angrep', 'att', attIds, pname, ['Antall', 'Poeng', 'Snitt'], sumAvg)
      + block('Serve <span class="sk-sub">(F feil · I i spill · E ess)</span>', 'srv', srvIds, pname, ['Antall', 'Ess', 'Feil'], (mine) => [mine.length, mine.filter((e) => e.c === 'E').length, mine.filter((e) => e.c === 'F').length])
      + block(esc(oppName) + ' mottak', 'opp', oppIds, (n) => oppLabel(m, n), ['Antall', 'Poeng', 'Snitt'], sumAvg)
      + '</tbody></table>';

    return '<header class="bar"><button class="link" data-a="to-live">‹ Tilbake til kampen</button><div class="title"><span class="display">Kampark</span><span class="sub">' + esc(m.home) + ' – ' + esc(m.away) + '</span></div><span class="spacer"></span>'
      + '<div class="bar-actions"><button class="barbtn primary-bar" data-a="xlsx">Last ned Excel</button><button class="barbtn" data-a="pdf">PDF</button>' + (S.dl ? '<button class="barbtn" data-a="export">CSV</button>' : '') + '</div></header>'

  }

  // Mottakssnitt (0–2) for NVBF-kamper, regnet fra antall, feil og perfekt %: perfekt = 2, feil = 0, resten = 1
  function addRecAvg(n) {
    if (!n || !n.teams) return;
    const num = (v) => { const x = parseFloat(String(v ?? '').replace('%', '').replace(',', '.').replace('−', '-')); return isNaN(x) ? null : x; };
    n.teams.forEach((t) => {
      let N = 0, Pf = 0, F = 0;
      (t.players || []).forEach((p) => {
        const perf = num(p.recPerf);
        if (!p.rec || perf == null) return;
        const pn = Math.round(p.rec * perf / 100), f = p.recErr || 0;
        if (p.recAvg == null) p.recAvg = dec((2 * pn + (p.rec - pn - f)) / p.rec);
        N += p.rec; Pf += pn; F += f;
      });
      if (N) { t.totals = t.totals || {}; if (t.totals.recAvg == null) t.totals.recAvg = dec((2 * Pf + (N - Pf - F)) / N); }
    });
  }

  // Egen føring samlet i samme form som NVBF-statistikken, til visningsmodus for avsluttede kamper
  // NVBF fyller hullene i egen føring: kategorier vi ikke har ført (mottak, angrep, serve, motstanders mottak) hentes fra NVBF-statistikken
  // for avsluttede kamper. Fører vi en kategori i etterkant, brukes vår egen føring for den i stedet.
  const NVCAT = { rec: 'mottak', att: 'angrep', srv: 'serve', opp: 'motstanders mottak' };
  function nvbfFill(m, evs) {
    const out = { extra: [], cats: [] };
    if (!m || m.status !== 'ferdig' || !(m.nvbf && m.nvbf.teams && m.nvbf.teams.length)) return out;
    const us = usName(m), has = (t) => evs.some((e) => e.type === t);
    const tUs = m.nvbf.teams.find((t) => t.name === us), tOpp = m.nvbf.teams.find((t) => t.name !== us);
    const ros = teamRoster(m), norm = (s) => String(s || '').replace(/ \(L\)$/, '').trim().toLowerCase();
    const idOf = (p) => { const r = ros.find((x) => p.nr && String(x.nr) === String(p.nr)) || ros.find((x) => norm(x.name) === norm(p.name)); return r ? r.id : 'nv:' + norm(p.name || p.nr).replace(/\s+/g, '-'); };
    const pc = (v) => { const x = parseFloat(String(v ?? '').replace('%', '').replace(',', '.')); return isNaN(x) ? 0 : x; };
    const push = (type, p, c, n, name) => { for (let i = 0; i < n; i++) out.extra.push({ t: 0, set: 0, type, p, c, n: name, nv: true }); };
    const recEv = (type, p, id) => { const n = p.rec || 0; if (!n) return; const c2 = Math.round(n * pc(p.recPerf) / 100), c0 = Math.min(n - c2, p.recErr || 0); push(type, id, '2', c2, p.name); push(type, id, '0', c0, p.name); push(type, id, '1', n - c2 - c0, p.name); };
    if (tUs) (tUs.players || []).forEach((p) => {
      const id = idOf(p); if (String(id).startsWith('nv:') && p.name) NAMEHINT[id] = String(p.name).replace(/ \(L\)$/, '');
      if (!has('rec')) recEv('rec', p, id);
      if (!has('att') && p.att) { const k = p.kills || 0, f = p.attErr || 0, b = p.blocked || 0; push('att', id, '2', k, p.name); push('att', id, '0', f, p.name); push('att', id, 'B', b, p.name); push('att', id, '1', Math.max(0, p.att - k - f - b), p.name); }
      if (!has('srv') && (p.srv || p.aces || p.srvErr)) { const e = p.aces || 0, f = p.srvErr || 0; push('srv', id, 'E', e, p.name); push('srv', id, 'F', f, p.name); if (p.srv) push('srv', id, 'I', Math.max(0, p.srv - e - f), p.name); }
    });
    if (tOpp && !has('opp')) (tOpp.players || []).forEach((p) => { if (!p.nr) return; recEv('opp', p, String(p.nr)); if (p.rec && p.name && !OPPHINT[String(p.nr)]) OPPHINT[String(p.nr)] = String(p.name).replace(/ \(L\)$/, ''); });
    Object.keys(NVCAT).forEach((k) => { if (!has(k) && out.extra.some((e) => e.type === k)) out.cats.push(NVCAT[k]); });
    return out;
  }
  const withNvbf = (m, evs) => { const f = nvbfFill(m, evs); return f.extra.length ? evs.concat(f.extra) : evs; };

  function ownStats(m, evs) {
    const E = evs.filter((e) => e.type === 'rec' || e.type === 'att' || e.type === 'srv' || e.type === 'opp');
    if (!E.length) return null;
    const cnt = (a, v) => a.filter((x) => x === v).length;
    const avg = (a) => a.length ? dec(a.reduce((s, x) => s + (Number(x) || 0), 0) / a.length) : undefined;
    const sp = {}; const get = (id) => (sp[id] ||= { id, rec: [], att: [], srv: [] });
    E.forEach((e) => { if (e.type !== 'opp') get(e.p)[e.type].push(String(e.c)); });
    const inServe = E.some((e) => e.type === 'srv' && String(e.c) === 'I');
    const ord = teamRoster(m).map((p) => p.id); const ix = (id) => { const i = ord.indexOf(id); return i < 0 ? 999 : i; };
    const T = { rec: [], att: [], srv: [] };
    const players = Object.values(sp).sort((a, b) => ix(a.id) - ix(b.id)).map((p) => {
      const pl = player(p.id) || {}; const o = { nr: pl.nr || '', name: pl.name || pname(p.id) };
      if (p.rec.length) Object.assign(o, { rec: p.rec.length, recErr: cnt(p.rec, '0'), recAvg: avg(p.rec), recPlay: pct(cnt(p.rec, '1'), p.rec.length), recPerf: pct(cnt(p.rec, '2'), p.rec.length) });
      if (p.att.length) { const k = cnt(p.att, '2'); Object.assign(o, { att: p.att.length, kills: k, attErr: cnt(p.att, '0'), blocked: cnt(p.att, 'B'), kp: pct(k, p.att.length) }); }
      if (p.srv.length || p.att.length) { Object.assign(o, { aces: cnt(p.srv, 'E'), srvErr: cnt(p.srv, 'F'), pts: cnt(p.att, '2') + cnt(p.srv, 'E') }); if (inServe) o.srv = p.srv.length; }
      T.rec.push(...p.rec); T.att.push(...p.att); T.srv.push(...p.srv);
      return o;
    });
    const k = cnt(T.att, '2'), f = cnt(T.att, '0'), b = cnt(T.att, 'B');
    const totals = { recAvg: avg(T.rec), recPerf: T.rec.length ? pct(cnt(T.rec, '2'), T.rec.length) : undefined, aces: cnt(T.srv, 'E'), srvErr: cnt(T.srv, 'F'), pts: k + cnt(T.srv, 'E') };
    if (T.att.length) Object.assign(totals, { kp: pct(k, T.att.length), eff: pct1(k - f - b, T.att.length) });
    if (inServe) totals.srv = T.srv.length;
    const oppTeamName = m.home === usName(m) ? m.away : m.home;
    const oppr = {};
    E.forEach((e) => { if (e.type === 'opp') (oppr[String(e.p)] ||= []).push(String(e.c)); });
    const opp = { name: oppTeamName, players: [], totals: {} };
    const nums = Object.keys(oppr).sort((a, b) => Number(a) - Number(b));
    if (nums.length) {
      const all = nums.flatMap((n) => oppr[n]);
      opp.players = nums.map((n) => ({ nr: n, name: oppName(m, n), rec: oppr[n].length, recErr: cnt(oppr[n], '0'), recAvg: avg(oppr[n]), recPlay: pct(cnt(oppr[n], '1'), oppr[n].length), recPerf: pct(cnt(oppr[n], '2'), oppr[n].length) }));
      opp.totals = { recAvg: avg(all), recPerf: pct(cnt(all, '2'), all.length) };
    } else opp.missing = 'Motstanderens mottak ble ikke ført i denne kampen.';
    return { source: 'egen', teams: [{ name: usName(m), players, totals }, opp] };
  }

  function detailView() {
    const m = cur(); const ours = canLive(m);
    const ownEvs = allEvents(), fill = ours && ownEvs.length ? nvbfFill(m, ownEvs) : { extra: [], cats: [] };
    const own = ours ? ownStats(m, ownEvs.concat(fill.extra)) : null; const hasNvbf = !!(m.nvbf && m.nvbf.teams && m.nvbf.teams.length);
    // Motstanderens angrep, serve og poeng føres aldri fra benken, så de hentes fra NVBF når statistikken finnes
    if (own && hasNvbf && m.status === 'ferdig') {
      const nOpp = m.nvbf.teams.find((t) => t.name !== usName(m)), oOpp = own.teams[1], F = ['att', 'attErr', 'blocked', 'kills', 'kp', 'eff', 'srv', 'srvErr', 'aces', 'blocks', 'pts'];
      if (nOpp && oOpp && (nOpp.players || []).some((p) => F.some((f) => p[f] != null))) {
        (nOpp.players || []).forEach((p) => {
          if (!F.some((f) => p[f] != null)) return;
          let q = oOpp.players.find((x) => String(x.nr) === String(p.nr)); if (!q) { q = { nr: p.nr, name: p.name }; oOpp.players.push(q); }
          if (!q.name) q.name = p.name; F.forEach((f) => { if (p[f] != null) q[f] = p[f]; });
        });
        F.forEach((f) => { if (nOpp.totals && nOpp.totals[f] != null) oOpp.totals[f] = nOpp.totals[f]; });
        if (oOpp.missing && oOpp.players.length) delete oOpp.missing;
        fill.cats.push('angrep, serve og poeng for ' + shortName(nOpp.name));
      }
    }
    const egen = !!own && !(S.detailSrc === 'nvbf' && hasNvbf); const n = egen ? own : m.nvbf;
    addRecAvg(n);
    const oc = outcome(m);
    let h = '<header class="bar det-bar"><button class="link" data-a="back">‹ Kamper</button><div class="title"><span class="display tm" style="flex-wrap:wrap">' + crest(m.home, 'sm') + esc(shortName(m.home)) + ' – ' + esc(shortName(m.away)) + crest(m.away, 'sm') + ' ' + (m.setsHome != null && m.status !== 'kommende' ? m.setsHome + '–' + m.setsAway : '') + (oc ? ' <span class="badge ' + (oc === 'win' ? 'b-win">Seier' : 'b-loss" style="color:#F0A774;box-shadow:inset 0 0 0 1.5px #F0A774">Tap') + '</span>' : '') + '</span><span class="sub">' + esc(fmtDate(m.date)) + ((m.setScores || []).length ? ' · ' + m.setScores.map((s) => s[0] + '–' + s[1]).join(' · ') : '') + '</span></div><span class="spacer"></span>'
      + (n && n.url ? '<a href="' + esc(n.url) + '" target="_blank" rel="noopener">Åpne hos ' + srcName(n) + ' ›</a>' : '') + (ours ? (!window.PUBLIC && ownEvs.some((e) => e.type === 'dir') ? '<button class="barbtn" data-a="dir">Slagretning</button>' : '') + '<div class="bar-actions"><button class="barbtn" data-a="sheet">Kampark</button><button class="barbtn primary-bar" data-a="edit">Åpne for endring</button></div>' : '') + (ours && m.custom && !S.dash ? '<button class="barbtn" data-a="delmatch">Slett kamp</button>' : '') + '</header>';
    if (!ours && !S.dash) h += othersPanel(m);
    if (own && hasNvbf) h += '<div class="seg" role="group" aria-label="Kilde"><button data-a="dsrc" data-v="egen" aria-pressed="' + egen + '">Egen føring</button><button data-a="dsrc" data-v="nvbf" aria-pressed="' + !egen + '">' + srcName(n) + '</button></div>';
    if (!n || !n.teams || !n.teams.length) return h + '<div class="panel"><div class="empty">' + (ours ? (S.dash && !window.PUBLIC ? 'Det er ikke ført statistikk i denne kampen ennå.' : 'Ingen registreringer i denne kampen. Trykk «Åpne for endring» for å føre statistikk.') : CTX.id !== 'main' ? (m.status === 'ferdig' ? 'Resultatet er registrert. Det er ikke ført statistikk i denne kampen.' : 'Kampen er ikke spilt ennå.') : m.status === 'ferdig' ? 'Kampstatistikken fra NVBF er ikke hentet inn ennå. Be Claude hente den, så dukker den opp her.' : 'Kampen er ikke spilt ennå. Statistikken kan hentes fra NVBF når den er publisert.') + '</div></div>';
    h += '<div class="status">' + (egen ? 'Egen føring fra benken. Mottak og angrep på skala 0–2.' + (fill.cats.length ? ' Ikke ført, hentet fra ' + srcName(n) + ': ' + fill.cats.join(', ') + '.' : '') : 'Offisiell ' + srcName(n) + '-statistikk' + (n.coverage ? ' · <b>' + esc(n.coverage) + '</b>' : '') + ' · ' + (n.src ? '' : 'kontrollert ') + esc(n.checked || 'ukjent tid')) + ' ' + legendLink() + '</div>';
    h += '<div class="rounds">' + n.teams.map((t) => {
      const T = t.totals || {};
      let s = '<section class="panel"><div class="panel-head"><h2>' + esc(t.name) + '</h2></div>';
      if (t.missing) s += '<div class="empty">' + esc(t.missing) + '</div>';
      const k = [['Angrep uttelling', T.kp], ['Angrep snitt (0–2)', T.eff != null ? dec(1 + parseFloat(String(T.eff).replace('−', '-').replace(',', '.')) / 100) : null], ['Mottak snitt (0–2)', T.recAvg], ['Positivt mottak', egen ? null : T.recPos], ['Perfekt mottak', T.recPerf], ['Ess / servefeil', T.aces != null ? T.aces + ' / ' + T.srvErr : null], ['Blokkpoeng', T.blocks]].filter((x) => x[1] != null);

      const pr = (t.players || []).filter((p) => p.rec != null).sort((a, b) => b.rec - a.rec);
      const recTot = pr.reduce((a, p) => a + p.rec, 0), minRec = Math.max(8, Math.round(recTot * 0.15));

      const pick = (arr, cnt, f, minN) => { const el = arr.filter((p) => cnt(p) >= minN).sort((a, b) => f(a) - f(b) || cnt(b) - cnt(a)); return el.length > 1 && f(el[0]) !== f(el[el.length - 1]) ? { lo: el[0], hi: el[el.length - 1] } : {}; };
      const exR = pick(pr, (p) => p.rec, (p) => pnum(p.recAvg), minRec);
      if (pr.length) s += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mottak</th><th>Ant.</th><th>Snitt</th><th>Feil</th>' + (egen ? '<th>Spillb.</th>' : '<th>Pos.</th>') + '<th>Perf.</th></tr></thead><tbody>' + pr.map((p) => '<tr' + loHi(p, exR)[0] + '><td class="key">' + esc(p.nr ? '#' + p.nr + ' ' : '') + esc(p.name) + loHi(p, exR)[1] + '</td><td>' + p.rec + '</td><td class="key">' + avgBar(p.recAvg, esc(p.recAvg ?? '–')) + '</td><td>' + (p.recErr ?? '–') + '</td>' + (egen ? '<td>' + esc(p.recPlay ?? '–') + '</td>' : '<td>' + esc(p.recPos ?? '–') + '</td>') + '<td>' + esc(p.recPerf ?? '–') + '</td></tr>').join('') + '</tbody></table></div>';
      const pa = (t.players || []).filter((p) => p.att != null).sort((a, b) => b.att - a.att);
      const attTot = pa.reduce((a, p) => a + (p.att || 0), 0), minAtt = Math.max(5, Math.round(attTot * 0.1));
      const exA = pick(pa, (p) => p.att || 0, (p) => 1 + (p.kills - p.attErr - p.blocked) / p.att, minAtt);
      if (pa.length) s += '<div class="tbl-wrap"><table class="tbl t-att"><thead><tr><th>Angrep</th><th>Fors.</th><th>Snitt</th><th>Poeng</th><th>Feil</th><th>Blokk.</th><th>Utt.</th></tr></thead><tbody>' + pa.map((p) => '<tr' + loHi(p, exA)[0] + '><td class="key">' + esc(p.nr ? '#' + p.nr + ' ' : '') + esc(p.name) + loHi(p, exA)[1] + '</td><td>' + p.att + '</td><td class="key">' + (p.att ? avgBar(1 + (p.kills - p.attErr - p.blocked) / p.att, null, 'att', t.name === OUR ? posByNr(p.nr) : '') : '–') + '</td><td>' + p.kills + '</td><td>' + p.attErr + '</td><td>' + p.blocked + '</td><td>' + esc(p.kp ?? pct(p.kills, p.att)) + '</td></tr>').join('') + '</tbody></table></div>';

      return s + '</section>';
    }).join('') + '</div>';
    return h;
  }

  // ---------- Sesong: kamp for kamp etter terminplanen ----------
  const SEASON = { logs: {}, unsubs: {}, inclTest: false, metric: 'recAvg', sortK: 'recN', sortDir: -1, player: 'team' };
  try { SEASON.inclTest = localStorage.getItem('rv-incltest') === '1'; } catch (e) {}
  const isTest = (m) => String(m.round || '').toLowerCase() === 'test';
  const p0 = (v) => v == null ? '–' : Math.round(v * 100) + ' %';
  const d2 = (v) => v == null ? '–' : dec(v);
  const d1 = (v) => v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');

  function openSeasonLogs() {
    if (!S.db) return;
    S.matches.filter((m) => isOurs(m) || canLive(m)).forEach((m) => {
      if (SEASON.unsubs[m.id] || m.status === 'kommende') return;

        const evs = [];
        snap.docs.forEach((d) => evs.push(...(d.data().events || []))); learnNames(evs, null);
        evs.sort((a, b) => a.t - b.t);

      }, (e) => { S.error = 'Registreringene kunne ikke lastes (' + e.code + ').'; render(); });
    });
  }
  function closeSeasonLogs() { Object.values(SEASON.unsubs).forEach((u) => { try { u(); } catch (e) {} }); SEASON.unsubs = {}; }

  const METRICS = [
    { k: 'recAvg', l: 'Mottak snitt', note: '0–2-skala, høyere er bedre', f: (st) => st.tRec.n ? st.tRec.s / st.tRec.n : null, fmt: d2, fixed: [0, 2], kind: 'rec' },
    { k: 'recPerf', l: 'Perfekt mottak', note: 'andel mottak kodet 2', f: (st) => st.tRec.n ? st.tRec.c2 / st.tRec.n : null, fmt: p0, fixed: [0, 1] },
    { k: 'attEff', l: 'Angrepssnitt', note: '0–2-skala, feil og blokkert teller 0', f: (st) => st.tAtt.n ? 1 + (st.tAtt.c2 - st.tAtt.c0 - st.tAtt.B) / st.tAtt.n : null, fmt: d2, fixed: [0, 2], kind: 'att' },
    { k: 'attKill', l: 'Angrep uttelling', note: 'poeng / angrep', f: (st) => st.tAtt.n ? st.tAtt.c2 / st.tAtt.n : null, fmt: p0, fixed: [0, 1] },
    { k: 'oppAvg', l: 'Motstanders mottak', note: 'snitt 0–2 på vår serve, lavere er bedre', f: (st) => st.tOpp.n ? st.tOpp.s / st.tOpp.n : null, fmt: d2, fixed: [0, 2], kind: 'rec' }
  ];

  function summarize(m) {
    const own = SEASON.logs[m.id] || [], evs = withNvbf(m, own);
    const home = m.home === usName(m);
    const us = home ? (m.setsHome || 0) : (m.setsAway || 0);
    const them = home ? (m.setsAway || 0) : (m.setsHome || 0);
    return { m, evs, ownN: own.length, nvN: evs.length - own.length, home, opp: home ? m.away : m.home, us, them, sets: us + them, done: m.status === 'ferdig', live: m.status === 'pågår', st: computeStats(evs) };
  }

  function lineChart(rows, metric) {
    const W = Math.max(300, Math.min(1360, (app.clientWidth || 700) - 28)), H = 230;
    const ml = 44, mr = 14, mt = 24, mb = W < 520 ? 30 : 44;
    const vals = rows.map((r) => r.evs.length ? metric.f(r.st) : null);
    const have = vals.filter((v) => v != null);
    let lo = metric.fixed ? metric.fixed[0] : Math.min(0, ...have, -0.1), hi = metric.fixed ? metric.fixed[1] : Math.max(0.3, ...have);
    if (!metric.fixed) { lo = Math.floor(lo * 10) / 10; hi = Math.ceil(hi * 10) / 10; }
    const y = (v) => mt + (H - mt - mb) * (1 - (v - lo) / (hi - lo || 1));
    const step = (W - ml - mr) / Math.max(1, rows.length);
    const x = (i) => ml + step * (i + 0.5);
    const ticks = [0, 1, 2, 3, 4].map((i) => lo + (hi - lo) * i / 4);
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(metric.l) + ' kamp for kamp">';
    // Fargesoner for snitt: rød, gul og grønn bak kurven, med samme grenser som søylene
    const pos = metric.kind === 'att' && SEASON.player !== 'team' ? posOf(SEASON.player) : '';
    const LV = { lo: 'var(--bad)', mid: '#D9A21B', hi: 'var(--good)' };
    if (metric.kind) {
      const [t0, t1] = thr(metric.kind, pos), cl = (v) => Math.max(lo, Math.min(hi, v));
      [[lo, t0, 'lo'], [t0, t1, 'mid'], [t1, hi, 'hi']].forEach(([a, b, k]) => { if (cl(b) > cl(a)) s += '<rect x="' + ml + '" width="' + (W - ml - mr) + '" y="' + y(cl(b)) + '" height="' + (y(cl(a)) - y(cl(b))) + '" fill="' + LV[k] + '" opacity=".09"></rect>'; });
      [[t0, 11], [t1, -3]].forEach(([t, dy]) => { s += '<text x="' + (ml + 4) + '" y="' + (y(t) + dy) + '" font-size="10" fill="var(--muted)">' + esc(metric.fmt(t)) + '</text>'; });
    }

    if (lo < 0 && hi > 0) s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--faint)" stroke-width="1"></line>';

    if (pooled != null) s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(pooled) + '" y2="' + y(pooled) + '" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 4" opacity=".7"></line><text x="' + (W - mr) + '" y="' + (y(pooled) - 5) + '" text-anchor="end" font-size="11" fill="var(--accent)">Sesong ' + esc(metric.fmt(pooled)) + '</text>';

    if (pts.length > 1) s += '<path d="' + pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>';

      const lab = roundShort(r.m);
      s += '<text x="' + x(i) + '" y="' + (H - mb + 16) + '" text-anchor="middle" font-size="11" font-weight="' + (future ? 400 : 600) + '" fill="' + (future ? 'var(--faint)' : 'var(--fg)') + '">' + esc(lab) + '</text>';

  }

  function seasonView() {
    const all = S.matches.filter(isOurs).filter((m) => (SEASON.inclTest || !isTest(m)) && m.inSeason !== false).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const rows = all.map(summarize);
    const played = rows.filter((r) => r.done || r.live);
    const reg = played.filter((r) => r.evs.length);
    const done = rows.filter((r) => r.done);
    const wins = done.filter((r) => r.us > r.them).length, losses = done.length - wins;
    const setsW = done.reduce((a, r) => a + r.us, 0), setsL = done.reduce((a, r) => a + r.them, 0);
    const pool = computeStats(reg.flatMap((r) => r.evs));
    const regSets = reg.reduce((a, r) => a + Math.max(1, r.sets || (r.m.setScores || []).length || 1), 0);
    const last = reg[reg.length - 1];
    const next = rows.find((r) => !r.done && !isTest(r.m));
    const hasTest = S.matches.some((m) => isOurs(m) && isTest(m));
    const solo = SEASON.player !== 'team';
    if (solo && SEASON.metric === 'oppAvg') SEASON.metric = 'recAvg';
    const M = METRICS.find((x) => x.k === SEASON.metric) || METRICS[0];
    const metricsShown = solo ? METRICS.filter((x) => x.k !== 'oppAvg') : METRICS;
    const chartRows = solo ? rows.map((r) => { const evs = r.evs.filter((e) => e.type !== 'opp' && e.type !== 'dir' && String(e.p) === String(SEASON.player)); return { ...r, evs, st: computeStats(evs) }; }) : rows;
    const withRegs = new Set(rows.flatMap((r) => r.evs.filter((e) => e.type !== 'opp' && e.type !== 'dir').map((e) => String(e.p))));
