<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taktikk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* V3 Taktikk (issue #23). Mørk benkemodus som appen; lyst tema med data-theme="light". */
:root {
  --bg: #0D1117; --surface: #161B24; --sunk: #1D2430; --line: #2A3240; --fg: #E8ECF2; --muted: #9AA4B2;
  --accent: #8FB3FF; --accent-fg: #0D1117; --accent-soft: #1E2A44; --warn-bg: #3A2614; --warn: #F2B27A; --ok: #4CD08A; --bad: #F07167;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif; --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F2F1EC; --surface: #FFFFFF; --sunk: #E7E5DE; --line: #D9D6CD; --fg: #16181D; --muted: #4A4F5A;
  --accent: #1B4592; --accent-fg: #FFFFFF; --accent-soft: #DCE4F5; --warn-bg: #FBF3EC; --warn: #8A3E0F; --ok: #1F7A4D; --bad: #B3261E; color-scheme: light;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); }
main { max-width: 1100px; margin: 0 auto; padding-block: 10px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font: 700 30px/1.05 var(--font-display); }
h2 { margin: 0; font: 700 21px/1.1 var(--font-display); }
.topp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.topp a { color: var(--accent); font-weight: 600; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
.spacer { flex: 1; }
.merke { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-bg); padding: 3px 9px; border-radius: 999px; }
.liten { font-size: 13px; color: var(--muted); margin: 0; }
.etikett { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input, button { font: inherit; color: var(--fg); }
input[type=email], input[type=password] { min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); font-size: 16px; }
.knapp { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
.knapp.primar { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
:focus-visible { outline: 3px solid #F5B700; outline-offset: 2px; }
[hidden] { display: none !important; }
.kort { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.innlogging { max-width: 400px; margin: 32px auto; width: 100%; }
.melding { max-width: 520px; margin: 32px auto; width: 100%; }
.feil { color: var(--bad); font-size: 14px; min-height: 18px; margin: 0; }
.moduler { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.modul { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.modul .fase { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.bruker { font-size: 13px; color: var(--muted); }
</style>
<!-- app-ikon -->
<link rel="apple-touch-icon" sizes="180x180" href="../../ikoner/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../ikoner/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../ikoner/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="512x512" href="../../ikoner/icon-512.png">
<meta name="apple-mobile-web-app-title" content="Taktikk damer">
<!-- /app-ikon -->
</head>
<body>
<main>
  <div class="topp">
    <a id="tilbake" href="../">‹ Tilbake til kampene</a>
    <span class="spacer"></span>
    <span class="merke">V3 · under utvikling</span>
  </div>
  <div id="app" aria-live="polite"><p class="liten">Laster …</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
/*
 * V3 Taktikk (issue #23, fase 1): egen side med egen V3-innlogging. Bare for Randaberg damer og herrer.
 *  * Egen økt (eget storageKey), så den felles beta-innloggingen på lagsiden ikke berøres – og omvendt:
 *    den automatiske beta-brukeren blir aldri brukt her.
 *  * Tilgang avgjøres i databasen (stats.v3_status / RLS på v3_planer), aldri av lagnavn i nettleseren.
 *  * ?demo=1 viser siden uten nett. &v3=tilgang | ingen | av velger tilstand (standard: tilgang).
 */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search), demo = q.has('demo');
  const cfg = window.V2_CONFIG || {};
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  try { const t = localStorage.getItem('rv-theme'); if (t === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) { /* standard mørk */ }
  $('tilbake').href = demo ? '../?demo=1' : '../';
  const lagnavn = (cfg.main && cfg.main.name) || 'Randaberg';

  const MODULER = [
    ['Kampplan', 'Plan mot neste motstander: mottak, angrepsvalg og fokuspunkter.'],
    ['Serveplan', 'Hvem som serves på i hver rotasjon, og hvor.'],
    ['Observasjoner', 'Korte notater fra kamp og trening, knyttet til kamp og spiller.'],
    ['Treningsprioriteringer', 'Hva statistikken peker på at laget bør trene mer på.'],
  ];

  function vis(html) { $('app').innerHTML = html; }
  function loggUtKnapp() { return '<button class="knapp" type="button" id="v3-ut">Logg ut av Taktikk</button>'; }
  function kobleUt(client) { const b = $('v3-ut'); if (b) b.onclick = async () => { if (client) await client.auth.signOut(); location.reload(); }; }

  function innhold(epost, antall, client) {
    vis('<div style="display:flex;flex-direction:column;gap:12px">'
      + '<div class="topp"><div><h1>Taktikk</h1><p class="liten">' + esc(lagnavn) + ' · trenerstøtte (V3)</p></div><span class="spacer"></span>'
      + '<span class="bruker">' + esc(epost) + '</span>' + loggUtKnapp() + '</div>'
      + '<div class="kort" id="v3-innhold"><h2>Du har V3-tilgang</h2><p class="liten">Denne delen er bare synlig for trenere med egen V3-tilgang i laget. '
      + 'Føringen og de vanlige sidene er som før. Lagrede V3-notater i laget: <b id="v3-antall">' + antall + '</b>.</p></div>'
      + '<div class="moduler">' + MODULER.map((m) => '<div class="modul"><span class="fase">Kommer</span><h2>' + esc(m[0]) + '</h2><p class="liten">' + esc(m[1]) + '</p></div>').join('') + '</div>'
      + '</div>');
    kobleUt(client);
  }
  function melding(tittel, tekst, client, id) {
    vis('<div class="kort melding" id="' + id + '"><h1>' + esc(tittel) + '</h1><p class="liten">' + tekst + '</p>' + (client !== undefined ? loggUtKnapp() : '') + '</div>');
    kobleUt(client);
  }
  function ikkeAktiv() { melding('Taktikk er ikke slått på', 'V3 er ikke aktiv for dette laget.', undefined, 'v3-av'); }
  function ingenTilgang(epost, client) {
    melding('Ingen V3-tilgang', 'Du er logget inn som ' + esc(epost) + ', men brukeren har ikke V3-tilgang i ' + esc(lagnavn) + '. Be eieren av laget gi deg tilgang.', client, 'v3-ingen');
  }

  function innlogging(client, feiltekst) {
    vis('<form class="kort innlogging" id="v3-login"><h1>Taktikk</h1><p class="liten">Egen innlogging for trenere med V3-tilgang. Føringen trenger ikke denne.</p>'
      + '<label class="etikett" for="v3-e">E-post</label><input id="v3-e" type="email" autocomplete="username" required>'
      + '<label class="etikett" for="v3-p">Passord</label><input id="v3-p" type="password" autocomplete="current-password" required>'
      + '<button class="knapp primar" type="submit">Logg inn</button><p class="feil" id="v3-feil" role="alert">' + esc(feiltekst || '') + '</p></form>');
    $('v3-login').addEventListener('submit', async (ev) => {
      ev.preventDefault(); $('v3-feil').textContent = '';
      if (!client) { // demo: alt annet enn tom e-post logger inn
        return $('v3-e').value ? demoEtter($('v3-e').value) : null;
      }
      const r = await client.auth.signInWithPassword({ email: $('v3-e').value, password: $('v3-p').value });
      if (r.error) { $('v3-feil').textContent = 'Innlogging feilet: ' + r.error.message; return; }
      etterInnlogging(client, r.data.user);
    });
  }

  async function etterInnlogging(client, bruker) {
    const slug = cfg.mainSlug || 'main';
    const r = await client.schema('stats').rpc('v3_status', { p_slug: slug });
    if (r.error || !r.data) return ikkeAktiv();           // funksjonen finnes ikke ennå (migrering ikke kjørt) = av
    if (!r.data.aktiv) return ikkeAktiv();
    if (!r.data.tilgang) return ingenTilgang(bruker.email, client);
    let antall = 0;
    try { const c = await client.schema('stats').from('v3_planer').select('id', { count: 'exact', head: true }); antall = c.count || 0; } catch (e) { antall = 0; }
    innhold(bruker.email, antall, client);
  }

  // ---------- Demo ----------
  const demoTilstand = q.get('v3') || 'tilgang';
  function demoEtter(epost) {
    if (demoTilstand === 'av') return ikkeAktiv();
    if (demoTilstand === 'ingen') return ingenTilgang(epost, null);
    innhold(epost, 0, null);
  }

  async function start() {
    if (demo) return demoTilstand === 'av' ? ikkeAktiv() : innlogging(null);
    if (!window.supabase || !cfg.url || !cfg.publishableKey) return melding('Mangler oppsett', 'Fant ikke config.js med Supabase-adresse.', undefined, 'v3-oppsett');
    // Egen økt for V3: aldri den automatiske beta-brukeren på lagsiden
    const client = window.supabase.createClient(cfg.url, cfg.publishableKey, { auth: { storageKey: 'sb-rv-v3-' + (cfg.mainSlug || 'main') } });
    const { data } = await client.auth.getSession();
    const bruker = data && data.session && data.session.user;
    const auto = cfg.autoLogin;
    if (bruker && !(auto && auto.email === bruker.email)) return etterInnlogging(client, bruker);
    if (bruker) await client.auth.signOut();
    innlogging(client);
  }
  start().catch((e) => melding('Noe gikk galt', esc(e && e.message), undefined, 'v3-feilside'));
})();

</script>
</body>
</html>
